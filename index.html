    };

    // Diagnóstico Q3 de cocinas MX desde la pestaña "Preguntas" (matriz autoritativa:
    // filas = preguntas con Bloque/Tema/Área/texto, columnas = cocinas con % por pregunta).
    // Es la fuente correcta del detalle por pregunta (el form crudo difería).
    const syncQ3PreguntasMX = async () => {
      const table = await fetchPublicSheetTable({ sheet: "Preguntas", customSheetId: Q3_MX_RESULTS_SHEET_ID, timeoutMs: 60000, retries: 1 });
      const cols = table.cols || [];
      const rows = table.rows || [];
      const hasLabels = cols.some(c => (c.label || "").trim().length > 2);
      const labels = hasLabels ? cols.map(c => (c.label || "").trim()) : ((rows[0] || {}).c || []).map(c => displaySheetCell(c).trim());
      const dataRows = hasLabels ? rows : rows.slice(1);
      const findCol = (...names) => labels.findIndex(l => names.some(n => normalizeText(l) === normalizeText(n)));
      const cBloque = findCol("Bloque"), cTema = findCol("Tema"), cArea = findCol("Área", "Area"), cMex = findCol("Preguntas MEX");
      // Columnas de cocinas de México (excluye CP y otros países).
      const kcols = [];
      labels.forEach((l, i) => {
        if (normalizeText(l).indexOf("MEXICO") === 0) {
          const parts = l.trim().split(/\s+/);
          const name = parts.slice(2).join(" ");
          if (!name || /\bCP\b/i.test(name)) return;   // saltar CPs
          kcols.push({ i, name, city: parts[1] || "" });
        }
      });
      if (!kcols.length) return null;
      const questions = [];
      const byKitchen = {}, meta = {};
      kcols.forEach(k => { const nm = normalizeText(k.name); byKitchen[nm] = {}; meta[nm] = { name: k.name, city: k.city }; });
      dataRows.forEach(row => {
        const c = row.c || [];
        const no = parseInt(displaySheetCell(c[0]), 10);
        if (!Number.isFinite(no)) return;
        questions.push({
          no,
          bloque: displaySheetCell(c[cBloque]) || "",
          tema: displaySheetCell(c[cTema]) || "",
          area: displaySheetCell(c[cArea]) || "City",
          mex: displaySheetCell(c[cMex]) || "",
        });
        kcols.forEach(k => { byKitchen[normalizeText(k.name)][no] = parsePctCell(c[k.i]); });
      });
      const pending = [];
      Object.keys(byKitchen).forEach(nm => {
        const vals = questions.map(q => byKitchen[nm][q.no]).filter(v => v != null);
        if (!vals.length) { pending.push(meta[nm].name); delete byKitchen[nm]; }
      });
      if (questions.length && Object.keys(byKitchen).length) {
        window.Q3_PREGUNTAS_MX = { questions, byKitchen, meta, pending };
        return window.Q3_PREGUNTAS_MX;
      }
      return null;
    };

    // Sincroniza el diagnóstico de los Centros de Producción desde la hoja
    // "Cp preguntas" (matriz: filas = preguntas, columnas = CPs con % por pregunta).
    const syncCpFromSheet = async () => {
      const table = await fetchPublicSheetTable({ sheet: "Cp preguntas", customSheetId: Q3_MX_RESULTS_SHEET_ID, timeoutMs: 60000, retries: 1 });
      const cols = table.cols || [];
      const rows = table.rows || [];
      const hasColLabels = cols.some(c => (c.label || "").trim().length > 2);
      const labels = hasColLabels ? cols.map(c => (c.label || "").trim()) : ((rows[0] || {}).c || []).map(c => displaySheetCell(c).trim());
      const dataRows = hasColLabels ? rows : rows.slice(1);
      // Detectar columnas de CP por su encabezado (ej. "CDMX 42 CP CDMX", "Bogotá 04 ACOPIO BOG").
      const cpCols = [];
      labels.forEach((lab, idx) => {
        if ((/\bCP\b/i.test(lab) || /ACOPIO/i.test(lab)) && /\d/.test(lab)) {
          const name = lab.replace(/^\S+\s+/, "").trim();       // quita la ciudad inicial
          const city = (lab.split(/\s+/)[0] || "").trim();
          const country = /BOG|BOGOT/i.test(lab) ? "Colombia" : /LIMA/i.test(lab) ? "Perú" : "México";
          cpCols.push({ idx, name, city, country });
        }
      });
      if (!cpCols.length) return null;
      const questions = [];
      const valsByCol = {}; cpCols.forEach(c => { valsByCol[c.idx] = []; });
      dataRows.forEach(row => {
        const c = row.c || [];
        const no = parseInt(displaySheetCell(c[0]), 10);
        if (!Number.isFinite(no)) return;
        const cpTema = displaySheetCell(c[2]) || "Sin tema";
        questions.push({
          no,
          bloque: cpBlockForTema(cpTema),
          tema: cpTema,
          area: displaySheetCell(c[3]) || "Sin área",
          mex: displaySheetCell(c[4]) || "",
          colper: displaySheetCell(c[5]) || displaySheetCell(c[4]) || "",
        });
        cpCols.forEach(cp => valsByCol[cp.idx].push(parsePctCell(c[cp.idx])));
      });
      const kitchens = cpCols
        .map(cp => ({ name: cp.name, country: cp.country, city: cp.city, values: valsByCol[cp.idx] }))
        .filter(k => k.values.some(v => v != null));   // solo CPs con datos cargados
      if (questions.length && kitchens.length) {
        window.CP_DETAIL_DATA = { questions, kitchens };
        return { questions: questions.length, kitchens: kitchens.length };
      }
      return null;
    };

    // Baseline del Q ANTERIOR para CP: lee "Cp preguntas" del sheet histórico
    // (1krQxz...) y calcula el % Basic y por tema de cada CP, para la variación pp.
    const syncCpPrevFromSheet = async () => {
      const table = await fetchPublicSheetTable({ sheet: "Cp preguntas", timeoutMs: 60000, retries: 1 });
      const cols = table.cols || [];
      const rows = table.rows || [];
      const hasColLabels = cols.some(c => (c.label || "").trim().length > 2);
      const labels = hasColLabels ? cols.map(c => (c.label || "").trim()) : ((rows[0] || {}).c || []).map(c => displaySheetCell(c).trim());
      const dataRows = hasColLabels ? rows : rows.slice(1);
      const cpCols = [];
      labels.forEach((lab, idx) => {
        if ((/\bCP\b/i.test(lab) || /ACOPIO/i.test(lab)) && /\d/.test(lab)) cpCols.push({ idx, name: lab.replace(/^\S+\s+/, "").trim() });
      });
      if (!cpCols.length) return null;
      const acc = {};
      cpCols.forEach(cp => { acc[normalizeText(cp.name)] = { vals: [], temaVals: {} }; });
      dataRows.forEach(row => {
        const c = row.c || [];
        const tema = displaySheetCell(c[2]) || "Sin tema";
        cpCols.forEach(cp => {
          const v = parsePctCell(c[cp.idx]);
          if (v == null) return;
          const a = acc[normalizeText(cp.name)];
          a.vals.push(v);
          (a.temaVals[tema] = a.temaVals[tema] || []).push(v);
        });
      });
      const prev = {};
      Object.keys(acc).forEach(nm => {
        const a = acc[nm];
        if (!a.vals.length) return;
        const basic = a.vals.reduce((x, y) => x + y, 0) / a.vals.length;
        const byTema = {};
        Object.keys(a.temaVals).forEach(t => { const arr = a.temaVals[t]; byTema[t] = arr.reduce((x, y) => x + y, 0) / arr.length; });
        prev[nm] = { basic, byTema };
      });
      if (Object.keys(prev).length) window.CP_PREV = prev;
      return prev;
    };

    // Reconcilia la lista de cocinas de MX con los nombres del Q3 (el sheet manda):
    // alinea por NÚMERO de cocina (renombra variantes como "39 MTY CENTRO" →
    // "39 MONTERREY CENTRO"), agrega las que falten y elimina duplicados. Así una
    // misma cocina no aparece dos veces por diferencias de nombre. No toca los CP.
    const reconcileMXKitchens = () => {
      if (!COUNTRIES.MX) return;
      const numMap = {};
      const addName = (name, city) => { const n = kitchenNumber(name); if (n && !numMap[n]) numMap[n] = { name: name, city: city || "" }; };
      const R = window.Q3_RESULTS_MX || {};
      Object.keys(R).forEach(k => addName(R[k].name, R[k].city));
      if (window.Q3_DATA) {
        Object.keys(window.Q3_DATA.answered || {}).forEach(nm => addName(nm, (window.Q3_DATA.answered[nm] || {}).city));
        (window.Q3_DATA.pending || []).forEach(nm => addName(nm));
      }
      // Renombrar cocinas (no CP) al nombre canónico del Q3 por número.
      COUNTRIES.MX.kitchens.forEach(k => {
        if (isCPKitchen(k)) return;
        const n = kitchenNumber(k.id);
        if (n && numMap[n] && normalizeText(k.id) !== normalizeText(numMap[n].name)) {
          k.id = numMap[n].name;
          if (numMap[n].city) k.city = numMap[n].city;
        }
      });
      // Agregar cocinas del Q3 que no existan (por número).
      const haveNum = {};
      COUNTRIES.MX.kitchens.forEach(k => { if (!isCPKitchen(k)) { const n = kitchenNumber(k.id); if (n) haveNum[n] = true; } });
      Object.keys(numMap).forEach(n => {
        if (!haveNum[n]) { COUNTRIES.MX.kitchens.push({ id: numMap[n].name, city: numMap[n].city, basic: null, seg: null, hig: null, limp: null, infra: null, ppl: null }); haveNum[n] = true; }
      });
      // Deduplicar (cocinas no CP) por número y por nombre normalizado.
      const seenNum = {}, seenNorm = {}, kept = [];
      COUNTRIES.MX.kitchens.forEach(k => {
        if (isCPKitchen(k)) { kept.push(k); return; }
        const n = kitchenNumber(k.id), nm = normalizeText(k.id);
        if ((n && seenNum[n]) || seenNorm[nm]) return;
        if (n) seenNum[n] = true;
        seenNorm[nm] = true;
        kept.push(k);
      });
      COUNTRIES.MX.kitchens.length = 0;
      COUNTRIES.MX.kitchens.push(...kept);
    };

    // ── Form data parser ─────────────────────────────────────────────────
    // Structure: Row 0 = kitchen names (col A = blank/label, col B+ = kitchen names)
    //            Row 1+ = one row per question (col A = question text/number, col B+ = values)
    // Values can be: 100/50/0, 1/0.5/0, "Sí"/"Parcial"/"No", etc.
    const parseFormAnswerValue = (cell) => {
      if (!cell) return null;
      const raw = cell.v ?? cell.f ?? null;
      if (raw === null || raw === "") return null;
      const n = parseFloat(String(raw).replace(",", ".").replace("%", ""));
      if (!isNaN(n)) {
        if (n > 1 && n <= 100) return Math.round(n);        // already 0-100
        if (n >= 0 && n <= 1)  return Math.round(n * 100);  // 0-1 scale
      }
      const t = normalizeText(displaySheetCell(cell));
      if (["SI", "YES", "CUMPLE", "COMPLETADO", "SI CUMPLE"].includes(t)) return 100;
      if (["PARCIAL", "PARCIALMENTE", "MEDIO", "EN PROCESO"].includes(t)) return 50;
      if (["NO", "NO CUMPLE", "INCUMPLE", "NONCOMPLIANT"].includes(t)) return 0;
      return null;
    };

    // Adds kitchens from the sheet that are missing from static COUNTRIES data.
    // extraKitchens = { MX: [{id, city}], CO: [...], PE: [...] }
    const mergeExtraKitchens = (extraKitchens) => {
      const PF_NORMS = new Set(['57 SANTAFE MED', '58 VIVA MED', '39 SALVIO', '04 ACOPIO BOG', '55 TITAN', '56 SANTAFE BOG', '61 CHICO CINNABON', '66 PLAZA CLARO CINNA'].map(normalizeText));
      let added = 0;
      for (const ck of ["MX", "CO", "PE"]) {
        const meta = (extraKitchens || {})[ck] || [];
        const kitchensArr = COUNTRIES[ck]?.kitchens;
        if (!kitchensArr) continue;
        // Purgar puntos físicos y duplicados por nombre normalizado.
        // (No se deduplica por número: en PE conviven 01 CP LIMA y 01 SAN ISIDRO.)
        const seenNorms = new Set();
        const filtered_ = kitchensArr.filter(k => {
          const norm = normalizeText(k.id);
          if (PF_NORMS.has(norm)) return false;
          if (seenNorms.has(norm)) return false;
          seenNorms.add(norm);
          return true;
        });
        if (filtered_.length !== kitchensArr.length) {
          kitchensArr.length = 0;
          kitchensArr.push(...filtered_);
        }
        const existingNorms = new Set(kitchensArr.map(k => normalizeText(k.id)));
        meta.forEach(({ id, city }) => {
          if (!id) return;
          const norm = normalizeText(id);
          if (PF_NORMS.has(norm)) return;
          // Deduplicar solo por nombre normalizado (no por número de cocina)
          if (existingNorms.has(norm)) return;
          kitchensArr.push({ id, city: city || "", basic: null, seg: null, hig: null, limp: null, infra: null, ppl: null });
          existingNorms.add(norm);
          added++;
        });
      }
      if (added > 0) filtered.reset();
      return added;
    };

        // Lee scores directamente de la hoja "Preguntas".
    // Cada cocina tiene su propia columna ("Colombia Bogotá 38 KENNEDY", etc.)
    // con valores por pregunta: "100%", "50%", "0%", "pending" o vacío.
    // IMPORTANTE: gviz devuelve los encabezados en table.cols[i].label (no en rows[0]).
    // Solo cuenta preguntas donde la columna del país (MEX o COL/PER) tiene texto.
    // Retorna { MX: { byNum, byName }, CO: { byNum, byName }, PE: { byNum, byName } }
    const parsePreguntasScores = (table) => {
      const rows = table.rows || [];
      const cols = table.cols || [];
      const empty = () => ({ byNum: {}, byName: {} });
      const result = { MX: empty(), CO: empty(), PE: empty() };
      if (!rows.length && !cols.length) return result;

      // gviz pone encabezados en cols[i].label cuando detecta la fila de headers.
      // Si cols[i].label está vacío, fallback a rows[0].c como encabezado.
      const hasColLabels = cols.some(c => (c.label || "").trim().length > 2);
      const headerLabels = hasColLabels
        ? cols.map(c => (c.label || "").trim())
        : (rows[0]?.c || []).map(c => displaySheetCell(c).trim());
      const dataRows = hasColLabels ? rows : rows.slice(1);

      let mxQCol = -1, coQCol = -1, bloqueCol = -1, temaCol = -1, noCol = -1, areaCol = -1;
      const kitchensByCountry = { MX: [], CO: [], PE: [] };

      headerLabels.forEach((raw, col) => {
        const h = normalizeText(raw);
        if (h === "NO" || h === "N" || h === "NUM" || h === "NUMERO" || h === "NUMBER") { noCol = col; return; }
        if (h === "BLOQUE") { bloqueCol = col; return; }
        if (h === "TEMA")   { temaCol   = col; return; }
        if (h === "AREA" || h === "PILAR" || h === "EQUIPO") { areaCol = col; return; }
        if (h.includes("PREGUNTA") && h.includes("MEX"))                         { mxQCol = col; return; }
        if (h.includes("PREGUNTA") && (h.includes("COL") || h.includes("PER"))) { coQCol = col; return; }
        if (raw.startsWith("México") || raw.startsWith("Mexico"))
          kitchensByCountry.MX.push({ col, id: raw.split(/\s+/).slice(2).join(" ") });
        else if (raw.startsWith("Colombia"))
          kitchensByCountry.CO.push({ col, id: raw.split(/\s+/).slice(2).join(" "), city: raw.split(/\s+/)[1] || "" });
        else if (raw.startsWith("Perú") || raw.startsWith("Peru"))
          kitchensByCountry.PE.push({ col, id: raw.split(/\s+/).slice(2).join(" ") });
      });

      const parseScore = (cell) => {
        const raw = displaySheetCell(cell);
        if (!raw) return null;
        const up = normalizeText(raw);
        if (up === "PENDING" || up === "PENDIENTE") return null;
        const n = parseFloat(raw.replace("%", "").replace(",", ".").trim());
        if (isNaN(n)) return null;
        if (n >= 0 && n <= 1)  return Math.round(n * 100);
        if (n > 1 && n <= 100) return n;
        return null;
      };

      const scores = {
        MX: Object.fromEntries(kitchensByCountry.MX.map(k => [k.id, []])),
        CO: Object.fromEntries(kitchensByCountry.CO.map(k => [k.id, []])),
        PE: Object.fromEntries(kitchensByCountry.PE.map(k => [k.id, []])),
      };
      // Per-kitchen per-bloque and per-tema score accumulators
      const bloqueAcc = {
        MX: Object.fromEntries(kitchensByCountry.MX.map(k => [k.id, {}])),
        CO: Object.fromEntries(kitchensByCountry.CO.map(k => [k.id, {}])),
        PE: Object.fromEntries(kitchensByCountry.PE.map(k => [k.id, {}])),
      };
      const temaAcc = {
        MX: Object.fromEntries(kitchensByCountry.MX.map(k => [k.id, {}])),
        CO: Object.fromEntries(kitchensByCountry.CO.map(k => [k.id, {}])),
        PE: Object.fromEntries(kitchensByCountry.PE.map(k => [k.id, {}])),
      };
      // Per-kitchen per-question raw score (0/50/100) — used for drilldown stats
      const questionAcc = {
        MX: Object.fromEntries(kitchensByCountry.MX.map(k => [k.id, {}])),
        CO: Object.fromEntries(kitchensByCountry.CO.map(k => [k.id, {}])),
        PE: Object.fromEntries(kitchensByCountry.PE.map(k => [k.id, {}])),
      };
      const qColFor = { MX: mxQCol, CO: coQCol, PE: coQCol };
      console.log("[Preguntas] cols — noCol:", noCol, "bloqueCol:", bloqueCol, "temaCol:", temaCol, "mxQCol:", mxQCol, "coQCol:", coQCol, "CO kitchens:", kitchensByCountry.CO.length);
      const questionsMeta = []; // { no, bloque, tema, mex, colper }
      let autoQNo = 0; // sequential counter when sheet has no "No." column

      dataRows.forEach(row => {
        const cells = row.c || [];
        const bloque  = bloqueCol >= 0 ? (displaySheetCell(cells[bloqueCol])?.trim() || "") : "";
        const tema    = temaCol   >= 0 ? (displaySheetCell(cells[temaCol  ])?.trim() || "") : "";
        const area    = areaCol   >= 0 ? (displaySheetCell(cells[areaCol  ])?.trim() || "") : "";
        const sheetNo = noCol     >= 0 ? parseInt(displaySheetCell(cells[noCol]))            : NaN;
        const mexText = mxQCol >= 0 ? (displaySheetCell(cells[mxQCol])?.trim() || "") : "";
        const coText  = coQCol >= 0 ? (displaySheetCell(cells[coQCol])?.trim() || "") : "";
        // Determine effective question number: prefer sheet value, fall back to auto-counter
        const isRealQuestion = (bloque || tema || mexText || coText);
        if (isRealQuestion) autoQNo++;
        const qNo = !isNaN(sheetNo) ? sheetNo : (isRealQuestion ? autoQNo : NaN);
        // Collect question metadata
        if (isRealQuestion) {
          questionsMeta.push({ no: qNo, bloque, tema, area, mex: mexText, colper: coText });
        }
        for (const ck of ["MX", "CO", "PE"]) {
          const qc = qColFor[ck];
          if (qc >= 0 && !displaySheetCell(cells[qc])) continue;
          kitchensByCountry[ck].forEach(({ col, id }) => {
            const v = parseScore(cells[col]);
            if (v !== null) {
              scores[ck][id].push(v);
              if (bloque) {
                if (!bloqueAcc[ck][id][bloque]) bloqueAcc[ck][id][bloque] = [];
                bloqueAcc[ck][id][bloque].push(v);
              }
              if (tema) {
                if (!temaAcc[ck][id][tema]) temaAcc[ck][id][tema] = [];
                temaAcc[ck][id][tema].push(v);
              }
              if (!isNaN(qNo)) questionAcc[ck][id][qNo] = v;
            }
          });
        }
      });

      for (const ck of ["MX", "CO", "PE"]) {
        for (const [id, vals] of Object.entries(scores[ck])) {
          if (!vals.length) continue;
          const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
          const norm = normalizeText(id);
          const num  = kitchenNumber(id);
          if (norm) result[ck].byName[norm] = avg;
          if (num)  result[ck].byNum[num]   = avg;
        }
        // Per-kitchen per-bloque averages + global per-bloque
        result[ck].byKitchenBloque = {};
        const globalBloqueAcc = {};
        for (const [id, bloques] of Object.entries(bloqueAcc[ck])) {
          const norm = normalizeText(id);
          if (!norm) continue;
          result[ck].byKitchenBloque[norm] = {};
          for (const [bloque, vals] of Object.entries(bloques)) {
            const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
            result[ck].byKitchenBloque[norm][bloque] = avg;
            if (!globalBloqueAcc[bloque]) globalBloqueAcc[bloque] = [];
            globalBloqueAcc[bloque].push(avg);
          }
        }
        result[ck].byBloque = {};
        for (const [bloque, avgs] of Object.entries(globalBloqueAcc)) {
          result[ck].byBloque[bloque] = avgs.reduce((a, b) => a + b, 0) / avgs.length;
        }
        // Per-kitchen per-tema + global per-tema
        result[ck].byKitchenTema = {};
        const globalTemaAcc = {};
        for (const [id, temas] of Object.entries(temaAcc[ck])) {
          const norm = normalizeText(id);
          if (!norm) continue;
          result[ck].byKitchenTema[norm] = {};
          for (const [tema, vals] of Object.entries(temas)) {
            const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
            result[ck].byKitchenTema[norm][tema] = avg;
            if (!globalTemaAcc[tema]) globalTemaAcc[tema] = [];
            globalTemaAcc[tema].push(avg);
          }
        }
        result[ck].byTema = {};
        for (const [tema, avgs] of Object.entries(globalTemaAcc)) {
          result[ck].byTema[tema] = avgs.reduce((a, b) => a + b, 0) / avgs.length;
        }
        // Per-kitchen per-question raw scores for dashboard drilldown
        result[ck].byKitchenQuestion = {};
        for (const [id, qScores] of Object.entries(questionAcc[ck])) {
          const norm = normalizeText(id);
          if (norm && Object.keys(qScores).length) result[ck].byKitchenQuestion[norm] = qScores;
        }
        // activeQuestionNos: derived from actual kitchen scores (questions with any data = in form)
        // Stored for use in dashboard to hide removed questions
      }
      // Also attach kitchen metadata so caller can add missing kitchens to COUNTRIES
      result._meta = {
        MX: kitchensByCountry.MX.map(k => ({ id: k.id, city: k.city || "" })),
        CO: kitchensByCountry.CO.map(k => ({ id: k.id, city: k.city || "" })),
        PE: kitchensByCountry.PE.map(k => ({ id: k.id, city: k.city || "" })),
      };
      // Attach question metadata list (shared across countries — bloque/tema/text from Preguntas sheet)
      result._questions = questionsMeta;
      return result;
    };


    // Parses Q1 2026 Preguntas sheet → per-topic and per-question global averages + per-kitchen scores.
    // Returns { byTema, byQuestion, byKitchen: { normId: { score, byQuestion } } } or null.
    const parsePrevQuarterCOTopicScores = (table) => {
      const rows = table.rows || [];
      const cols = table.cols || [];
      const hasColLabels = cols.some(c => (c.label || "").trim().length > 2);
      const headerLabels = hasColLabels
        ? cols.map(c => (c.label || "").trim())
        : (rows[0]?.c || []).map(c => displaySheetCell(c).trim());
      const dataRows = hasColLabels ? rows : rows.slice(1);

      let coQCol = -1, noCol = -1, temaCol = -1;
      const coKitchenMeta = []; // { col, normId }

      headerLabels.forEach((raw, col) => {
        const h = normalizeText(raw);
        if (h === "NO" || h === "N" || h === "NUM" || h === "NUMERO" || h === "NUMBER") { noCol = col; return; }
        if (h === "TEMA") { temaCol = col; return; }
        if (h.includes("PREGUNTA") && (h.includes("COL") || h.includes("PER"))) { coQCol = col; return; }
        if (raw.startsWith("Colombia")) {
          const id = raw.split(/\s+/).slice(2).join(" ");
          coKitchenMeta.push({ col, normId: normalizeText(id) });
        }
      });

      if (coKitchenMeta.length === 0) return null;

      const byTemaAcc = {};
      const byQuestion = {};
      const kitchenAcc = {};
      coKitchenMeta.forEach(({ normId }) => { kitchenAcc[normId] = { allScores: [], questionScores: {} }; });

      const parseScore = (cell) => {
        const raw = displaySheetCell(cell);
        if (!raw) return null;
        const up = normalizeText(raw);
        if (up === "PENDING" || up === "PENDIENTE") return null;
        const n = parseFloat(raw.replace("%", "").replace(",", ".").trim());
        if (isNaN(n)) return null;
        if (n >= 0 && n <= 1)  return Math.round(n * 100);
        if (n > 1 && n <= 100) return n;
        return null;
      };

      dataRows.forEach(row => {
        const cells = row.c || [];
        if (coQCol >= 0 && !displaySheetCell(cells[coQCol])) return;
        const tema = temaCol >= 0 ? (displaySheetCell(cells[temaCol])?.trim() || "") : "";
        const qNo  = noCol   >= 0 ? parseInt(displaySheetCell(cells[noCol])) : NaN;

        const globalScores = [];
        coKitchenMeta.forEach(({ col, normId }) => {
          const v = parseScore(cells[col]);
          if (v !== null) {
            globalScores.push(v);
            kitchenAcc[normId].allScores.push(v);
            if (!isNaN(qNo)) kitchenAcc[normId].questionScores[qNo] = v;
          }
        });
        if (globalScores.length === 0) return;

        const globalAvg = globalScores.reduce((a, b) => a + b, 0) / globalScores.length;
        if (tema) {
          if (!byTemaAcc[tema]) byTemaAcc[tema] = { total: 0, count: 0 };
          byTemaAcc[tema].total += globalAvg;
          byTemaAcc[tema].count += 1;
        }
        if (!isNaN(qNo)) byQuestion[qNo] = globalAvg;
      });

      const byTema = {};
      for (const [t, { total, count }] of Object.entries(byTemaAcc)) byTema[t] = total / count;

      const byKitchen = {};
      for (const [normId, { allScores, questionScores }] of Object.entries(kitchenAcc)) {
        if (!allScores.length) continue;
        byKitchen[normId] = {
          score: allScores.reduce((a, b) => a + b, 0) / allScores.length,
          byQuestion: questionScores,
        };
      }

      return { byTema, byQuestion, byKitchen };
    };

    // Autodetección de la pestaña de diagnóstico del Q ACTUAL.
    // Cada trimestre se crea una pestaña nueva "Preguntas Q<n>" (opcionalmente con año)
    // y las anteriores se conservan. Buscamos la más reciente que exista; si no hay
    // ninguna con formato de trimestre, usamos la pestaña base "Preguntas".
    const parseQuarterLabel = (name) => {
      const m = normalizeText(name).match(/Q\s*([1-4])(?:\s+(\d{4}))?/);
      if (!m) return null;
      return { q: +m[1], y: m[2] ? +m[2] : null, label: `Q${m[1]}${m[2] ? " " + m[2] : ""}` };
    };
    const detectCurrentDiagSheet = async () => {
      const now = new Date();
      const cy = now.getFullYear();
      const cq = Math.floor(now.getMonth() / 3) + 1;
      const candidates = [];
      // del más reciente al más antiguo (incluye el trimestre siguiente por si se adelanta la carga)
      for (let q = Math.min(cq + 1, 4); q >= 1; q--) {
        candidates.push(`Preguntas Q${q} ${cy}`);
        candidates.push(`Preguntas Q${q}`);
      }
      for (const name of candidates) {
        try {
          const t = await fetchPublicSheetTable({ sheet: name, timeoutMs: 25000, retries: 0 });
          if (t && (t.rows || []).length > 5) return { name, label: parseQuarterLabel(name)?.label || name };
        } catch (_) { /* la pestaña no existe: seguimos */ }
      }
      return null;
    };

    const syncFormDataFromSheets = async () => {
      const results = [];
      try {
        let diagSheet = "Preguntas";
        try {
          const det = await detectCurrentDiagSheet();
          if (det) { diagSheet = det.name; window.CURRENT_DIAG_LABEL = det.label; }
          else { window.CURRENT_DIAG_LABEL = null; }
        } catch (_) { /* si falla la detección, usamos la pestaña base */ }
        const table = await fetchPublicSheetTable({ sheet: diagSheet, timeoutMs: 60000, retries: 2 });
        const formScores = parsePreguntasScores(table);
        if (diagSheet !== "Preguntas") results.push(`Diagnóstico Q actual: "${diagSheet}"`);
        const counts = ["MX","CO","PE"].map(k => `${k}:${Object.keys(formScores[k].byName).length}`).join(" ");
        results.push(`Preguntas ✓ ${counts} cocinas`);
        window.FORM_SCORES = formScores;
        // Puntos Físicos (PF): excluir del conteo
        const PF_NORMS = new Set(['57 SANTAFE MED', '58 VIVA MED', '39 SALVIO', '04 ACOPIO BOG', '55 TITAN', '56 SANTAFE BOG', '61 CHICO CINNABON', '66 PLAZA CLARO CINNA'].map(normalizeText));
        for (const ck of ["MX", "CO", "PE"]) {
          PF_NORMS.forEach(norm => {
            delete formScores[ck].byName[norm];
            delete formScores[ck].byKitchenBloque?.[norm];
            delete formScores[ck].byKitchenTema?.[norm];
            delete formScores[ck].byKitchenQuestion?.[norm];
            Object.keys(formScores[ck].byNum).forEach(num => {
              if (norm.startsWith(num + " ") || norm === num) delete formScores[ck].byNum[num];
            });
          });
        }
        // Merge new kitchens into COUNTRIES and save metadata for page-reload restore
        const extraKitchens = formScores._meta || {};
        const added = mergeExtraKitchens(extraKitchens);
        window.EXTRA_KITCHENS = extraKitchens; // persisted via saveSyncData
        if (added > 0) results.push(`+${added} cocinas nuevas del sheet`);
        // Agregar cocinas nuevas a SHEET_DETAIL_DATA.kitchens para que sheetKitchenFor() las encuentre
        if (added > 0 && window.SHEET_DETAIL_DATA?.kitchens) {
          const countryNames = { MX: "México", CO: "Colombia", PE: "Perú" };
          const numQ = (window.SHEET_DETAIL_DATA.questions || []).length || 35;
          const existingSheetNorms = new Set(window.SHEET_DETAIL_DATA.kitchens.map(k => normalizeText(k.name)));
          for (const ck of ["MX", "CO", "PE"]) {
            (extraKitchens[ck] || []).forEach(({ id, city }) => {
              if (!id || existingSheetNorms.has(normalizeText(id))) return;
              window.SHEET_DETAIL_DATA.kitchens.push({
                name: id, country: countryNames[ck] || ck, city: city || "",
                values: Array(numQ).fill(null),
              });
              existingSheetNorms.add(normalizeText(id));
            });
          }
        }
        // Actualizar textos de preguntas en SHEET_DETAIL_DATA desde el sheet Preguntas.
        // Solo actualiza campos de texto (colper, mex, bloque, tema) por coincidencia de question.no
        // sin cambiar los índices del array (los índices deben seguir alineados con kitchen.values).
        // Preguntas nuevas del sheet (no en el data estático) se agregan al final del array.
        if (formScores._questions?.length && window.SHEET_DETAIL_DATA?.questions) {
          const metaByNo = {};
          formScores._questions.forEach(q => { if (q.no) metaByNo[q.no] = q; });
          // 1. Actualizar texto de preguntas existentes sin cambiar índices
          window.SHEET_DETAIL_DATA.questions.forEach(q => {
            const meta = metaByNo[q.no];
            if (meta) {
              if (meta.colper) q.colper = meta.colper;
              if (meta.mex)    q.mex    = meta.mex;
              if (meta.bloque) q.bloque = meta.bloque;
              if (meta.tema)   q.tema   = meta.tema;
              if (meta.area && (!q.area || q.area === "Sin área"))   q.area   = meta.area;
              // Si el área sigue siendo "Sin área", intentar herencia por bloque
              if ((!q.area || q.area === "Sin área") && q.bloque) {
                const sibling = window.SHEET_DETAIL_DATA.questions.find(eq =>
                  eq !== q && eq.bloque === q.bloque && eq.area && eq.area !== "Sin área"
                );
                if (sibling) q.area = sibling.area;
              }
            }
          });
          // 2. Agregar preguntas nuevas del sheet al final del array
          const existingNos = new Set(window.SHEET_DETAIL_DATA.questions.map(q => q.no));
          let newQCount = 0;
          formScores._questions.forEach(q => {
            if (q.no && !existingNos.has(q.no)) {
              // Herencia de área: si el sheet no provee área, buscar una pregunta
              // del mismo bloque que ya tenga área asignada y usarla.
              const inheritedArea = q.area
                || window.SHEET_DETAIL_DATA.questions.find(eq =>
                    eq.bloque === (q.bloque || "Sin bloque") && eq.area && eq.area !== "Sin área"
                  )?.area
                || "Sin área";
              window.SHEET_DETAIL_DATA.questions.push({
                no:     q.no,
                bloque: q.bloque  || "Sin bloque",
                tema:   q.tema    || "Sin tema",
                mex:    q.mex     || "",
                colper: q.colper  || q.mex || "",
                area:   inheritedArea,
              });
              newQCount++;
            }
          });
          if (newQCount > 0) results.push(`+${newQCount} preguntas nuevas del sheet`);
        }
      } catch (e) {
        results.push(`Preguntas ✗ ${(e.message || String(e)).slice(0, 60)}`);
      }
      // Fetch Q1 2026 Preguntas (Colombia comparison)
      try {
        const Q1_SHEET_ID = "1hzruF9k078PlqZ7WKm4pg2kuNNjW9lcFijTKFJaoHhU";
        const prevTable = await fetchPublicSheetTable({
          sheet: "Preguntas", timeoutMs: 60000, retries: 1, customSheetId: Q1_SHEET_ID
        });
        const prevScores = parsePrevQuarterCOTopicScores(prevTable);
        if (prevScores && Object.keys(prevScores.byTema).length > 0) {
          window.PREV_CO_SCORES = prevScores;
          results.push(`Q1 2026 ✓ ${Object.keys(prevScores.byTema).length} temas CO`);
        } else {
          results.push("Q1 2026 ✗ Sin columnas CO");
        }
      } catch (e) {
        results.push(`Q1 2026 ✗ ${(e.message || String(e)).slice(0, 50)}`);
      }
      return { kitchens: [], results };
    };


    // Parses "% Dot por cocina MX": col A = kitchen name, col C = DOT% (decimal 0–1 or integer 0–100)
    const parseDotMxTable = (table) => {
      const result = {};
      (table.rows || []).slice(1).forEach(row => {
        const cells = row.c || [];
        const kitchenRaw = displaySheetCell(cells[0]);
        const valueRaw   = cells[2]?.v ?? cells[2]?.f ?? null;
        if (!kitchenRaw) return;
        let pct = parseFloat(String(valueRaw ?? "").replace(",", ".").replace("%", ""));
        if (isNaN(pct)) return;
        // Google Sheets stores percentages as decimals (0.95 = 95%)
        if (pct > 0 && pct <= 1) pct = pct * 100;
        result[kitchenRaw] = pct;
      });
      return result;
    };

    const syncDotMxFromSheets = async () => {
      const table = await fetchPublicSheetTable({ sheet: "% Dot por cocina MX", timeoutMs: 90000, retries: 1 });
      const parsed = parseDotMxTable(table);
      if (Object.keys(parsed).length > 0) {
        window.DOT_MX_DATA = parsed;
      }
      return parsed;
    };

    byId("syncBtn").addEventListener("click", async () => {
      const button = byId("syncBtn");
      const msg = byId("apiMsg");
      button.disabled = true;
      button.innerHTML = "<span>&#x21bb;</span><span>Cargando...</span>";
      msg.style.display = "block";
      msg.textContent = "Conectando con Google Sheets... puede tardar hasta 2 minutos si Google responde lento.";
      try {
        let detailTable = { rows: [] };
        let detailStatus = "Detalle x Cocina sin cambios";
        try {
          detailTable = await fetchPublicSheetTable({ gid: "679204101", timeoutMs: 90000, retries: 1 });
          detailStatus = `${detailTable.rows?.length || 0} filas de Detalle x Cocina`;
        } catch (error) {
          detailStatus = `Detalle x Cocina sin cambios (${error.message})`;
        }
        const fixes      = await syncFixesFromSheets();
        const formResult = await syncFormDataFromSheets();
        const dotResult  = await syncDotMxFromSheets();
        applyPrevQTransition();  // fusiona cierre proyectado Q anterior donde falte diagnóstico del Q actual
        try { await syncQ3ResultsMX(); } catch (e) { /* si falla, se usa lo congelado/guardado */ }
        try { await syncQ3PreguntasMX(); } catch (e) { /* fuente autoritativa por pregunta; si falla, se usa Resultados/crudo */ }
        let cpStr = "";
        try { const cp = await syncCpFromSheet(); if (cp) cpStr = `CP: ${cp.kitchens} centros · ${cp.questions} preguntas`; } catch (e) { /* se usa CP estático/guardado */ }
        try { await syncCpPrevFromSheet(); } catch (e) { /* sin baseline de CP → sin variación */ }
        buildQ3MX();             // MX opera sobre el Q3 (preserva el Q2 recién sincronizado para el comparativo)
        reconcileMXKitchens();   // alinea nombres al Q3 y elimina duplicados por número
        const syncAt = new Date().toISOString();
        saveSyncData({ lastSyncAt: syncAt });
        const now = formatSyncMetaDate(syncAt);
        render();
        const totalPlanes = (fixes.MX || []).length + (fixes.CO || []).length + (fixes.PE || []).length + (fixes.CP || []).length;
        const formParts  = (formResult.results || []).join(" · ");
        const dotCocinas = Object.keys(dotResult || {}).length;
        const statusIcon = window.LAST_FIX_SYNC_ANY_SUCCESS ? "✅" : "⚠️";
        const hint = !window.LAST_FIX_SYNC_ANY_SUCCESS
          ? " · Verifica que el archivo de Sheets este publicado en la web (Archivo -> Compartir -> Publicar en la web)."
          : "";
        const formStr = formResult.kitchens?.length
          ? `Forms: ${formParts} (${formResult.kitchens.length} cocinas)`
          : (formParts ? `Forms: ${formParts}` : "");
        const dotStr  = dotCocinas > 0 ? `% Dot MX: ${dotCocinas} cocinas` : "";
        const fixStr  = `Fixes (${totalPlanes} total): ${window.LAST_FIX_SYNC_STATUS || `MX ${fixes.MX.length}, CO ${fixes.CO.length}, PE ${fixes.PE.length}, CP ${(fixes.CP || []).length}`}`;
        msg.textContent = `${statusIcon} ${[detailStatus, formStr, fixStr, dotStr, cpStr].filter(Boolean).join(" · ")} · ${now}.${hint}`;

      } catch (error) {
        msg.textContent = `Error al conectar con Google Sheets: ${error.message}`;
      } finally {
        button.disabled = false;
        button.innerHTML = "<span>&#x21bb;</span><span>Sincronizar Sheets</span>";
      }
    });

    loadSavedSync();
    applyPrevQTransition();  // aplica transición Q anterior → Q actual con datos restaurados
    buildQ3MX();             // MX sobre el Q3 (usa el Q2 guardado localmente como comparativo)
    reconcileMXKitchens();
    render();

    // Auto-sync al cargar: si los datos tienen más de 1 hora o no hay sync guardado,
    // sincroniza automáticamente con Google Sheets sin que el usuario tenga que hacer clic.
    (async () => {
      const saved = syncStorage.read();
      const lastSync = saved?.lastSyncAt ? new Date(saved.lastSyncAt) : null;
      const hoursSince = lastSync ? (Date.now() - lastSync.getTime()) / 36e5 : Infinity;
      if (hoursSince > 1) {
        await new Promise(r => setTimeout(r, 800)); // esperar render inicial
        byId("syncBtn").click();
      }
    })();
  </script>
</body>
</html>
