        </div>`;

      modal.addEventListener("click", e => { if (e.target === modal) modal.remove(); });
      document.addEventListener("keydown", function esc(e) {
        if (e.key === "Escape") { modal.remove(); document.removeEventListener("keydown", esc); }
      });
      document.body.appendChild(modal);
    };

    const renderGantt = () => {
      const today = new Date(); today.setHours(0,0,0,0);

      // ── Period axis: Apr + May compressed, Jun week-by-week ──
      const periods = ganttQuarterPeriods();
      const MONTH_W = 110; // px for whole-month column
      const WEEK_W  =  88; // px for weekly column
      let offset = 0;
      periods.forEach(p => {
        p.width   = p.isWeek ? WEEK_W : MONTH_W;
        p.startPx = offset;
        p.endPx   = offset + p.width;
        offset   += p.width;
      });
      const TOTAL_W = offset;

      // Non-linear date → pixel (each period has its own px/day ratio)
      const dateToPx = (date) => {
        if (!date) return null;
        const d0 = new Date(date); d0.setHours(0,0,0,0);
        for (const p of periods) {
          if (d0 >= p.start && d0 <= p.end) {
            const span = Math.max(1, p.end - p.start);
            return p.startPx + ((d0 - p.start) / span) * p.width;
          }
        }
        return d0 < periods[0].start ? 0 : TOTAL_W;
      };

      const todayPx = dateToPx(today);

      // Áreas disponibles (sin filtro de estado para poblar el selector)
      const _allGanttFixes = fixesForCurrentType().filter(fix => !!(fix.iniciativa || fix.subcategoria || fix.basic));
      const ganttAreas = [...new Set(_allGanttFixes.map(f => (f.area || "").trim()).filter(Boolean))].sort();

      const rawFixes = _allGanttFixes.filter(fix => {
        if (state.cityFilter !== "Todas" && normalizeText(fix.ciudad) !== normalizeText(state.cityFilter)) return false;
        if (state.ganttArea !== "all" && normalizeText(fix.area) !== normalizeText(state.ganttArea)) return false;
        if (state.ganttPriority !== "all" && normalizeText(fix.prioridad) !== normalizeText(state.ganttPriority)) return false;
        const s = ganttFixStatus(fix);
        if (state.ganttStatuses.size > 0 && !state.ganttStatuses.has(s)) return false;
        return true;
      });

      const datedFixes   = rawFixes.filter(fix => ganttStartDate(fix) || ganttEndDate(fix));
      const undatedFixes = rawFixes.filter(fix => !ganttStartDate(fix) && !ganttEndDate(fix));

      const filterHead = `
        <div class="detail-head">
          <div>
            <div class="detail-title">Gantt · Planes de Acción</div>
            <div class="detail-sub">${data().name} · ${state.cityFilter === "Todas" ? "Todas las ciudades" : state.cityFilter} · ${typeLabel()} · Hoy: ${today.toLocaleDateString("es-CO",{weekday:"short",day:"numeric",month:"long",year:"numeric"})}</div>
          </div>
          <div class="city-control" style="margin-left:auto">
            <div style="display:flex;gap:0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;flex-shrink:0">
              <button type="button" data-gantt-groupby="kitchen"
                style="padding:6px 13px;font-size:12px;border:0;border-right:1px solid var(--border);border-radius:0;cursor:pointer;
                       background:${state.ganttGroupBy==="kitchen"?"var(--soft)":"transparent"};
                       font-weight:${state.ganttGroupBy==="kitchen"?"650":"400"};
                       color:${state.ganttGroupBy==="kitchen"?"var(--dark-blue)":"var(--text-muted)"}">
                Por cocina
              </button>
              <button type="button" data-gantt-groupby="area"
                style="padding:6px 13px;font-size:12px;border:0;border-radius:0;cursor:pointer;
                       background:${state.ganttGroupBy==="area"?"var(--soft)":"transparent"};
                       font-weight:${state.ganttGroupBy==="area"?"650":"400"};
                       color:${state.ganttGroupBy==="area"?"var(--dark-blue)":"var(--text-muted)"}">
                Por área
              </button>
            </div>
            <span style="font-size:11px;color:var(--text-muted);font-weight:500">Estado</span>
            <div style="display:flex;gap:4px;align-items:center">
              ${[
                {v:"open",         label:"A tiempo",      color:"#0b769f"},
                {v:"overdue",      label:"Atrasados",     color:"#96607d"},
                {v:"done",         label:"Completados",   color:"#4a9070"},
                {v:"depriorizado", label:"Despriorizado", color:"#94a3b8"},
              ].map(({v, label, color}) => {
                const active = state.ganttStatuses.has(v);
                return `<button type="button" data-gantt-status="${v}"
                  style="padding:3px 10px;font-size:11px;border:1.5px solid ${color};border-radius:999px;cursor:pointer;
                         background:${active ? color : "transparent"};color:${active ? "#fff" : color};
                         font-weight:${active ? "650" : "400"};transition:all 0.15s">${label}</button>`;
              }).join("")}
            </div>
            ${ganttAreas.length > 0 ? `
            <span style="font-size:11px;color:var(--text-muted);font-weight:500">Área</span>
            <select id="ganttAreaFilter" style="min-width:120px">
              <option value="all" ${state.ganttArea==="all"?"selected":""}>Todas</option>
              ${ganttAreas.map(a => `<option value="${a}" ${state.ganttArea===a?"selected":""}>${a}</option>`).join("")}
            </select>` : ""}
            <label for="ganttPriority">Prioridad</label>
            <select id="ganttPriority" style="min-width:120px">
              <option value="all"  ${state.ganttPriority==="all"  ?"selected":""}>Todas</option>
              <option value="Alta" ${state.ganttPriority==="Alta" ?"selected":""}>Alta</option>
              <option value="Media"${state.ganttPriority==="Media"?"selected":""}>Media</option>
              <option value="Baja" ${state.ganttPriority==="Baja" ?"selected":""}>Baja</option>
            </select>
          </div>
        </div>`;

      if (!datedFixes.length) {
        byId("gantt").innerHTML = `<article class="panel">${filterHead}<div class="empty" style="padding:40px 0">No hay planes de acción con fechas para el filtro actual.<br><span style="font-size:12px;color:var(--text-muted)">Prueba cambiando los filtros o sincroniza con Google Sheets.</span></div></article>`;
        return;
      }

      // ── Shared overlays ──────────────────────────────────
      // Grid lines at each period boundary
      const gridLines = periods.map(p =>
        `<div style="position:absolute;top:0;bottom:0;left:${p.startPx}px;width:1px;background:rgba(217,224,228,0.6)"></div>`
      ).join("")
      + `<div style="position:absolute;top:0;bottom:0;left:${TOTAL_W}px;width:1px;background:rgba(217,224,228,0.6)"></div>`;

      // Current-week column shading
      const weekBg = periods.filter(p => p.isCurrentWeek).map(p =>
        `<div style="position:absolute;top:0;bottom:0;left:${p.startPx}px;width:${p.width}px;background:rgba(231,246,252,0.55)"></div>`
      ).join("");

      const todayLine = todayPx !== null ? `
        <div class="gantt-today-marker" style="left:${todayPx}px">
          <span class="gantt-today-label">${today.toLocaleDateString("es-CO",{day:"numeric",month:"short"})}</span>
        </div>` : "";

      // ── Two-row header ────────────────────────────────────
      // Row 1: merged month names
      const monthGroups = [];
      periods.forEach(p => {
        const last = monthGroups[monthGroups.length - 1];
        if (last && last.name === p.monthName) { last.endPx = p.endPx; }
        else monthGroups.push({ name: p.monthName, month: p.month, startPx: p.startPx, endPx: p.endPx });
      });
      const headerTop = monthGroups.map(g => {
        const isExp = state.ganttExpandedMonths?.has(g.month);
        return `
        <div data-gantt-month="${g.month}" title="${isExp ? "Colapsar" : "Expandir"} ${g.name}" style="position:absolute;left:${g.startPx}px;width:${g.endPx-g.startPx}px;height:100%;
             border-right:1px solid var(--border);display:flex;align-items:center;gap:5px;padding:0 8px;overflow:hidden;cursor:pointer">
          <span style="font-size:9px;color:var(--slate);flex-shrink:0">${isExp ? "&#9662;" : "&#9656;"}</span>
          <span style="font-size:11px;font-weight:650;color:var(--slate);text-transform:capitalize;white-space:nowrap">${g.name}</span>
        </div>`;
      }).join("");

      // Row 2: individual period labels
      const headerBottom = periods.map(p => `
        <div style="position:absolute;left:${p.startPx}px;width:${p.width}px;height:100%;
             border-right:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;
             background:${p.isCurrentWeek?"#e7f6fc":"transparent"}">
          <span style="font-size:${p.isWeek?"10":"11"}px;font-weight:${p.isCurrentWeek?"650":"400"};
                color:${p.isCurrentWeek?"#0b769f":"var(--text-muted)"};white-space:nowrap">${p.shortLabel}</span>
        </div>`).join("");

      // ── Status config ───────────────────────────────────
      const SC = {
        open:         { color: "#0b769f", bg: "#e7f6fc", label: "A tiempo"      },
        overdue:      { color: "#96607d", bg: "#f4eaf0", label: "Atrasado"      },
        done:         { color: "#4a9070", bg: "#eef3f0", label: "Completado"    },
        depriorizado: { color: "#94a3b8", bg: "#f1f5f9", label: "Despriorizado" },
      };

      // ── Group fixes by kitchen or area ──────────────────
      const groups = [];
      if (state.ganttGroupBy === "area") {
        const areaMap = new Map();
        datedFixes.forEach(fix => {
          const area = fix.area || fix.responsable || "Sin área";
          if (!areaMap.has(area)) areaMap.set(area, []);
          areaMap.get(area).push(fix);
        });
        [...areaMap.entries()]
          .sort(([a], [b]) => String(a).localeCompare(String(b), "es"))
          .forEach(([area, fixes]) => {
            // Compute kitchen-level status: a kitchen is "done" only if ALL its fixes are done
            const kitchenMap = new Map();
            fixes.forEach(fix => {
              const k = fix.cocina || "Sin cocina";
              if (!kitchenMap.has(k)) kitchenMap.set(k, []);
              kitchenMap.get(k).push(ganttFixStatus(fix));
            });
            let kDone = 0, kOverdue = 0, kOpen = 0;
            kitchenMap.forEach(statuses => {
              if (statuses.every(s => s === "done"))       kDone++;
              else if (statuses.some(s => s === "overdue")) kOverdue++;
              else                                          kOpen++;
            });
            const kTotal = kitchenMap.size;
            groups.push({ label: area, sublabel: `${fixes.length} plan${fixes.length !== 1 ? "es" : ""}`, fixes, kDone, kOverdue, kOpen, kTotal });
          });
      } else {
        const usedFixes = new Set();
        filtered().forEach(kitchen => {
          const kFixes = datedFixes.filter(fix => fixMatchesKitchen(fix, kitchen, state.country));
          if (!kFixes.length) return;
          kFixes.forEach(fix => usedFixes.add(fix));
          groups.push({ label: kitchen.id, sublabel: kitchen.city, fixes: kFixes, kitchen });
        });
        const unmatched = datedFixes.filter(fix => !usedFixes.has(fix));
        if (unmatched.length) groups.push({ label: "Planes generales", sublabel: data().name, fixes: unmatched });
      }

      // Proyección del cierre de una cocina aplicando sus planes de acción.
      //  · mode "all"  → cierre proyectado: se completan TODOS los planes salvo
      //                  los despriorizados (Pendiente + En proceso + Ejecutado).
      //  · mode "done" → cómo va hoy: solo con los planes ya completados/ejecutados.
      const ganttStatusIsDone  = (fix) => ["EJECUTADO","CERRADO","CERRADA","REALIZADO"].includes(normalizeText(fixStatusValue(fix)));
      const ganttStatusIsDepri = (fix) => normalizeText(fixStatusValue(fix)) === "DESPRIORIZADO";
      const ganttProjected = (kitchen, mode) => {
        if (!kitchen) return null;
        const fsK = (window.FORM_SCORES || {})[state.country];
        const norm = normalizeText(kitchen.id);
        const formQ = fsK?.byKitchenQuestion?.[norm] || null;
        const sheetKitchen = sheetKitchenFor(kitchen);
        const hasPerQ = !!formQ || !!(sheetKitchen && (sheetKitchen.values || []).some(v => v != null));
        const questions = detailDataForKitchen(kitchen).questions.map((q, i) => ({ ...q, index: i }));
        if (!questions.length) return null;
        const isResolved = mode === "done" ? ganttStatusIsDone : (fix) => !ganttStatusIsDepri(fix);
        const allFixes = fixesForKitchen(kitchen).filter(fix => fixMatchesKitchen(fix, kitchen, state.country));
        const resolvingFixes = allFixes.filter(isResolved);

        // Caso A: hay respuesta por pregunta (o valores de hoja) → proyección directa.
        if (hasPerQ) {
          const vals = [];
          questions.forEach(q => {
            const sv = sheetKitchen ? sheetKitchen.values[q.index] : null;
            const fv = formQ ? (formQ[q.no] ?? null) : null;
            const value = formQ ? fv : (sv != null ? sv : null);
            if (value == null) return;
            const covered = resolvingFixes.some(fix => fixMatchesQuestion(fix, q, state.country));
            vals.push((covered && value < 100) ? 100 : value);
          });
          return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
        }

        // Caso B (fallback): solo hay % por sub-área (cocinas del tab Resultados).
        // El déficit de cada sub-área se atribuye a los básicos que tienen plan
        // (un básico con plan = básico incumplido). Completar los planes no
        // despriorizados elimina su parte del déficit; los despriorizados quedan.
        const temaMap = fsK?.byKitchenTema?.[norm];
        const S = window.Q3_SCHEMA;
        if (!temaMap || !S) return kitchenScore(kitchen);
        let totalPts = 0, totalQ = 0;
        S.subareas.forEach(sa => {
          const P = temaMap[sa.name];
          if (P == null) return;
          const n = sa.questionNos.length;
          const saQs = questions.filter(q => q.tema === sa.name);
          const failing  = saQs.filter(q => allFixes.some(fix => fixMatchesQuestion(fix, q, state.country)));
          const resolved = saQs.filter(q => resolvingFixes.some(fix => fixMatchesQuestion(fix, q, state.country)));
          let avg;
          if (!failing.length || P >= 100) {
            avg = P;
          } else {
            const deficitPerQ = Math.min(100, (100 - P) * n / failing.length);
            const unresolved = failing.length - resolved.length;
            avg = Math.max(0, Math.min(100, 100 - (unresolved * deficitPerQ) / n));
          }
          totalPts += avg * n;
          totalQ += n;
        });
        return totalQ ? totalPts / totalQ : kitchenScore(kitchen);
      };
      const ganttProjBadge = (val, label) => {
        if (val == null) return "";
        const s = getStatus(val);
        return `<span style="font-size:10px;font-weight:650;color:${s.color};background:${s.bg};padding:1px 7px;border-radius:999px;white-space:nowrap">${label} ${Math.round(val)}%</span>`;
      };

      // ── Render rows ──────────────────────────────────────
      const groupsHtml = groups.map(group => {
        // Status badge for area groups
        let groupStatusBadge = "";
        if (state.ganttGroupBy === "area" && group.kTotal > 0) {
          const allDone = group.kDone === group.kTotal;
          const pct = Math.round(group.kDone / group.kTotal * 100);
          if (allDone) {
            groupStatusBadge = `<span style="font-size:10px;font-weight:650;color:#4a9070;background:#eef3f0;padding:1px 7px;border-radius:999px;margin-left:4px">Completado</span>`;
          } else {
            const color = group.kOverdue > 0 ? "#96607d" : "#0b769f";
            const bg    = group.kOverdue > 0 ? "#f4eaf0" : "#e7f6fc";
            groupStatusBadge = `<span style="font-size:10px;font-weight:650;color:${color};background:${bg};padding:1px 7px;border-radius:999px;margin-left:4px">${pct}% · ${group.kDone}/${group.kTotal} cocinas</span>`;
          }
        }
        const projFull = group.kitchen ? ganttProjected(group.kitchen, "all") : null;
        const projDone = group.kitchen ? ganttProjected(group.kitchen, "done") : null;
        const curScore = group.kitchen ? kitchenScore(group.kitchen) : null;
        const curBadge = curScore != null ? `<span style="font-size:12px;font-weight:700;color:${getStatus(curScore).color}">${Math.round(curScore)}%</span>` : "";
        const nFixes = group.fixes.length;
        const gBudget = group.fixes.reduce((s, fix) => s + (group.kitchen ? fixBudgetForKitchen(fix, group.kitchen) : fixBudgetAmount(fix)), 0);
        const groupRow = `
          <div class="gantt-row gantt-group-row">
            <div class="gantt-left-col" style="background:var(--soft);border-right:2px solid var(--border)">
              <div style="font-weight:650;color:var(--dark-blue);font-size:12px;display:flex;align-items:center;flex-wrap:wrap;gap:6px">${group.label}${curBadge}${groupStatusBadge}</div>
              <div style="font-size:11px;color:var(--text-muted)">${group.sublabel}${group.kitchen ? ` · ${nFixes} plan${nFixes !== 1 ? "es" : ""}` : ""}${gBudget > 0 ? ` · ${formatMoney(gBudget)}` : ""}</div>
            </div>
            <div class="gantt-right-col" style="width:${TOTAL_W}px;background:var(--soft)">${weekBg}${gridLines}${todayLine}</div>
            ${group.kitchen ? `<div class="gantt-proj-col">${projFull != null ? ganttProjBadge(projFull, "Proyectado") : ""}${projDone != null ? ganttProjBadge(projDone, "Con completados") : ""}</div>` : ""}
          </div>`;

        // In area mode: group by basic (question), each row = one basic; kitchen mode: one row per fix
        const planEntries = state.ganttGroupBy === "area"
          ? (() => {
              const basicMap = new Map();
              group.fixes.forEach(fix => {
                const bk = encodeURIComponent(normalizeText(fix.basic || fix.subcategoria || ""));
                if (!basicMap.has(bk)) basicMap.set(bk, []);
                basicMap.get(bk).push(fix);
              });
              return [...basicMap.entries()].map(([bk, bFixes]) => ({ pk: bk, fixes: bFixes, rep: bFixes[0], isBasicRow: true }));
            })()
          : group.fixes.map(fix => ({ pk: ganttPlanKey(fix), fixes: [fix], rep: fix, isBasicRow: false }));

        // ── People area: desglose de cocinas por rango de cumplimiento ──
        if (state.ganttGroupBy === "area" && group.label === PEOPLE_AREA) {
          // Score por cocina: leer fix.iniciativa (contiene el % DOT o de cumplimiento)
          // con fallback a fix.basic. Una entrada por cocina, la primera que tenga valor.
          const kitchenScoreMap = new Map();
          group.fixes.forEach(fix => {
            const cid = (fix.cocina || "").trim();
            if (!cid || cid.toLowerCase() === "méxico" || cid.toLowerCase() === "mexico") return;
            if (kitchenScoreMap.has(cid)) return;
            const raw = (fix.iniciativa || fix.basic || "")
              .replace(",", ".").replace("%", "").trim();
            const pct = parseFloat(raw);
            if (!isNaN(pct) && pct >= 0 && pct <= 100) {
              kitchenScoreMap.set(cid, pct);
            }
          });
          const kitchenScores = [...kitchenScoreMap.entries()].map(([id, score]) => ({ id, score }));
          const total = kitchenScores.length;
          const _rankTarget = state.country === "CO" ? 80 : state.country === "MX" ? 90 : 75;
          const BUCKETS = [
            { label: "100%",                               min: 100,         max: Infinity, color: "#4a9070" },
            { label: `Entre ${_rankTarget}% y 99%`,        min: _rankTarget, max: 99.99,    color: "#0b769f" },
            { label: `Entre 50% y ${_rankTarget - 1}%`,   min: 50,          max: _rankTarget - 0.01, color: "#b07d2a" },
            { label: "Menor al 50%",                       min: 0,           max: 49.99,    color: "#96607d" },
          ];
          const bucketRows = BUCKETS.map(b => {
            const items = kitchenScores.filter(r => r.score >= b.min && r.score <= b.max);
            if (!items.length) return "";
            const barPct = Math.round(items.length / Math.max(1, total) * 100);
            const ids = items.map(r => r.id);
            return `
              <div class="gantt-row" style="cursor:pointer" data-people-range="${encodeURIComponent(b.label)}" data-people-kitchens="${encodeURIComponent(ids.join("|||"))}">
                <div class="gantt-left-col">
                  <div style="font-size:12px;font-weight:650;color:${b.color}">${b.label}
                    <span style="font-weight:400;color:var(--text-muted);margin-left:6px">${items.length} cocina${items.length !== 1 ? "s" : ""}</span>
                  </div>
                  <div style="font-size:10px;color:var(--text-muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ids.slice(0,5).join(" · ")}${ids.length > 5 ? " …" : ""}</div>
                </div>
                <div class="gantt-right-col" style="width:${TOTAL_W}px;background:var(--bg)">
                  <div style="position:absolute;inset:0;display:flex;align-items:center;padding:0 16px;gap:12px">
                    <div style="flex:1;height:6px;border-radius:3px;background:var(--border);overflow:hidden">
                      <div style="height:100%;width:${barPct}%;background:${b.color};border-radius:3px"></div>
                    </div>
                    <span style="font-size:12px;font-weight:650;color:${b.color};min-width:36px;text-align:right">${barPct}%</span>
                  </div>
                </div>
              </div>`;
          }).join("");
          return groupRow + bucketRows;
        }

        const fixRows = planEntries.map(({ pk, fixes: planFixes, rep, isBasicRow }) => {
          // Date range: earliest start → latest end across all kitchen instances
          const allSd = planFixes.map(f => ganttStartDate(f)).filter(Boolean);
          const allEd = planFixes.map(f => ganttEndDate(f)).filter(Boolean);
          const sd = allSd.length ? new Date(Math.min(...allSd)) : null;
          const ed = allEd.length ? new Date(Math.max(...allEd)) : null;
          const effectiveSd = sd ?? (ed ? new Date(ed.getTime() - 6*86400000) : null);
          const effectiveEd = ed ?? (sd ? new Date(sd.getTime() + 6*86400000) : null);
          const barLeft  = Math.max(0, dateToPx(effectiveSd) ?? 0);
          const barRight = Math.min(TOTAL_W, dateToPx(effectiveEd) ?? barLeft + 6);
          const barW     = Math.max(6, barRight - barLeft);

          // Aggregate status — exclude depriorizado from date calculations
          const statuses       = planFixes.map(f => ganttFixStatus(f));
          const depCount       = statuses.filter(s => s === "depriorizado").length;
          const activeStatuses = statuses.filter(s => s !== "depriorizado");
          const doneCount      = activeStatuses.filter(s => s === "done").length;
          const overdueCount   = activeStatuses.filter(s => s === "overdue").length;
          const total          = activeStatuses.length;
          const allDone        = total > 0 && doneCount === total;
          const isPartial      = doneCount > 0 && !allDone;
          const pct            = total > 0 ? Math.round(doneCount / total * 100) : 0;

          let s, sc, statusLabel;
          if (total === 0) {
            // All fixes are depriorizado
            s = "depriorizado"; sc = SC["depriorizado"]; statusLabel = SC["depriorizado"].label;
          } else if (allDone) {
            s = "done";    sc = SC["done"];    statusLabel = SC["done"].label;
          } else if (isPartial) {
            s = "open";    sc = SC["open"];    statusLabel = `En proceso · ${pct}%`;
          } else if (overdueCount === total) {
            s = "overdue"; sc = SC["overdue"]; statusLabel = SC["overdue"].label;
          } else {
            s = "open";    sc = SC["open"];    statusLabel = SC["open"].label;
          }

          const dateLabel = [
            sd ? `Inicio: ${sd.toLocaleDateString("es-CO",{day:"2-digit",month:"short",year:"numeric"})}` : null,
            ed ? `Cierre: ${ed.toLocaleDateString("es-CO",{day:"2-digit",month:"short",year:"numeric"})}` : null,
          ].filter(Boolean).join(" · ") || rep.cierre || rep.compromiso || "Sin fecha";

          const closeDateStr = ed
            ? ed.toLocaleDateString("es-CO",{day:"2-digit",month:"short"})
            : (rep.cierre || rep.compromiso || "");

          // For Quality fixes: parse "Basic: X%" from iniciativa/revisado text (comes from live Sheets data)
          const _basicMatch = (rep.iniciativa || rep.revisado || rep.basic || "")
            .match(/[Bb]asic\s*:\s*(\d+(?:[.,]\d+)?)\s*%/);
          const basicQScore = _basicMatch
            ? Math.round(parseFloat(_basicMatch[1].replace(",", ".")))
            : null;

          // Bar inner text: show basic score for Quality, otherwise percentage or date
          const barInnerText = barW > 44
            ? (basicQScore != null ? `Basic: ${basicQScore}%` : isPartial ? `${pct}% · ${doneCount}/${total}` : closeDateStr)
            : (barW > 24 ? (basicQScore != null ? `${basicQScore}%` : isPartial ? `${pct}%` : "") : "");

          // Kitchen count label for non-trivial groups
          const kitchenCountLabel = (state.ganttGroupBy === "area" && total > 1)
            ? `<span style="font-size:10px;color:var(--text-muted)">${total} cocinas</span>`
            : "";

          const rowClickAttr = isBasicRow ? `data-gantt-basic="${pk}"` : `data-gantt-detail="${pk}"`;
          const rowLabel = isBasicRow
            ? (rep.basic || rep.subcategoria || "—")
            : (rep.iniciativa || rep.subcategoria || rep.basic || "—");
          const planCount = isBasicRow
            ? (() => {
                const pm = new Map();
                planFixes.forEach(f => { const k = ganttPlanKey(f); if (!pm.has(k)) pm.set(k, 1); });
                return pm.size;
              })()
            : null;

          return `
            <div class="gantt-row gantt-row-clickable" ${rowClickAttr}>
              <div class="gantt-left-col">
                <div style="font-size:11px;color:var(--navy);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3">${rowLabel}</div>
                <div style="display:flex;gap:5px;align-items:center;margin-top:3px;flex-wrap:wrap">
                  <span style="font-size:10px;font-weight:650;color:${sc.color};background:${sc.bg};padding:1px 6px;border-radius:999px;white-space:nowrap">${statusLabel}</span>
                  ${kitchenCountLabel}
                  ${planCount != null ? `<span style="font-size:10px;color:var(--text-muted)">${planCount} plan${planCount!==1?"es":""} · ver detalle</span>` : ""}
                  ${!isBasicRow && rep.prioridad ? `<span style="font-size:10px;color:var(--text-muted)">${rep.prioridad}</span>` : ""}
                  ${!isBasicRow && rep.responsable ? `<span style="font-size:10px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:90px" title="${rep.responsable}">${rep.responsable}</span>` : ""}
                </div>
              </div>
              <div class="gantt-right-col" style="width:${TOTAL_W}px">
                ${weekBg}${gridLines}${todayLine}
                <div class="gantt-bar"
                  style="left:${barLeft}px;width:${barW}px;background:${basicQScore != null ? `${sc.color}28` : sc.color};opacity:${s==="done"?0.5:0.88};overflow:hidden"
                  title="${(rep.iniciativa||"").replace(/"/g,"'")} · ${dateLabel} · ${statusLabel}${basicQScore != null ? ` · Basic: ${basicQScore}%` : isPartial ? ` (${doneCount}/${total} cocinas)` : ""}">
                  ${basicQScore != null ? `
                    <div style="position:absolute;left:0;top:0;height:100%;width:${basicQScore}%;background:${sc.color};opacity:1;transition:width 0.3s"></div>
                    ${barW > 44 ? `<span style="position:absolute;left:5px;top:50%;transform:translateY(-50%);color:${basicQScore > 40 ? 'rgba(255,255,255,0.95)' : sc.color};font-size:9px;font-weight:650;white-space:nowrap;z-index:1">Basic: ${basicQScore}%</span>` : barW > 24 ? `<span style="position:absolute;left:5px;top:50%;transform:translateY(-50%);color:${basicQScore > 40 ? 'rgba(255,255,255,0.95)' : sc.color};font-size:9px;font-weight:650;z-index:1">${basicQScore}%</span>` : ""}
                  ` : barInnerText ? `<span style="position:absolute;left:5px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.95);font-size:9px;font-weight:650;white-space:nowrap;overflow:hidden;max-width:${barW-10}px">${barInnerText}</span>` : ""}
                </div>
              </div>
            </div>`;
        }).join("");

        return groupRow + fixRows;
      }).join("");

      // ── KPIs ─────────────────────────────────────────────
      const total        = rawFixes.length;
      const depriorizado = rawFixes.filter(f => ganttFixStatus(f) === "depriorizado").length;
      const open         = datedFixes.filter(f => ganttFixStatus(f) === "open").length;
      const overdue      = datedFixes.filter(f => ganttFixStatus(f) === "overdue").length;
      const done         = datedFixes.filter(f => ganttFixStatus(f) === "done").length;

      byId("gantt").innerHTML = `
        <article class="panel">
          ${filterHead}

          <div class="kpis">
            <article class="kpi" style="background:#eef1f8;border-color:#090e3e40">
              <div class="kpi-label">Total planes</div>
              <div class="kpi-value" style="color:#090e3e">${total}</div>
              <div class="kpi-sub">${undatedFixes.length ? `${undatedFixes.length} sin fecha` : "todos con fecha"} · ${formatMoney(rawFixes.reduce((s, fix) => s + fixBudgetAmount(fix), 0))}</div>
            </article>
            <article class="kpi" style="background:#e7f6fc;border-color:#0b769f40">
              <div class="kpi-label">A tiempo</div>
              <div class="kpi-value" style="color:#0b769f">${open}</div>
              <div class="kpi-sub">${total ? Math.round(open/total*100) : 0}% del total</div>
            </article>
            <article class="kpi" style="background:#f4eaf0;border-color:#96607d40">
              <div class="kpi-label">Atrasados</div>
              <div class="kpi-value" style="color:#96607d">${overdue}</div>
              <div class="kpi-sub">Fecha cierre vencida</div>
            </article>
            <article class="kpi" style="background:#e8f3ec;border-color:#4a907040">
              <div class="kpi-label">Completados</div>
              <div class="kpi-value" style="color:#4a9070">${done}</div>
              <div class="kpi-sub">${total ? Math.round(done/total*100) : 0}% del total</div>
            </article>
            ${depriorizado > 0 ? `
            <article class="kpi" style="background:#f1f5f9;border-color:#94a3b840">
              <div class="kpi-label">Despriorizado</div>
              <div class="kpi-value" style="color:#94a3b8">${depriorizado}</div>
              <div class="kpi-sub">Excluidos de fechas</div>
            </article>` : ""}
          </div>

          <div class="gantt-outer">
            <!-- Row 1: month names grouped -->
            <div class="gantt-row" style="min-height:24px;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border)">
              <div class="gantt-left-col gantt-header-label" style="font-size:10px;color:var(--text-muted);justify-content:flex-end;border-right:2px solid var(--border)">${reportQuarterLabel()}</div>
              <div class="gantt-right-col" style="width:${TOTAL_W}px;height:24px;background:var(--soft)">${headerTop}</div>
              <div class="gantt-proj-col" style="font-size:10px;color:var(--text-muted);font-weight:650;flex-direction:row;align-items:center">Proyección Q</div>
            </div>
            <!-- Row 2: period labels (S1…S4 for Jun, full name for Apr/May) -->
            <div class="gantt-row" style="min-height:28px;position:sticky;top:24px;z-index:9;border-bottom:2px solid var(--border)">
              <div class="gantt-left-col gantt-header-label" style="border-right:2px solid var(--border)">Plan de acción · Cocina</div>
              <div class="gantt-right-col gantt-header-timeline" style="width:${TOTAL_W}px;height:28px">
                ${headerBottom}
                ${todayPx !== null ? `
                  <div class="gantt-today-marker" style="left:${todayPx}px">
                    <span class="gantt-today-label">${today.toLocaleDateString("es-CO",{day:"numeric",month:"short"})}</span>
                  </div>` : ""}
              </div>
            </div>

            ${groupsHtml}

            ${undatedFixes.length ? `
              <div class="gantt-row" style="min-height:34px">
                <div class="gantt-left-col">
                  <div style="font-size:11px;color:var(--text-muted);font-style:italic">+ ${undatedFixes.length} planes sin fecha</div>
                </div>
                <div class="gantt-right-col" style="width:${TOTAL_W}px">${gridLines}</div>
              </div>` : ""}
          </div>

          <div class="info" style="margin-top:12px">
            <strong>Abril y Mayo</strong> comprimidos · <strong>Junio</strong> semana a semana · La semana actual está resaltada en azul · La línea roja marca hoy.
            <strong>A tiempo:</strong> cierre futuro · <strong>Atrasado:</strong> cierre vencido sin completar · <strong>Completado:</strong> EJECUTADO / CERRADO.
          </div>
        </article>`;
    };
    // ─────────────────────────────────────────────────────

    // ═══════════════════════════════════════════════════════════════════════
    // COMPARATIVO Q3 vs Q2 (México). Recalcula todo desde las respuestas crudas
    // congeladas (window.Q3_DATA) usando el mapeo validado (window.Q3_SCHEMA).
    // El "anterior" (Q2) sale de FORM_SCORES (los mismos datos Q2 del dashboard).
    // ═══════════════════════════════════════════════════════════════════════
    const cq3Ready = () => !!(window.Q3_SCHEMA && window.Q3_DATA && window.Q3_DATA.answered);
    // El comparativo respeta el filtro de Tipo: "cp" → Centros de Producción.
    const cq3IsCP = () => state.typeFilter === "cp";
    // Esquema (bloques/sub-áreas/preguntas) según el tipo seleccionado.
    const cq3Schema = () => {
      if (cq3IsCP() && window.CP_DETAIL_DATA?.questions?.length) {
        const qs = window.CP_DETAIL_DATA.questions;
        const temas = [...new Set(qs.map(q => q.tema || "Sin tema"))];
        return {
          isCP: true,
          blocks: CP_BLOCKS_ORDER.filter(b => temas.some(t => cpBlockForTema(t) === b)),
          subareas: temas.map(t => ({ name: t, block: cpBlockForTema(t), questionNos: qs.filter(q => (q.tema || "Sin tema") === t).map(q => q.no) })),
          questions: qs.map(q => ({ no: q.no, subarea: q.tema || "Sin tema", block: cpBlockForTema(q.tema || "Sin tema"), text: (state.country === "MX" ? q.mex : (q.colper || q.mex)) || "", inverted: false })),
        };
      }
      // Cocinas: usar la estructura del diagnóstico MX vigente (bloque/tema reales
      // de la pestaña "Preguntas"), para que dashboard y comparativo coincidan.
      const fsq = (window.FORM_SCORES || {}).MX;
      if (fsq && fsq._isQ3 && fsq._questions && fsq._questions.length && fsq._questions[0].tema) {
        const qs = fsq._questions;
        const blocks = []; qs.forEach(q => { if (q.bloque && !blocks.includes(q.bloque)) blocks.push(q.bloque); });
        const temas = []; qs.forEach(q => { if (q.tema && !temas.includes(q.tema)) temas.push(q.tema); });
        return {
          blocks,
          subareas: temas.map(t => ({ name: t, block: (qs.find(q => q.tema === t) || {}).bloque || "", questionNos: qs.filter(q => q.tema === t).map(q => q.no) })),
          questions: qs.map(q => ({ no: q.no, subarea: q.tema, block: q.bloque, text: q.mex, inverted: !!q.inverted })),
        };
      }
      return window.Q3_SCHEMA;
    };
    const cq3QMap = () => { const m = {}; (cq3Schema().questions || []).forEach(q => m[q.no] = q); return m; };
    // Respuesta → 0..100. Acepta texto (Sí/Parcialmente/No) o valor numérico (CP).
    const cq3Val = (qno, raw) => {
      if (typeof raw === "number") return raw;
      const q = cq3QMap()[qno];
      const n = normalizeText(raw);
      let v = n === "SI" ? 100 : n === "PARCIALMENTE" ? 50 : n === "NO" ? 0 : null;
      if (v == null) return null;
      return (q && q.inverted) ? 100 - v : v;
    };
    const cq3Mean = (arr) => { const a = arr.filter(x => x != null); return a.length ? a.reduce((s, x) => s + x, 0) / a.length : null; };
    // Calcula sub-áreas, bloques y Basic de una cocina que respondió el Q3.
    const cq3Calc = (name) => {
      const k = window.Q3_DATA.answered[name];
      if (!k) return null;
      const S = window.Q3_SCHEMA;
      const sub = {};
      S.subareas.forEach(sa => { sub[sa.name] = cq3Mean(sa.questionNos.map(no => cq3Val(no, k.byQuestion[no]))); });
      const blk = {};
      S.blocks.forEach(b => { blk[b] = cq3Mean(S.subareas.filter(sa => sa.block === b).map(sa => sub[sa.name])); });
      const basic = cq3Mean(S.questions.map(q => cq3Val(q.no, k.byQuestion[q.no])));
      return { name, city: k.city, tipo: k.tipo, sub, blk, basic, byQuestion: k.byQuestion, obs: k.obs || {} };
    };
    // ── Datos Q2 (anterior) desde FORM_SCORES del dashboard ──
    const cq3PunctNorm = (s) => normalizeText(s).replace(/[.,]/g, "").replace(/\s+/g, " ").trim();
    const cq3Q2Block = (norm, blockName) => {
      if (cq3IsCP()) {                                    // CP: promedio de sus temas en el Q2
        const bt = window.CP_PREV?.[norm]?.byTema;
        if (!bt) return null;
        const target = cq3PunctNorm(blockName);
        const vals = Object.keys(bt).filter(t => cq3PunctNorm(cpBlockForTema(t)) === target).map(t => bt[t]).filter(v => v != null);
        return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
      }
      const fs = window.Q2_FORM_MX || (window.FORM_SCORES || {}).MX;
      const bk = fs?.byKitchenBloque?.[norm];
      if (!bk) return null;
      const target = cq3PunctNorm(blockName);
      const hit = Object.keys(bk).find(k => cq3PunctNorm(k) === target);
      return hit ? bk[hit] : null;
    };
    const cq3Q2Sub = (norm, subName) => {
      const tk = cq3IsCP() ? (window.CP_PREV?.[norm]?.byTema) : (window.Q2_FORM_MX || (window.FORM_SCORES || {}).MX)?.byKitchenTema?.[norm];
      if (!tk) return null;
      // En cocinas, la sub-área del Q3 se traduce a su tema equivalente del Q2.
      const lookupName = cq3IsCP() ? subName : (Q3_SUB_TO_Q2_TEMA[subName] || subName);
      const target = cq3PunctNorm(lookupName);
      const hit = Object.keys(tk).find(k => cq3PunctNorm(k) === target);
      return hit ? tk[hit] : null;
    };
    const cq3Q2Basic = (norm) => cq3IsCP()
      ? (window.CP_PREV?.[norm]?.basic ?? null)
      : ((window.Q2_FORM_MX || (window.FORM_SCORES || {}).MX)?.byName?.[norm] ?? null);

    // Score del Q ANTERIOR para una cocina, según su tipo:
    //  · CP  → baseline de "Cp preguntas" histórico (window.CP_PREV)
    //  · MX  → Q2 de cocinas (Q2_FORM_MX)
    const prevKitchenBasic = (k) => {
      const norm = normalizeText(k.id);
      if (isCPKitchen(k)) return window.CP_PREV?.[norm]?.basic ?? null;
      if (state.country === "MX") return cq3Q2Basic(norm);
      return null;
    };
    const prevKitchenTema = (k, tema) => {
      const norm = normalizeText(k.id);
      if (isCPKitchen(k)) return window.CP_PREV?.[norm]?.byTema?.[tema] ?? null;
      if (state.country === "MX") return cq3Q2Sub(norm, tema);
      return null;
    };
    const prevKitchenBloque = (k, block) => {
      const norm = normalizeText(k.id);
      if (isCPKitchen(k)) return window.CP_PREV?.[norm]?.basic ?? null; // CP: un solo bloque = Basic
      if (state.country === "MX") return cq3Q2Block(norm, block);
      return null;
    };
    // Flecha mejora / desmejora (umbral 1 pp).
    const cq3Delta = (q3, q2) => {
      if (q3 == null || q2 == null) return null;
      return q3 - q2;
    };
    const cq3DeltaBadge = (q3, q2, showPP = true) => {
      const d = cq3Delta(q3, q2);
      if (d == null) return `<span style="font-size:11px;color:var(--text-muted)">—</span>`;
      const up = d > 1, down = d < -1;
      const color = up ? "#276749" : down ? "#9b2c2c" : (PALETTE.slate);
      const arrow = up ? "&#9650;" : down ? "&#9660;" : "&#9644;";
      return `<span title="Q3 vs Q2 2026" style="font-size:11px;font-weight:700;color:${color};white-space:nowrap">${arrow}${showPP ? ` ${Math.abs(d).toFixed(0)} pp` : ""}</span>`;
    };
    const cq3Pct = (v) => v == null ? "—" : `${Math.round(v)}%`;
    const cq3AnswerBadge = (qno, raw) => {
      if (raw == null || raw === "") return `<span style="font-size:11px;color:var(--text-muted)">Sin respuesta</span>`;
      const isNum = typeof raw === "number";
      const v = isNum ? raw : cq3Val(qno, raw);
      const label = isNum ? (v >= 100 ? "Cumple" : v >= 50 ? "Parcial" : "No cumple") : raw;
      const bg = v >= 100 ? "#E7F6FC" : v >= 50 ? "#F8F0E2" : "#F4EAF0";
      const color = v >= 100 ? PALETTE.cyanDark : v >= 50 ? PALETTE.neutralText : PALETTE.mauve;
      return `<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;background:${bg};color:${color};white-space:nowrap">${label}${isNum ? ` ${Math.round(v)}%` : ""}</span>`;
    };
    // Respuesta Q2 (anterior) por pregunta, matcheando por sub-área/tema si existe.
    const cq3Q2AnswerLabel = (v) => v == null ? "—" : v >= 100 ? "Cumplía" : v >= 50 ? "Parcial" : "No cumplía";

    // Filas del comparativo. Si hay diagnóstico en vivo (Q3_RESULTS_MX), se usa ese
    // (todas las cocinas con dato); el detalle por pregunta se toma del crudo donde
    // exista. Si no hay sync, cae al crudo congelado.
    const cq3Rows = () => {
      // CP: filas desde el diagnóstico de Centros de Producción (CP_DETAIL_DATA).
      if (cq3IsCP()) {
        const cp = window.CP_DETAIL_DATA;
        if (!cp?.kitchens?.length) return [];
        const S = cq3Schema();
        return cp.kitchens.map(k => {
          const byQuestion = {};
          cp.questions.forEach((q, i) => { byQuestion[q.no] = k.values[i] ?? null; });
          const sub = {};
          S.subareas.forEach(sa => { sub[sa.name] = cq3Mean(sa.questionNos.map(no => byQuestion[no])); });
          const blk = {};
          S.blocks.forEach(b => { blk[b] = cq3Mean(S.subareas.filter(sa => sa.block === b).map(sa => sub[sa.name])); });
          const basic = cq3Mean(cp.questions.map((q, i) => k.values[i]));
          return { name: k.name, city: k.city || "", tipo: "CP", blk, sub, basic, byQuestion, obs: {} };
        }).sort((a, b) => (a.basic ?? 999) - (b.basic ?? 999));
      }
      // Cocinas: usar el diagnóstico MX vigente (FORM_SCORES.MX, de la pestaña
      // "Preguntas"). Observaciones del crudo congelado donde existan.
      const fs = (window.FORM_SCORES || {}).MX;
      if (fs && fs._isQ3 && fs.byName && Object.keys(fs.byName).length) {
        const metaByNorm = {};
        ((window.SHEET_DETAIL_DATA_MX_Q3 || {}).kitchens || []).forEach(k => { metaByNorm[normalizeText(k.name)] = k; });
        const ans = window.Q3_DATA.answered || {};
        const obsByNorm = {}; Object.keys(ans).forEach(n => { obsByNorm[normalizeText(n)] = ans[n].obs || {}; });
        return Object.keys(fs.byName).map(nm => {
          const meta = metaByNorm[nm] || {};
          return {
            name: meta.name || nm, city: meta.city || "", tipo: "Cocina",
            blk: fs.byKitchenBloque[nm] || {}, sub: fs.byKitchenTema[nm] || {},
            basic: fs.byName[nm], byQuestion: fs.byKitchenQuestion[nm] || null,
            obs: obsByNorm[nm] || {},
          };
        }).sort((a, b) => (a.basic ?? 999) - (b.basic ?? 999));
      }
      const R = window.Q3_RESULTS_MX;
      if (R && Object.keys(R).length) {
        const ans = window.Q3_DATA.answered || {};
        const rawByNorm = {}; Object.keys(ans).forEach(n => { rawByNorm[normalizeText(n)] = ans[n]; });
        return Object.keys(R).map(nm => R[nm]).filter(r => r.basic != null).map(r => {
          const raw = rawByNorm[normalizeText(r.name)];
          return { name: r.name, city: r.city, tipo: r.tipo, blk: r.blocks, sub: r.subareas, basic: r.basic, byQuestion: raw ? raw.byQuestion : null, obs: raw ? (raw.obs || {}) : {} };
        }).sort((a, b) => (a.basic ?? 999) - (b.basic ?? 999));
      }
      return Object.keys(window.Q3_DATA.answered).map(cq3Calc).sort((a, b) => (a.basic ?? 999) - (b.basic ?? 999));
    };
    const cq3Pending = () => {
      if (cq3IsCP()) return [];
      if (window.Q3_PREGUNTAS_MX?.pending) return window.Q3_PREGUNTAS_MX.pending.slice().sort();
      const R = window.Q3_RESULTS_MX;
      if (R && Object.keys(R).length) {
        return Object.keys(R).filter(nm => R[nm].basic == null).map(nm => R[nm].name).sort();
      }
      return window.Q3_DATA.pending || [];
    };

    const renderComparativoQ3 = () => {
      const host = byId("comparativo-q3");
      if (!cq3Ready()) { host.innerHTML = `<div class="empty">No se cargaron los datos del Q3 (q3-data.js / q3-mapping.js).</div>`; return; }
      const S = cq3Schema();
      const isCP = cq3IsCP();
      const unit = isCP ? "CP" : "Cocinas";
      const rows = cq3Rows();
      const pending = cq3Pending();
      const qLabel = window.Q3_DATA.quarterLabel || "Q3";
      const avgBasic = cq3Mean(rows.map(r => r.basic));
      const deltas = rows.map(r => cq3Delta(r.basic, cq3Q2Basic(normalizeText(r.name)))).filter(x => x != null);
      const avgDelta = cq3Mean(deltas);
      const hasQ2 = isCP
        ? !!(window.CP_PREV && Object.keys(window.CP_PREV).length)
        : !!((window.FORM_SCORES || {}).MX?.byName && Object.keys((window.FORM_SCORES || {}).MX.byName).length);

      const kpi = (label, value, color) =>
        `<div style="flex:1;min-width:150px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px">
           <div style="font-size:11px;color:var(--text-muted)">${label}</div>
           <div style="font-size:20px;font-weight:650;color:${color || "var(--dark-blue)"}">${value}</div>
         </div>`;

      const blockHead = S.blocks.map(b => `<th style="text-align:center;font-size:11px;padding:8px 6px">${b}</th>`).join("");

      const kitchenRow = (r) => {
        const norm = normalizeText(r.name);
        const isOpen = state.cq3Kitchen === r.name;
        const blkCells = S.blocks.map(b => {
          const q3 = r.blk[b]; const q2 = cq3Q2Block(norm, b);
          const s = getStatus(q3, 75);
          return `<td style="text-align:center;padding:8px 6px">
            <div style="font-weight:650;color:${s.color}">${cq3Pct(q3)}</div>
            <div>${hasQ2 ? cq3DeltaBadge(q3, q2, false) : ""}</div>
          </td>`;
        }).join("");
        const bs = getStatus(r.basic, 75);
        const q2b = cq3Q2Basic(norm);
        return `
          <tr class="cq3-krow" data-cq3-kitchen="${r.name}" style="cursor:pointer;border-top:1px solid var(--border);${isOpen ? "background:var(--panel-alt,#f7f9fb)" : ""}">
            <td style="padding:8px 10px;font-weight:600;white-space:nowrap">${isOpen ? "&#9662;" : "&#9656;"} ${r.name}${r.tipo === "PF" ? ` <span style="font-size:9px;color:var(--text-muted)">PF</span>` : ""}</td>
            <td style="padding:8px 6px;color:var(--text-muted);font-size:12px">${r.city || ""}</td>
            ${blkCells}
            <td style="text-align:center;padding:8px 6px;font-weight:700;color:${bs.color}">${r.basic == null ? "—" : r.basic.toFixed(1) + "%"}</td>
            <td style="text-align:center;padding:8px 6px">${hasQ2 ? cq3DeltaBadge(r.basic, q2b, true) : "—"}</td>
          </tr>
          ${isOpen ? `<tr><td colspan="${4 + S.blocks.length}" style="padding:0 10px 14px 10px">${cq3SubareaPanel(r)}</td></tr>` : ""}
        `;
      };

      host.innerHTML = `
        <div class="panel" style="margin-bottom:14px">
          <div class="detail-title">Comparativo ${qLabel} vs Q2 2026 · México${isCP ? " · Centros de Producción" : ""}</div>
          <div class="detail-sub">Recalculado desde el diagnóstico del ${qLabel}. Clic en ${isCP ? "un CP" : "una cocina"} para desglosar por ${isCP ? "tema" : "sub-área"}; clic en el detalle para ver cada pregunta y su respuesta.</div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
            ${kpi(`${unit} con ${qLabel}`, rows.length)}
            ${isCP ? "" : kpi("Pendientes de diagnóstico", pending.length, PALETTE.neutralText)}
            ${kpi(`Basic promedio ${qLabel}`, avgBasic == null ? "—" : avgBasic.toFixed(1) + "%", PALETTE.cyanDark)}
            ${kpi("Variación promedio vs Q2", !hasQ2 || avgDelta == null ? "—" : (avgDelta > 0 ? "+" : "") + avgDelta.toFixed(1) + " pp", avgDelta > 0 ? "#276749" : "#9b2c2c")}
          </div>
          ${!hasQ2 ? `<div class="hint" style="margin-top:8px">Sincroniza el dashboard (botón Actualizar) para traer los datos del Q2 y ver la comparación mejora/desmejora.</div>` : ""}
        </div>
        <div class="panel" style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead><tr style="background:var(--dark-blue,#12324a);color:#fff">
              <th style="text-align:left;padding:8px 10px">${isCP ? "Centro de Producción" : "Cocina"}</th>
              <th style="text-align:left;padding:8px 6px">Ciudad</th>
              ${blockHead}
              <th style="text-align:center;padding:8px 6px">Basic ${qLabel}</th>
              <th style="text-align:center;padding:8px 6px">Δ vs Q2</th>
            </tr></thead>
            <tbody>${rows.map(kitchenRow).join("")}</tbody>
          </table>
        </div>
        ${isCP || !pending.length ? "" : `
        <div class="panel" style="margin-top:14px">
          <div class="cq3-pending-toggle" data-cq3-pending="1" style="cursor:pointer;font-weight:600">${state.cq3ShowPending ? "&#9662;" : "&#9656;"} Pendientes de diagnóstico ${qLabel} (${pending.length})</div>
          ${state.cq3ShowPending ? `<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:8px">${pending.map(p => `<span style="font-size:12px;padding:4px 10px;border:1px solid var(--border);border-radius:14px;color:var(--text-muted)">${p}</span>`).join("")}</div>` : ""}
        </div>`}
      `;
    };

    const cq3SubareaPanel = (r) => {
      const S = cq3Schema();
      const norm = normalizeText(r.name);
      const hasQ2 = cq3IsCP() ? !!window.CP_PREV : !!((window.FORM_SCORES || {}).MX?.byName);
      const blocks = S.blocks.map(b => {
        const subs = S.subareas.filter(sa => sa.block === b);
        const subRows = subs.map(sa => {
          const q3 = r.sub[sa.name]; const q2 = cq3Q2Sub(norm, sa.name);
          const s = getStatus(q3, 75);
          const selKey = `${r.name}||${sa.name}`;
          const isSel = state.cq3Sub === selKey;
          return `
            <div class="cq3-sub" data-cq3-sub="${selKey}" style="cursor:pointer;display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;${isSel ? "background:#eef4f8" : ""}">
              <span style="flex:1">${isSel ? "&#9662;" : "&#9656;"} ${sa.name} <span style="font-size:10px;color:var(--text-muted)">(${sa.questionNos.length} preg.)</span></span>
              <span style="font-weight:650;color:${s.color};min-width:44px;text-align:right">${cq3Pct(q3)}</span>
              <span style="min-width:70px;text-align:right">${hasQ2 ? cq3DeltaBadge(q3, q2, true) : ""}</span>
            </div>
            ${isSel ? cq3QuestionList(r, sa) : ""}
          `;
        }).join("");
        const bq3 = r.blk[b]; const bs = getStatus(bq3, 75);
        return `
          <div style="margin-bottom:10px">
            <div style="display:flex;align-items:center;gap:8px;padding:4px 8px;font-weight:700;font-size:13px;border-left:3px solid ${bs.color}">
              <span style="flex:1">${b}</span>
              <span style="color:${bs.color}">${cq3Pct(bq3)}</span>
              <span style="min-width:70px;text-align:right">${hasQ2 ? cq3DeltaBadge(bq3, cq3Q2Block(norm, b), true) : ""}</span>
            </div>
            <div style="margin-left:4px">${subRows}</div>
          </div>`;
      }).join("");
      return `<div style="background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px">${blocks}</div>`;
    };

    const cq3QuestionList = (r, sa) => {
      const S = cq3Schema();
      const norm = normalizeText(r.name);
      const q2sub = cq3Q2Sub(norm, sa.name);
      if (!r.byQuestion) {
        return `<div style="margin:2px 0 10px 14px;background:#fbfdff;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:11px;color:var(--text-muted)">
          Sin respuesta cruda cargada para esta cocina — se muestra el % por sub-área, pero no el detalle pregunta por pregunta.
          ${q2sub != null ? `<br>Referencia Q2 de la sub-área: <strong>${Math.round(q2sub)}%</strong>` : ""}
        </div>`;
      }
      const qs = S.questions.filter(q => q.subarea === sa.name);
      const rowsHtml = qs.map(q => {
        const raw = r.byQuestion[q.no];
        const obs = r.obs[q.no];
        return `
          <div style="padding:8px 10px;border-top:1px solid var(--border)">
            <div style="display:flex;gap:10px;align-items:flex-start">
              <div style="flex:1;font-size:12px">${q.text}${q.inverted ? ` <span style="font-size:9px;color:var(--text-muted)">(invertida)</span>` : ""}</div>
              ${cq3AnswerBadge(q.no, raw)}
            </div>
            ${obs ? `<div style="margin-top:4px;font-size:11px;color:var(--text-muted);font-style:italic">&#128221; ${obs}</div>` : ""}
          </div>`;
      }).join("");
      return `
        <div style="margin:2px 0 10px 14px;background:#fbfdff;border:1px solid var(--border);border-radius:6px">
          <div style="padding:6px 10px;font-size:11px;color:var(--text-muted);background:#f2f7fb;border-radius:6px 6px 0 0">
            Respuesta anterior (Q2) de esta sub-área: <strong>${q2sub == null ? "sin dato" : Math.round(q2sub) + "%"}</strong>
            ${q2sub != null ? ` · ${cq3Q2AnswerLabel(q2sub)}` : ""}
          </div>
          ${rowsHtml}
        </div>`;
    };

    const _VIEWS = ["dashboard","kitchens","basics","kitchen-detail-sheet","basic-detail-sheet","fixes","fix-impact","gantt","comparativo-q3"];
    const _dirty = Object.fromEntries(_VIEWS.map(v => [v, true]));
    const _updateChrome = () => {
      const titleText = `Básicos para Foodies contentos · ${reportQuarterLabel()}`;
      byId("reportTitle").textContent = titleText;
      document.title = titleText;
      updateSyncMeta();
      renderCountryTabs();
      renderCitySelect();
      renderDiagBar();
      document.querySelectorAll(".screen").forEach(el => el.classList.toggle("active", el.id === state.view));
      document.querySelectorAll(".view-tab").forEach(btn => btn.classList.toggle("active", btn.dataset.view === state.view));
    };
    const _renderFnFor = (id) => ({
      "dashboard": renderDashboard,
      "kitchens": renderKitchens,
      "basics": renderBasics,
      "kitchen-detail-sheet": renderKitchenDetailSheet,
      "basic-detail-sheet": renderBasicDetailSheet,
      "fixes": renderFixes,
      "fix-impact": renderFixImpact,
      "gantt": renderGantt,
      "comparativo-q3": renderComparativoQ3,
    })[id];
    const _renderView = (id) => {
      const fn = _renderFnFor(id);
      if (fn) { fn(); _dirty[id] = false; }
    };
    const render = () => {
      _updateChrome();
      _renderView(state.view);
      _VIEWS.forEach(id => { if (id !== state.view) _dirty[id] = true; });
    };

    document.addEventListener("click", (event) => {
      const countryButton = event.target.closest("[data-country]");
      if (countryButton) {
        state.country = countryButton.dataset.country;
        state.cityFilter = "Todas";
        state.typeFilter = "kitchen";
        state.diagFilter = "all";
        state.selectedKitchen = null;
        state.detailKitchenId = null;
        state.dashboardBlock = null;
        state.dashboardTheme = null;
        state.kitchenBlock = null;
        state.kitchenTheme = null;
        state.impactKitchenId = null;
        state.impactPeriodKey = null;
        state.impactAreaDetail = null;
        state.impactAreaPeriodKey = null;
        state.impactArea = "Todas";
        state.impactResponsible = "Todos";
        state.impactStatus = ["Todos"];
        state.ganttStatuses = new Set();
        state.ganttArea = "all";
        state.ganttPriority = "all";
        state.ganttGroupBy = "kitchen";
        state.view = "dashboard";
        render();
        return;
      }

      const viewButton = event.target.closest("[data-view]");
      if (viewButton) {
        state.view = viewButton.dataset.view;
        state.selectedKitchen = null;
        _updateChrome();
        if (_dirty[state.view]) _renderView(state.view);
        return;
      }

      // ── Comparativo Q3: sub-área (más específico primero), cocina, pendientes ──
      const cq3SubEl = event.target.closest("[data-cq3-sub]");
      if (cq3SubEl) {
        const key = cq3SubEl.dataset.cq3Sub;
        state.cq3Sub = state.cq3Sub === key ? null : key;
        renderComparativoQ3();
        return;
      }
      const cq3KEl = event.target.closest("[data-cq3-kitchen]");
      if (cq3KEl) {
        const name = cq3KEl.dataset.cq3Kitchen;
        if (state.cq3Kitchen === name) { state.cq3Kitchen = null; state.cq3Sub = null; }
        else { state.cq3Kitchen = name; state.cq3Sub = null; }
        renderComparativoQ3();
        return;
      }
      const cq3PendEl = event.target.closest("[data-cq3-pending]");
      if (cq3PendEl) {
        state.cq3ShowPending = !state.cq3ShowPending;
        renderComparativoQ3();
        return;
      }

      const impactCell = event.target.closest("[data-impact-cell]");
      if (impactCell) {
        const sameSelection = state.impactKitchenId === impactCell.dataset.impactKitchen && state.impactPeriodKey === impactCell.dataset.impactPeriod;
        state.impactKitchenId = sameSelection ? null : impactCell.dataset.impactKitchen;
        state.impactPeriodKey = sameSelection ? null : impactCell.dataset.impactPeriod;
        state.impactAreaDetail = null;
        state.impactAreaPeriodKey = null;
        render();
        return;
      }

      const impactAreaCell = event.target.closest("[data-impact-area-cell]");
      if (impactAreaCell) {
        const area = decodeURIComponent(impactAreaCell.dataset.impactArea || "");
        const sameSelection = state.impactAreaDetail === area && state.impactAreaPeriodKey === impactAreaCell.dataset.impactPeriod;
        state.impactAreaDetail = sameSelection ? null : area;
        state.impactAreaPeriodKey = sameSelection ? null : impactAreaCell.dataset.impactPeriod;
        state.impactKitchenId = null;
        state.impactPeriodKey = null;
        render();
        return;
      }

      if (event.target.closest("[data-clear-impact-detail]") || event.target.matches("[data-impact-modal-backdrop]")) {
        state.impactKitchenId = null;
        state.impactPeriodKey = null;
        state.impactAreaDetail = null;
        state.impactAreaPeriodKey = null;
        render();
        return;
      }

      if (event.target.closest("[data-impact-status-clear]")) {
        document.querySelectorAll("[data-impact-status-option]").forEach(option => {
          option.checked = option.value === "Todos";
        });
        return;
      }

      if (event.target.closest("[data-impact-status-apply]")) {
        const checked = [...document.querySelectorAll("[data-impact-status-option]:checked")].map(option => option.value);
        const selected = !checked.length || checked.includes("Todos") ? ["Todos"] : checked.filter(status => status !== "Todos");
        state.impactResponsible = "Todos";
        state.impactStatus = selected;
        state.impactKitchenId = null;
        state.impactPeriodKey = null;
        state.impactAreaDetail = null;
        state.impactAreaPeriodKey = null;
        render();
        return;
      }

      const ganttGroupBtn = event.target.closest("[data-gantt-groupby]");
      if (ganttGroupBtn) {
        state.ganttGroupBy = ganttGroupBtn.dataset.ganttGroupby;
        renderGantt();
        return;
      }

      const ganttMonthBtn = event.target.closest("[data-gantt-month]");
      if (ganttMonthBtn) {
        const m = parseInt(ganttMonthBtn.dataset.ganttMonth, 10);
        if (!state.ganttExpandedMonths) state.ganttExpandedMonths = new Set();

    const fetchPublicSheetTableOnce = ({ gid, sheet, timeoutMs = 90000, customSheetId }) => new Promise((resolve, reject) => {
      const callbackName = `sheetSync_${Date.now()}_${Math.floor(Math.random() * 100000)}`;
      const script = document.createElement("script");
      const timeout = window.setTimeout(() => {
        delete window[callbackName];
        script.remove();
        reject(new Error("Google Sheets no respondió a tiempo."));
      }, timeoutMs);

      window[callbackName] = (response) => {
        window.clearTimeout(timeout);
        delete window[callbackName];
        script.remove();
        if (response?.status === "error") {
          reject(new Error(response.errors?.[0]?.detailed_message || "No se pudo leer la hoja."));
          return;
        }
        resolve(response?.table || { rows: [], cols: [] });
      };

      const sheetId = customSheetId || "1krQxz6jWQxgCGSJaL4VziAnRQAFBmT29WKC4vThFx_M";
      const sheetParam = gid ? `gid=${gid}` : `sheet=${encodeURIComponent(sheet)}`;
      script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?${sheetParam}&tqx=out:json;responseHandler:${callbackName}&_=${Date.now()}`;
      script.onerror = () => {
        window.clearTimeout(timeout);
        delete window[callbackName];
        script.remove();
        reject(new Error("No se pudo conectar con Google Sheets."));
      };
      document.body.appendChild(script);
    });

    const fetchPublicSheetTable = async ({ gid, sheet, timeoutMs = 90000, retries = 1, customSheetId }) => {
      let lastError;
      for (let attempt = 0; attempt <= retries; attempt += 1) {
        try {
          return await fetchPublicSheetTableOnce({ gid, sheet, timeoutMs, customSheetId });
        } catch (error) {
          lastError = error;
        }
      }
      throw lastError || new Error("No se pudo leer la hoja.");
    };

    const cleanSheetCell = (value) => {
      if (value == null) return "";
      const text = String(value).trim();
      return text.startsWith("#") ? "" : text;
    };

    const displaySheetCell = (cell) => cleanSheetCell(cell?.f ?? cell?.v ?? "");

    const rawSheetCell = (cell) => cell?.v ?? cell?.f ?? "";

    const weekFromSheetCells = (...cells) => {
      for (const cell of cells) {
        const raw = rawSheetCell(cell);
        const text = displaySheetCell(cell);
        const match = String(raw).match(/^Date\((\d+),(\d+),(\d+)\)$/);
        if (match) {
          const date = new Date(Number(match[1]), Number(match[2]), Number(match[3]));
          const oneJan = new Date(date.getFullYear(), 0, 1);
          const week = Math.ceil((((date - oneJan) / 86400000) + oneJan.getDay() + 1) / 7);
          return `Semana ${week} - ${date.getFullYear()}`;
        }
        if (text && !text.startsWith("#")) return text;
      }
      return "";
    };

    const kitchenCityFromSheetDetail = (country, kitchen) => {
      if (normalizeText(country) === normalizeText("Centros de producción México")) {
        const cp = cpData().kitchens.find(item => normalizeText(item.name) === normalizeText(kitchen));
        if (cp) return cp.city;
      }
      const candidates = sheetData().kitchens.filter(item => normalizeText(item.country) === normalizeText(country));
      const exact = candidates.find(item => normalizeText(item.name) === normalizeText(kitchen));
      if (exact) return exact.city;
      const number = kitchenNumber(kitchen);
      return candidates.find(item => kitchenNumber(item.name) === number)?.city || "";
    };

    const isFixSummaryRow = (item) => {
      if (["CIUDAD", "TOTAL"].includes(normalizeText(item.cocina))) return true;
      const numeric = (value) => /^\d+(\.\d+)?$/.test(String(value || "").trim());
      return !item.subcategoria && numeric(item.iniciativa) && numeric(item.compromiso) && numeric(item.cierre);

    const cityFromCPKitchen = (kitchen, fallback = "") => {

    };

    const parseFixTable = (table, countryKey) => {
      const countryNames = { MX: "México", CO: "Colombia", PE: "Perú", CP: "Centros de producción México" };

      // Posibles encabezados por campo.
      // normalizeText → MAYÚSCULAS, sin tildes, sin caracteres especiales (/ = espacio)
      // Ej: "Iniciativa / Plan de Acción" → "INICIATIVA PLAN DE ACCION"
      //     "Cotización (Budget extra)"   → "COTIZACION BUDGET EXTRA"
      const FIELD_HEADERS = {
        subcategoria: ["SUBCATEGORIA", "CATEGORIA", "BLOQUE"],
        area:         ["AREA", "PILAR", "EQUIPO"],
        cocina:       ["COCINA", "KITCHEN", "LOCAL", "CP"],
        ciudad:       ["CIUDAD", "CITY", "MUNICIPIO"],
        iniciativa:   ["INICIATIVA PLAN DE ACCION", "INICIATIVA", "PLAN DE ACCION", "PLAN", "DESCRIPCION", "ACCION"],
        basic:        ["BASIC", "BASICO", "PREGUNTA BASICA", "PREGUNTA"],
        compromiso:   ["FECHA DE COMPROMISO", "FECHA COMPROMISO", "COMPROMISO"],
        cierre:       ["FECHA DE CIERRE", "FECHA CIERRE", "CIERRE", "FECHA REAL"],
        abril:        ["ABRIL"],
        mayo:         ["MAYO"],
        junio:        ["JUNIO"],
        totalQ:       ["TOTAL Q", "TOTALQ", "TOTAL TRIMESTRE", "IMPORTE TOTAL", "TOTAL USD", "TOTAL"],
        responsable:  ["RESPONSABLE", "RESPONSIBLE"],
        prioridad:    ["PRIORIDAD", "PRIORITY"],
        status:       ["STATUS", "ESTADO", "ESTATUS"],
        revisado:     ["REVISADO", "REVISION", "SEGUIMIENTO", "AVANCE"],
        evidencia:    ["EVIDENCIA", "LINK EVIDENCIA"],
        firma:        ["FIRMA"],
        presupuesto:  ["PRESUPUESTO", "BUDGET"],
        cotizacion:   ["COTIZACION", "BUDGET EXTRA"],
        mensual:      ["MENSUAL"],
        ejecutado:    ["EJECUTADO", "REAL EJECUTADO"],
      };

      // Fallback de posiciones por país (por si los headers no se encuentran)
      // CO: C=Subcategoría(2), D=Cocina(3), E=Basic(4), F=Ciudad(5),
      //     G=Iniciativa/Plan(6), H=Fecha compromiso(7), I=Fecha cierre(8),
      //     J=Cotización(9), K=Área(10), L=Status(11), M=Prioridad(12)
      const FALLBACK_COLS = {
        MX: { subcategoria:2, area:3, ciudad:4, cocina:5, basic:6, iniciativa:7, compromiso:8, cierre:9, abril:10, mayo:11, junio:12, totalQ:13, responsable:14, status:15, prioridad:16, revisado:17, evidencia:18, presupuesto:19 },
        CO: { subcategoria:2, cocina:3, basic:4, ciudad:5, iniciativa:6, compromiso:7, cierre:8, cotizacion:9, totalQ:9, area:10, responsable:10, status:11, prioridad:12 },
        PE: { subcategoria:2, cocina:3, iniciativa:4, basic:5, compromiso:6, cierre:7, cotizacion:9, totalQ:9, status:10, responsable:11, prioridad:12 },
        CP: { subcategoria:2, ciudad:3, cocina:4, basic:5, iniciativa:6, compromiso:7, cierre:8, cotizacion:9, totalQ:9, responsable:10, status:11, prioridad:12, area:13 },
      };

      const rows = table.rows || [];
      const cols = table.cols || [];

      // GViz pone los encabezados del sheet en table.cols[i].label (no en rows[0]).
      // Si cols tiene labels con texto, los usamos; si no, buscamos en rows[0].
      const hasColLabels = cols.some(c => (c.label || "").trim().length > 2);
      const headerLabels = hasColLabels
        ? cols.map(c => (c.label || "").trim())
        : (rows[0]?.c || []).map(c => displaySheetCell(c).trim());
      const dataStartRow = hasColLabels ? 0 : 1;

      // Construir mapa: headerNormalizado → índice de columna
      const colByHeader = {};
      headerLabels.forEach((label, idx) => {
        const txt = normalizeText(label);
        if (txt) colByHeader[txt] = idx;
      });

      // Para cada campo, resolver el índice de columna por header o fallback
      // Matching: exacto primero, luego "el header contiene la keyword" o "la keyword contiene el header"
      const fallback = FALLBACK_COLS[countryKey] || {};
      const allHeaders = Object.keys(colByHeader); // ["subcategoria", "cocina", "basic", "ciudad", ...]
      const resolvedCols = {};
      Object.keys(FIELD_HEADERS).forEach(field => {
        let foundCol = -1;
        for (const keyword of FIELD_HEADERS[field]) {
          // Keywords ya están en formato normalizado (MAYÚSCULAS, sin tildes ni especiales)
          // 1) Exacto
          if (colByHeader[keyword] !== undefined) { foundCol = colByHeader[keyword]; break; }
          // 2) El encabezado del sheet contiene la keyword (ej: "COTIZACION BUDGET EXTRA" contiene "COTIZACION")
          const containsKw = allHeaders.find(h => h.includes(keyword));
          if (containsKw) { foundCol = colByHeader[containsKw]; break; }
          // 3) La keyword contiene el encabezado (keyword larga vs header corto)
          const kwContains = allHeaders.find(h => h.length > 3 && keyword.includes(h));
          if (kwContains) { foundCol = colByHeader[kwContains]; break; }
        }
        resolvedCols[field] = foundCol >= 0 ? foundCol : (fallback[field] ?? -1);
      });

      // PE: la columna rotulada "Status" contiene notas libres; el estado real
      // (Pendiente / En proceso / Ejecutado / Realizado) está en la columna "Ejecutado".
      // Forzamos que status ← Ejecutado para PE.
      if (countryKey === "PE" && resolvedCols.ejecutado >= 0) resolvedCols.status = resolvedCols.ejecutado;

      if (countryKey === "CO") console.log(`[parseFixTable CO] hasColLabels=${hasColLabels} dataStartRow=${dataStartRow} colByHeader=`, JSON.stringify(colByHeader), `resolvedCols=`, JSON.stringify(resolvedCols));
      return rows.slice(dataStartRow).map((row, rowIndex) => {
        const cells = row.c || [];
        const item = { country: countryNames[countryKey] || countryKey, _rowIdx: `${countryKey}:${rowIndex}` };
        Object.entries(resolvedCols).forEach(([field, idx]) => {
          if (idx >= 0) item[field] = displaySheetCell(cells[idx]);
        });
        // CO: el área SIEMPRE viene de la columna K (índice 10) del sheet "Fixes CO".
        // Se sobreescribe aquí para evitar que cualquier problema de detección de headers
        // haga que se use la columna equivocada.
        if (countryKey === "CO") {
          item.area = displaySheetCell(cells[10]);
        }
        const inferredCity = kitchenCityFromSheetDetail(item.country, item.cocina);
        item.ciudad = countryKey === "CP"
          ? cityFromCPKitchen(item.cocina, inferredCity || item.ciudad)
          : countryKey === "PE"
          ? (item.ciudad || "Lima")
          : inferredCity && (!item.ciudad || ["COSTA", "COLOMBIA"].includes(normalizeText(item.ciudad)))
            ? inferredCity
            : item.ciudad;
        item.semana = weekFromSheetCells(
          cells[resolvedCols.compromiso] ?? null,
          cells[resolvedCols.cierre]     ?? null,
          cells[resolvedCols.junio]      ?? null,
          cells[resolvedCols.mayo]       ?? null,
          cells[resolvedCols.abril]      ?? null,
        );
        return item;
      }).filter(item => {
        const hasMain = ["subcategoria", "cocina", "iniciativa", "responsable", "prioridad", "status"]
          .some(key => item[key]);
        return hasMain && !isFixSummaryRow(item);
      });
    };

    const syncFixesFromSheets = async () => {
      const prev = window.FIXES_DATA || { MX: [], CO: [], PE: [], CP: [] };
      const next = { ...prev };
      const results = [];
      let anySuccess = false;
      // MX Q3: los planes de acción salen del nuevo archivo (pestaña de planes MX),
      // igual que Colombia usa su propia hoja. Los demás países se mantienen.
      const MX_Q3_FIX_SHEET_ID = "186o3CErXrysBMijH40Pnoq0K2C4OzxWFgA9G_WeWStE";
      const MX_Q3_FIX_GID = "1260122100";
      for (const config of [
        { key: "MX", sheet: "Fixes MX", customSheetId: MX_Q3_FIX_SHEET_ID, gid: MX_Q3_FIX_GID },
        { key: "CO", sheet: "Fixes CO", customSheetId: MX_Q3_FIX_SHEET_ID },
        { key: "PE", sheet: "Fixes PE", customSheetId: MX_Q3_FIX_SHEET_ID },
        { key: "CP", sheet: "Fixes CPs", customSheetId: MX_Q3_FIX_SHEET_ID },
      ]) {
        try {
          const table = await fetchPublicSheetTable({ sheet: config.sheet, gid: config.gid, customSheetId: config.customSheetId, timeoutMs: 90000, retries: 1 });
          const parsed = parseFixTable(table, config.key);
          // Only overwrite if we got data, to avoid wiping local data on empty response
          if (parsed.length > 0 || (table.rows || []).length > 2) {
            next[config.key] = parsed;
            anySuccess = true;
          }
          const prev_n = (prev[config.key] || []).length;
          const diff = parsed.length - prev_n;
          const diffStr = diff > 0 ? ` (+${diff})` : diff < 0 ? ` (${diff})` : "";
          results.push(`${config.key} ✓ ${parsed.length}${diffStr}`);
        } catch (error) {
          const reason = error.message || "error";
          results.push(`${config.key} ✗ (${reason.length > 40 ? reason.slice(0, 40) + "…" : reason})`);
        }
      }
      window.FIXES_DATA = next;
      _fdVer++;
      window.LAST_FIX_SYNC_STATUS = results.join(" · ");
      window.LAST_FIX_SYNC_ANY_SUCCESS = anySuccess;
      return window.FIXES_DATA;
    };

    // Lee una celda de % (formateada tipo "71%", "56.%" o fracción 0.71) → número 0..100.
    const parsePctCell = (cell) => {
      const s = String(displaySheetCell(cell)).replace(/[^0-9.,]/g, "").replace(/[.,]$/, "").replace(",", ".");
      if (!s) return null;
      const n = parseFloat(s);
      if (isNaN(n)) return null;
      return n <= 1.0001 ? n * 100 : n;
    };

    // Sincroniza el diagnóstico Q3 de MX desde la pestaña "Resultados Q3 2026"
    // (todas las cocinas con dato: Basic + 4 bloques + 12 sub-áreas). Es la fuente
    // que el motor de Google sí lee completa (la de respuestas crudas no).
    const Q3_MX_RESULTS_SHEET_ID = "186o3CErXrysBMijH40Pnoq0K2C4OzxWFgA9G_WeWStE";
    const Q3_MX_RESULTS_GID = "285527799";
    const syncQ3ResultsMX = async () => {
      const S = window.Q3_SCHEMA;
      if (!S) return null;
      const table = await fetchPublicSheetTable({ gid: Q3_MX_RESULTS_GID, customSheetId: Q3_MX_RESULTS_SHEET_ID, timeoutMs: 60000, retries: 1 });
      const rows = table.rows || [];
      const out = {};
      rows.forEach(row => {
        const c = row.c || [];
        const tipo = normalizeText(displaySheetCell(c[0]));
        if (tipo !== "COCINA" && tipo !== "PF") return; // saltar filas de ciudad/país
        const name = displaySheetCell(c[2]).trim();
        if (!name) return;
        const basic = parsePctCell(c[19]);
        const blocks = {}; S.blocks.forEach((b, i) => { blocks[b] = parsePctCell(c[15 + i]); });
        const subareas = {}; S.subareas.forEach((sa, i) => { subareas[sa.name] = parsePctCell(c[3 + i]); });
        out[normalizeText(name)] = { name, city: displaySheetCell(c[1]).trim(), tipo: tipo === "PF" ? "PF" : "Cocina", basic, blocks, subareas };
      });
      if (Object.keys(out).length) window.Q3_RESULTS_MX = out;
