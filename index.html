<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Básicos para Foodies contentos · Q2 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #090e3e;        /* color principal (títulos, valores, marca) */
      --navy: #242f42;
      --dark-blue: #090e3e;       /* principal */
      --ribbon: #090e3e;          /* azul oscuro de la cinta superior */
      --dark-blue-2: #153d64;
      --light-gray: #e8e8e8;
      --teal: #156082;
      --cyan-dark: #0b769f;
      --cyan: #0f9ed5;
      --slate: #345964;
      --steel: #467886;
      --mauve: #96607d;
      --mauve-light: #c19eb1;
      --bg: #f8f9fa;
      --panel: #ffffff;
      --soft: #f2f5f7;
      --kpi-bg: #eaf2fa;          /* fondo azul clarito de las tarjetas KPI */
      --text-muted: #60707c;
      --border: #d9e0e4;
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--navy);
      font-family: 'Poppins', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    .brandbar {
      background: var(--ribbon);
      min-height: 56px;
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 1px 6px rgba(9, 14, 62, 0.25);
    }
    .brandbar-inner {
      width: min(1720px, calc(100% - 48px));
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brandbar img { height: 30px; width: auto; display: block; }
    .brand-title {
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 17px;
      letter-spacing: 0.2px;
    }
    button, select {
      font: inherit;
      color: inherit;
    }
    button {
      border: 1px solid var(--border);
      background: transparent;
      border-radius: var(--radius);
      cursor: pointer;
    }
    button:disabled {
      cursor: wait;
    }
    a { color: var(--cyan-dark); }
    .wrap {
      width: min(1720px, calc(100% - 48px));
      margin: 0 auto;
      padding: 14px 0 40px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .title {
      font-size: 20px;
      font-weight: 650;
      color: var(--dark-blue);
      margin-bottom: 4px;
    }
    .meta {
      color: var(--text-muted);
      font-size: 13px;
    }
    .sync {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--panel);
      font-size: 13px;
    }
    .api-msg {
      display: none;
      margin-bottom: 16px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--soft);
      color: var(--text-muted);
      font-size: 12px;
    }
    .tabs, .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .country-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px 20px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .country-row .tabs { margin-bottom: 0; }
    .country-row .city-control { margin-left: auto; }
    .country-tab {
      padding: 9px 16px;
      font-size: 14px;
      background: transparent;
      color: var(--text-muted);
      transition: 0.15s ease;
    }
    .country-tab.active {
      font-weight: 650;
      border-width: 2px;
    }
.recurrence { background: #fff0f0 !important; border-left: 3px solid #e53e3e; border-radius: 6px; padding: 4px 8px 4px 10px; margin: 2px 0; }
    .trend-badge { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; display: inline-block; cursor: default; }
    .trend-up   { color: #276749; background: #c6f6d5; }
    .trend-down { color: #9b2c2c; background: #fed7d7; }
    .trend-eq   { color: #7b6000; background: #fefcbf; }
    .view-tab {
      padding: 7px 12px;
      font-size: 13px;
      background: transparent;
      color: var(--navy);
    }
    .view-tab.active {
      background: var(--soft);
      font-weight: 650;
      border-color: var(--slate);
    }
    .city-control {
      margin-left: auto;
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--text-muted);
      font-size: 12px;
    }
    select {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      background: var(--panel);
      font-size: 13px;
      min-width: 140px;
    }
    .check-dropdown {
      position: relative;
      min-width: 180px;
      color: var(--navy);
      font-size: 13px;
    }
    .check-dropdown summary {
      list-style: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 30px 6px 10px;
      background: var(--panel);
      cursor: pointer;
      min-height: 34px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      position: relative;
    }
    .check-dropdown summary::-webkit-details-marker {
      display: none;
    }
    .check-dropdown summary::after {
      content: "⌄";
      position: absolute;
      right: 10px;
      top: 5px;
      color: var(--text-muted);
    }
    .check-dropdown[open] summary {
      border-color: var(--cyan-dark);
      box-shadow: 0 0 0 2px rgba(11, 118, 159, 0.12);
    }
    .check-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      z-index: 20;
      min-width: 220px;
      max-height: 260px;
      overflow: auto;
      padding: 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 14px 34px rgba(14, 40, 65, 0.14);
    }
    .check-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--navy);
    }
    .check-option:hover {
      background: var(--soft);
    }
    .check-option input {
      margin: 0;
    }
    .check-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      padding: 6px 4px 2px;
      border-top: 1px solid var(--border);
      margin-top: 4px;
    }
    .check-actions button {
      padding: 5px 9px;
      font-size: 12px;
      background: var(--soft);
    }
    .check-actions button:last-child {
      background: var(--cyan-dark);
      color: #fff;
      border-color: var(--cyan-dark);
    }
    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .kpi {
      padding: 16px;
      background: var(--kpi-bg);
      border: 1px solid #d3e2f0;
      border-radius: var(--radius);
      min-height: 116px;
    }
    .kpi-label {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 8px;
    }
    .kpi-value {
      font-size: 30px;
      font-weight: 650;
      line-height: 1.1;
    }
    .kpi-sub {
      color: var(--text-muted);
      font-size: 11px;
      margin-top: 6px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
    }
    .panel, .kitchen-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .panel {
      padding: 18px 20px;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(14, 40, 65, 0.28);
    }
    .modal-panel {
      width: min(1120px, 96vw);
      max-height: 86vh;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 22px 70px rgba(14, 40, 65, 0.22);
      padding: 18px 20px;
    }
    .modal-panel .detail-table-wrap {
      max-height: 58vh;
    }
    .panel-title {
      font-weight: 650;
      margin-bottom: 14px;
      font-size: 14px;
      color: var(--dark-blue);
    }
    .small-title {
      color: var(--slate);
      font-size: 11px;
      font-weight: 650;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .ranking {
      max-height: none;
      overflow: auto;
      padding-right: 4px;
    }
    .dashboard-grid {
      align-items: stretch;
    }
    .dashboard-ranking-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .dashboard-ranking-panel .ranking {
      flex: 1;
      min-height: 0;
    }
    .rank-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px solid var(--light-gray);
    }
    .rank-left {
      display: flex;
      gap: 8px;
      min-width: 0;
      align-items: center;
    }
    .rank-number {
      min-width: 34px;
      color: var(--slate);
      font-size: 12px;
    }
    .rank-id, .kitchen-id {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .score-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 5px;
      align-items: baseline;
    }
    .score-label {
      color: var(--text-muted);
      font-size: 13px;
    }
    .score-value {
      font-size: 13px;
      font-weight: 650;
    }
    .bar {
      height: 6px;
      background: var(--light-gray);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 11px;
    }
    .bar-fill {
      height: 100%;
      min-width: 0;
      border-radius: 999px;
      transition: width 0.35s ease;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }
    .hint {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 16px;
    }
    .kitchen-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .kitchen-card {
      padding: 16px 18px;
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.15s ease;
      min-height: 148px;
    }
    .kitchen-card:hover {
      transform: translateY(-1px);
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .kitchen-id {
      font-size: 14px;
      font-weight: 650;
    }
    .city {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .mini-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 12px;
      margin-bottom: 12px;
    }
    .mini-metric {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      min-width: 0;
    }
    .mini-label {
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
    }
    .mini-value {
      font-weight: 650;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 0;
      padding: 0 0 16px;
      color: var(--text-muted);
      font-size: 13px;
    }
    .detail-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .detail-title {
      font-size: 22px;
      font-weight: 650;
      color: var(--dark-blue);
    }
    .detail-sub {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 4px;
    }
    .section-label {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 650;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .info {
      margin-top: 20px;
      padding: 12px 14px;
      border-radius: var(--radius);
      background: var(--soft);
      color: var(--text-muted);
      font-size: 13px;
    }
    .empty {
      padding: 34px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }
    .basic-group {
      margin-bottom: 12px;
    }
    .basic-row {
      margin-bottom: 11px;
    }
    .basic-question {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.35;
      padding-right: 12px;
    }
    .basic-num {
      color: var(--text-muted);
      margin-right: 6px;
    }
    .detail-picker {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .detail-picker label {
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 650;
    }
    .detail-picker select {
      min-width: min(420px, 100%);
    }
    .detail-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .detail-stat {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      background: var(--soft);
      min-height: 90px;
    }
    .detail-stat-label {
      color: var(--text-muted);
      font-size: 12px;
      margin-bottom: 6px;
    }
    .detail-stat-value {
      font-size: 22px;
      font-weight: 650;
      line-height: 1.1;
    }
    .detail-stat-sub {
      color: var(--text-muted);
      font-size: 11px;
      margin-top: 5px;
    }
    .detail-table-wrap {
      width: 100%;
      overflow-x: auto;
    }
    .detail-table {
      width: 100%;
      min-width: 860px;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      font-size: 12px;
    }
    .detail-table th,
    .detail-table td {
      vertical-align: top;
      text-align: left;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 10px;
    }
    .detail-table th:first-child,
    .detail-table td:first-child {
      border-left: 1px solid var(--border);
    }
    .detail-table th {
      background: var(--soft);
      color: var(--dark-blue);
      font-weight: 650;
      border-top: 1px solid var(--border);
    }
    .detail-table th:first-child {
      border-top-left-radius: var(--radius);
    }
    .detail-table th:last-child {
      border-top-right-radius: var(--radius);
    }
    .detail-cell-list {
      display: grid;
      gap: 8px;
    }
    .detail-item {
      display: grid;
      gap: 3px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--light-gray);
    }
    .detail-item-worsened { background: #fff5f5; border-left: 3px solid #fc8181 !important; border-radius: 4px; }
    .detail-item:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }
    .detail-item-name {
      color: var(--navy);
      line-height: 1.35;
      font-weight: 650;
    }
    .detail-item-meta {
      color: var(--text-muted);
      font-size: 11px;
    }
    .detail-col-total {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 650;
    }
    .basic-detail-table {
      width: 100%;
      min-width: 1040px;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 12px;
      table-layout: fixed;
    }
    .basic-detail-table th,
    .basic-detail-table td {
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 10px;
      text-align: left;
      vertical-align: top;
    }
    .basic-detail-table th:first-child,
    .basic-detail-table td:first-child {
      border-left: 1px solid var(--border);
    }
    .basic-detail-table th {
      background: var(--soft);
      border-top: 1px solid var(--border);
      color: var(--dark-blue);
      font-weight: 650;
    }
    .basic-detail-table th:first-child {
      border-top-left-radius: var(--radius);
    }
    .basic-detail-table th:last-child {
      border-top-right-radius: var(--radius);
    }
    .impact-table {
      border-collapse: separate;
    }
    .impact-table th:first-child,
    .impact-table td:first-child {
      position: sticky;
      left: 0;
      z-index: 3;
      background: var(--panel);
      box-shadow: 2px 0 0 var(--border);
      min-width: var(--sticky-col-width, 180px);
      width: var(--sticky-col-width, 180px);
      max-width: var(--sticky-col-width, 180px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .impact-table th:first-child {
      z-index: 4;
      background: var(--soft);
    }
    .impact-table thead tr:nth-child(2) th:first-child {
      background: var(--soft);
    }
    .impact-table .area-row-highlight td:first-child {
      background: #e7f6fc !important;
    }
    .kitchen-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .kitchen-chip {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 8px;
      background: var(--soft);
      color: var(--navy);
      font-size: 11px;
      line-height: 1.2;
    }
    .fix-table {
      width: 100%;
      min-width: 1320px;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      font-size: 12px;
    }
    .fix-table th,
    .fix-table td {
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 9px;
      text-align: left;
      vertical-align: top;
    }
    .fix-table th:first-child,
    .fix-table td:first-child {
      border-left: 1px solid var(--border);
    }
    .fix-table th {
      background: var(--soft);
      border-top: 1px solid var(--border);
      color: var(--dark-blue);
      font-weight: 650;
    }
    .fix-table th:first-child {
      border-top-left-radius: var(--radius);
    }
    .fix-table th:last-child {
      border-top-right-radius: var(--radius);
    }
    .fix-action {
      line-height: 1.35;
      color: var(--navy);
    }
    .fix-muted {
      color: var(--text-muted);
      font-size: 11px;
      margin-top: 4px;
    }
    .table-scroll-top {
      overflow-x: auto;
      overflow-y: hidden;
      height: 16px;
      margin-bottom: 6px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--soft);
    }
    .fix-filter {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 4px 6px;
      background: var(--panel);
      color: var(--navy);
      font-size: 11px;
    }
    .drilldown {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .drill-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .drill-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }
    .drill-card {
      width: 100%;
      text-align: left;
      padding: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .drill-card.active {
      border-color: var(--cyan-dark);
      background: #e7f6fc;
    }
    .drill-title {
      font-size: 12px;
      font-weight: 650;
      line-height: 1.25;
      margin-bottom: 6px;
    }
    .drill-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--text-muted);
      font-size: 11px;
    }
    .question-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }
    .question-row {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      background: var(--soft);
    }
    .question-text {
      font-size: 12px;
      font-weight: 650;
      line-height: 1.35;

    const state = {

    const fmt = (value, decimals = 1) => value == null ? "Pendiente" : `${Number(value).toFixed(decimals)}%`;
    const byId = (id) => document.getElementById(id);
    const DEFAULT_DATA_READ_AT = "2026-06-02T00:00:00-05:00";
    const REPORT_YEAR = 2026;
    // Trimestre por país: Colombia trabaja Q3 2026; México (y CPs) y Perú siguen en Q2 2026.
    const REPORT_QUARTER_BY_COUNTRY = { MX: 3, CO: 3, PE: 2 };
    const reportQuarter = () => REPORT_QUARTER_BY_COUNTRY[state.country] ?? 2;
    const reportReferenceDate = () => {
      const quarter = reportQuarter();
      const qStart = new Date(REPORT_YEAR, (quarter - 1) * 3, 1);
      const qEnd = new Date(REPORT_YEAR, quarter * 3, 0);
      const now = new Date();
      // Trimestre en curso: usar la fecha de hoy (semana actual real).
      if (now >= qStart && now <= qEnd) return now;
      // Trimestre cerrado o futuro: comportamiento original (día 2 del último mes del Q).
      return new Date(REPORT_YEAR, (quarter * 3) - 1, 2);
    };
    const reportQuarterLabel = () => `Q${reportQuarter()} ${REPORT_YEAR}`;
    const SYNC_STORAGE_KEY = "foodology_basicos_last_sync_v2";
    const syncStorage = {
      read() {
        try {
          return JSON.parse(localStorage.getItem(SYNC_STORAGE_KEY) || "null");
        } catch {
          return null;
        }
      },
      write(payload) {
        try {
          localStorage.setItem(SYNC_STORAGE_KEY, JSON.stringify(payload));
        } catch {
          // Si el navegador bloquea localStorage, la sincronización funciona solo en memoria.
        }
      },
    };
    const formatSyncMetaDate = (isoDate) => {
      if (!isoDate) isoDate = DEFAULT_DATA_READ_AT;
      return new Date(isoDate).toLocaleString("es-CO", { dateStyle: "medium", timeStyle: "short" });
    };
    const updateSyncMeta = () => {
      const meta = document.querySelector(".meta");
      if (!meta) return;
      const dateText = formatSyncMetaDate(window.LAST_SYNC_AT);
      meta.innerHTML = `
        Fuente:
        <a href="https://docs.google.com/spreadsheets/d/1krQxz6jWQxgCGSJaL4VziAnRQAFBmT29WKC4vThFx_M/edit" target="_blank" rel="noreferrer">Google Sheets</a>
        · Datos leídos: <span id="syncMeta">${dateText}</span>
      `;
    };
    const loadSavedSync = () => {
      const saved = syncStorage.read();
      if (!saved) return;
      if (saved.fixes) window.FIXES_DATA = saved.fixes;
      if (saved.dotMx) window.DOT_MX_DATA = saved.dotMx;
      if (saved.formScores) {
        window.FORM_SCORES = saved.formScores;
        if (saved.extraKitchens) {
          window.EXTRA_KITCHENS = saved.extraKitchens;
          mergeExtraKitchens(saved.extraKitchens);
        } else {
          // Backward compat: derive kitchen list from byName keys when extraKitchens not yet saved
          const derived = {};
          for (const ck of ["MX", "CO", "PE"]) {
            derived[ck] = Object.keys((saved.formScores[ck] || {}).byName || {}).map(id => ({ id, city: "" }));
          }
          mergeExtraKitchens(derived);
        }
      }
      if (saved.formData && saved.formData.kitchens?.length) {
        // Merge saved form kitchens with existing questions
        window.SHEET_DETAIL_DATA = {
          questions: (window.SHEET_DETAIL_DATA || {}).questions || [],
          kitchens: saved.formData.kitchens,
        };
      }
      if (saved.prevCoScores) window.PREV_CO_SCORES = saved.prevCoScores;
      if (saved.cpDetail && saved.cpDetail.kitchens?.length) window.CP_DETAIL_DATA = saved.cpDetail; // diagnóstico Q3 de CP
      if (saved.cpPrev) window.CP_PREV = saved.cpPrev;   // baseline Q anterior de CP
      if (saved.q3ResultsMx) window.Q3_RESULTS_MX = saved.q3ResultsMx;   // diagnóstico Q3 MX (todas las cocinas)
      if (saved.q3PreguntasMx) window.Q3_PREGUNTAS_MX = saved.q3PreguntasMx;  // diagnóstico Q3 MX por pregunta (autoritativo)
      if (saved.q2FormMx) window.Q2_FORM_MX = saved.q2FormMx;            // Q2 MX para el comparativo
      if (saved.lastSyncAt) window.LAST_SYNC_AT = saved.lastSyncAt;
      if (saved.fixStatus) window.LAST_FIX_SYNC_STATUS = saved.fixStatus;
      // Purgar puntos físicos que pudieran haberse colado en localStorage
      mergeExtraKitchens({});
    };
    const saveSyncData = (payload) => {
      const next = {
        fixes: window.FIXES_DATA,
        dotMx: window.DOT_MX_DATA,
        formScores: window.FORM_SCORES || null,
        formData: window.SHEET_DETAIL_DATA ? { kitchens: window.SHEET_DETAIL_DATA.kitchens } : null,
        extraKitchens: window.EXTRA_KITCHENS || null,
        prevCoScores: window.PREV_CO_SCORES || null,
        q3ResultsMx: window.Q3_RESULTS_MX || null,
        q3PreguntasMx: window.Q3_PREGUNTAS_MX || null,
        q2FormMx: window.Q2_FORM_MX || null,
        cpDetail: window.CP_DETAIL_DATA || null,
        cpPrev: window.CP_PREV || null,
        lastSyncAt: payload.lastSyncAt,
        fixStatus: window.LAST_FIX_SYNC_STATUS || "",
      };
      window.LAST_SYNC_AT = next.lastSyncAt;
      syncStorage.write(next);
      updateSyncMeta();
    };
    const data = () => COUNTRIES[state.country];
    const cities = () => ["Todas", ...Object.keys(data().cities)];
    const matchesTypeFilter = (kitchen) => {
      if (state.typeFilter === "cp") return isCPKitchen(kitchen);
      if (state.typeFilter === "kitchen") return !isCPKitchen(kitchen);
      return true;
    };
    const typeLabel = () => state.typeFilter === "cp" ? "CP" : state.typeFilter === "kitchen" ? "Cocinas" : "Cocinas y CP";
    const filtered = (() => {
      let _k = null, _v = null;
      const fn = () => {
        const k = `${state.country}|${state.cityFilter}|${state.typeFilter}|${state.diagFilter}`;
        if (k === _k) return _v;
        _k = k;
        const byCity = state.cityFilter === "Todas" ? data().kitchens : data().kitchens.filter(ki => ki.city === state.cityFilter);
        let out = byCity.filter(matchesTypeFilter);
        // Filtro de transición: Con dato real / Proyectadas (pendientes de diagnóstico)
        if (state.diagFilter !== "all" && diagActive()) {
          out = out.filter(ki => kitchenSource(ki) === state.diagFilter);
        }
        return (_v = out);
      };
      fn.reset = () => { _k = null; _v = null; };
      return fn;
    })();
    const typeFiltered = () => data().kitchens.filter(matchesTypeFilter);
    const withData = () => filtered().filter(k => kitchenScore(k) != null);

    const badge = (value) => {
      const s = getStatus(value);
      return `<span class="badge" style="background:${s.bg};color:${s.color}">${value != null ? fmt(value) : "Pendiente"}</span>`;
    };

    const scoreBar = (value, label, height = 6) => {
      const s = getStatus(value);
      return `
        <div>
          <div class="score-head">
            <span class="score-label">${label}</span>
            <span class="score-value" style="color:${s.color}">${value != null ? `${Number(value).toFixed(0)}%` : ""}</span>
          </div>
          <div class="bar" style="height:${height}px"><div class="bar-fill" style="width:${value ?? 0}%;background:${s.bar || s.color}"></div></div>
        </div>
      `;
    };

    const renderCountryTabs = () => {
      byId("countryTabs").innerHTML = Object.entries(COUNTRIES).map(([key, value]) => {
        const score = countryTabScore(key) ?? value.basic;
        const s = getStatus(score);
        const active = key === state.country ? "active" : "";
        const style = key === state.country ? `border-color:${s.color};background:${s.bg};color:${s.color}` : "";
        return `<button class="country-tab ${active}" style="${style}" data-country="${key}" type="button">${value.flag} ${value.name}<span style="margin-left:8px;color:${s.color};font-size:12px">${fmt(score)}</span></button>`;
      }).join("");
    };

    const renderCitySelect = () => {
      byId("typeSelect").value = state.typeFilter;
      byId("citySelect").innerHTML = cities().map(city => `<option value="${city}" ${city === state.cityFilter ? "selected" : ""}>${city}</option>`).join("");

    // Barra de indicadores de estado del trimestre + control de filtro por diagnóstico.
    const renderDiagBar = () => {
      const control = byId("diagControl");
      const bar = byId("diagBar");
      const s = diagSummary();
      if (!s || s.total === 0) {
        if (control) control.style.display = "none";
        if (bar) bar.style.display = "none";
        return;
      }
      if (control) control.style.display = "inline-flex";
      byId("diagSelect").value = state.diagFilter;
      const card = (label, value, color) =>
        `<div style="flex:1;min-width:130px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px">
           <div style="font-size:11px;color:var(--text-muted)">${label}</div>
           <div style="font-size:18px;font-weight:650;color:${color || "var(--dark-blue)"}">${value}</div>
         </div>`;
      bar.style.cssText = "display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px";
      bar.innerHTML =
        card(`Cocinas · ${s.currentLabel}`, s.total) +
        card("Con diagnóstico real", s.real, PALETTE.cyanDark) +
        card(`Proyectadas · cierre ${s.prevLabel}`, s.projected, PALETTE.neutralText) +
        card("% diagnósticos completados", `${s.pct}%`, s.pct >= 50 ? PALETTE.cyanDark : PALETTE.mauve);
    };

    const summarizeQuestionValues = (questionIndex, matches) => {
      const values = matches.map(item => item.sheetKitchen.values[questionIndex]);
      const valid = values.filter(value => value != null);
      return {
        avg: valid.length ? valid.reduce((sum, value) => sum + value, 0) / valid.length : null,
        full: values.filter(value => value === 100).length,
        partial: values.filter(value => value === 50).length,
        fail: values.filter(value => value === 0).length,
        na: values.filter(value => value == null).length,
        total: values.length,
      };
    };

    const summarizeQuestionGroup = (questions, matches) => {
      const values = [];
      questions.forEach(question => {
        matches.forEach(item => {
          const value = item.sheetKitchen.values[question.index];
          if (value != null) values.push(value);
        });
      });
      return {
        avg: values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : null,
        total: questions.length,
      };
    };

    const questionSourceForCurrentType = () => state.typeFilter === "cp" ? cpData() : sheetData();
    const detailMatchesForCurrentType = () => filtered()
      .filter(kitchen => state.typeFilter === "cp" ? isCPKitchen(kitchen) : !isCPKitchen(kitchen))
      .map(kitchen => ({ appKitchen: kitchen, sheetKitchen: sheetKitchenFor(kitchen) }))
      .filter(item => item.sheetKitchen);

    let _fdVer = 0;
    const fixesForCurrentType = (() => {
      let _k = null, _v = null;
      return () => {
        const k = `${_fdVer}|${state.country}|${state.typeFilter}`;
        if (k === _k) return _v;
        _k = k;
        const current = fixesData();
        const countryRows = current[state.country] || [];
        const cpRows = current.CP || [];
        if (state.typeFilter === "cp") return (_v = cpRows);
        if (state.typeFilter === "kitchen") return (_v = countryRows);
        return (_v = state.country === "MX" ? [...countryRows, ...cpRows] : countryRows);
      };

    const fixesForKitchen = (kitchen) => {

    const fixSourceLabel = () => {

      if (state.typeFilter === "all" && state.country === "MX") return "Fixes MX + Fixes CPs";
