    const dateFromText = (text) => {
      const s = String(text || "");
      // DD/MM/YYYY
      const slash = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (slash) return new Date(Number(slash[3]), Number(slash[2]) - 1, Number(slash[1]));
      // GViz raw: Date(YYYY,M,D)  — month is 0-indexed
      const gviz = s.match(/^Date\((\d+),(\d+),(\d+)\)$/);
      if (gviz) return new Date(Number(gviz[1]), Number(gviz[2]), Number(gviz[3]));
      // ISO: YYYY-MM-DD
      const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (iso) return new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]));
      return null;
    };

    const monthFromText = (text, year = new Date().getFullYear()) => {
      const months = {
        ENERO: 0, FEBRERO: 1, MARZO: 2, ABRIL: 3, MAYO: 4, JUNIO: 5,
        JULIO: 6, AGOSTO: 7, SEPTIEMBRE: 8, SETIEMBRE: 8, OCTUBRE: 9,
        NOVIEMBRE: 10, DICIEMBRE: 11,
      };
      const key = normalizeText(text);
      if (!(key in months)) return null;
      return new Date(year, months[key] + 1, 0);
    };

    const weekKeyFromDate = (date) => {
      if (!date) return "";
      const oneJan = new Date(date.getFullYear(), 0, 1);
      const week = Math.ceil((((date - oneJan) / 86400000) + oneJan.getDay() + 1) / 7);
      return `${date.getFullYear()}-W${String(week).padStart(2, "0")}`;
    };

    const weekLabelFromKey = (key) => {
      const match = String(key || "").match(/^(\d{4})-W(\d{2})$/);
      return match ? `Semana ${Number(match[2])} - ${match[1]}` : "Sin fecha";
    };

    const fixCloseDate = (fix) => dateFromText(fix.cierre) || dateFromText(fix.compromiso) || monthFromText(fix.cierre) || monthFromText(fix.compromiso);

    const fixWeekKey = (fix) => weekKeyFromDate(fixCloseDate(fix));

    const fixAppliesByWeek = (fix, weekKey) => {
      if (weekKey === "all") return true;
      const key = fixWeekKey(fix);
      return key && key <= weekKey;
    };

    const fixAppliesByCutoff = (fix, cutoffDate) => {
      const closeDate = fixCloseDate(fix);
      return closeDate && closeDate <= cutoffDate;
    };

    // Alias de subcategorías CO → tema de pregunta (para fixes cuya subcategoría
    // en la hoja no coincide exactamente con el tema de la pregunta).
    const CO_SUBCATEGORIA_ALIAS = {
      "basura":                                    "gestion de residuos",
      "deposito de agua y calidad de agua":        "sistemas de agua y drenaje",
      "area de lavado y desinfeccion":             "limpieza y desinfeccion",
      "area de produccion y manipulacion de alimentos": "limpieza y desinfeccion",
      "area de recibo":                            "utensilios y superficies",
      "almacen":                                   "utensilios y superficies",
      "capacitacion de conocimiento":              "epp e higiene personal",
    };

    const fixAreaLabelFromText = (value) => {
      const text = normalizeText(value);
      if (!text) return "";
      if (text.includes("CALIDAD") || text.includes("QUALITY") || text === "QTY") return "Quality";
      if (text.includes("CITY") || text.includes("CITIES") || text.includes("OPS")) return "City";
      if (text.includes("ADMIN")) return "Admin";
      if (text.includes("PEOPLE")) return "People";
      return value;
    };

    const fixAreaValue = (fix) => {
      const direct = fixAreaLabelFromText(fix.area);
      if (direct) return direct;
      const responsibleArea = fixAreaLabelFromText(fix.responsable);
      return responsibleArea || "Sin área";
    };

    const fixMatchesQuestionContent = (fix, question) => {
      if (fix.basic) {
        const bNum = fix.basic.match(/^\s*b?\s*(\d+)\s*$/i);
        if (bNum) return parseInt(bNum[1]) === question.no;

        const nb = normalizeText(fix.basic);
        const checkText = (text) => {
          if (!text) return false;
          const nt = normalizeText(text);
          return nb === nt || nb.includes(nt) || nt.includes(nb);
        };
        return checkText(question.mex) || checkText(question.colper) || checkText(basicName(question.index));
      }

      let fixTopic = normalizeText(fix.subcategoria) || normalizeText(fix.area);
      if (state.country === "CO" && fixTopic && CO_SUBCATEGORIA_ALIAS[fixTopic]) {
        fixTopic = CO_SUBCATEGORIA_ALIAS[fixTopic];
      }
      return !!(fixTopic && fixTopic === normalizeText(question.tema));
    };

    const fixMatchesQuestion = (fix, question, countryKey) => {
      // Para CO: el responsable define el área del fix.
      // Si contiene una keyword de área conocida → solo aplica a esa área.
      // Si es un nombre/equipo sin keyword → aplica a todas (no restringir).
      const coAreaOk = () => {
        if (countryKey !== "CO" || !fix.responsable) return true;
        const nr = normalizeText(fixAreaValue(fix));
        const na = normalizeText(question.area || "");
        // Mapeos conocidos
        if (nr === "QUALITY" && na === "QUALITY") return true;
        if (nr.includes("CITY") && na === "CITY") return true;
        if (nr.includes("ADMIN") && na === "ADMIN") return true;
        if (nr.includes("PEOPLE") && na === "PEOPLE") return true;
        if (nr === na) return true;
        // Si el responsable contiene alguna keyword de área → es area-específico → excluir si no coincide
        const hasAreaKeyword = nr.includes("QUALITY") ||
                               nr.includes("CITY") || nr.includes("ADMIN") || nr.includes("PEOPLE");
        // Sin keyword de área (persona, equipo operativo) → aplica a todas
        return !hasAreaKeyword;
      };

      if (fix.basic) {
        // Si el Fix trae el básico explícito, manda el texto/número del básico.
        // El área del Fix se usa para agrupar/proyectar, no para bloquear el match.
        return fixMatchesQuestionContent(fix, question);
      }
      // Sin basic: el fix cubre TODA la subcategoria. Para CO, el responsable
      // determina qué preguntas (por área) del tema cubre este fix.
      return fixMatchesQuestionContent(fix, question) && coAreaOk();
    };

    const fixMatchesKitchen = (fix, kitchen, countryKey) => {
      const fixKitchen = normalizeText(fix.cocina);
      if (!fixKitchen || ["TODAS", normalizeText(data().name)].includes(fixKitchen)) return true;
      const appKitchen = normalizeText(kitchen.id);
      if (fixKitchen === appKitchen) return true;
      // Coincidencia por número de cocina (ej: "32" vs "32 BARRANQUILLA")
      const number = kitchenNumber(kitchen.id);
      if (number && kitchenNumber(fix.cocina) === number) return true;
      // Coincidencia por nombre parcial (ej: "BARRANQUILLA" vs "32 BARRANQUILLA" o "CDMX" vs "42 CP CDMX")
      if (fixKitchen.length > 4 && (appKitchen.includes(fixKitchen) || fixKitchen.includes(appKitchen))) return true;
      return false;
    };

    const isCountryWideFix = (fix) => {
      const countryName = normalizeText(data().name);
      const kitchen = normalizeText(fix.cocina);
      const city = normalizeText(fix.ciudad);
      return !kitchen || kitchen === "TODAS" || kitchen === countryName || kitchen === "MEXICO" || city === countryName || city === "MEXICO";
    };

    const globalFixKey = (fix) => [
      fix.cocina,
      fix.ciudad,
      fix.area,
      fix.subcategoria,
      fix.basic,
      fix.iniciativa,
      fix.cierre,
      fix.compromiso,
      fix.responsable,
      fix.status,
      fix.totalQ || fix.cotizacion || fix.total || fix.presupuesto,
    ].map(value => normalizeText(value)).join("|");

    const fixBudgetAmount = (fix) => moneyValue(fix.totalQ || fix.cotizacion || fix.total || fix.presupuesto || "");

    const fixMatchesImpactArea = (fix) => {
      return state.impactArea === "Todas" || normalizeText(fixAreaValue(fix)) === normalizeText(state.impactArea);
    };

    const fixMatchesAreaChoice = (fix, area) => {
      return area === "Todas" || normalizeText(fixAreaValue(fix)) === normalizeText(area);
    };

    const fixResponsibleValue = (fix) => fix.responsable || "Sin responsable";

    const fixMatchesImpactResponsible = (fix) => {
      return state.impactResponsible === "Todos" || normalizeText(fixResponsibleValue(fix)) === normalizeText(state.impactResponsible);
    };

    const fixStatusValue = (fix) => fix.status || "Sin status";

    const selectedImpactStatuses = () => Array.isArray(state.impactStatus) ? state.impactStatus : [state.impactStatus || "Todos"];

    const impactStatusLabel = () => {
      const selected = selectedImpactStatuses();
      return selected.includes("Todos") ? "Todos" : selected.join(", ");
    };

    const fixMatchesImpactStatus = (fix) => {
      // Despriorizado nunca cuenta en el cálculo de mejora
      if (normalizeText(fixStatusValue(fix)) === "DESPRIORIZADO") return false;
      const selected = selectedImpactStatuses();
      return selected.includes("Todos") || selected.some(status => normalizeText(fixStatusValue(fix)) === normalizeText(status));
    };

    const fixMatchesPlanStatus = (fix) => {
      const selected = selectedImpactStatuses();
      return selected.includes("Todos") || selected.some(status => normalizeText(fixStatusValue(fix)) === normalizeText(status));
    };

    const kitchenHasFixImpact = (kitchen, fix) => {
      const sheetKitchen = sheetKitchenFor(kitchen);
      if (!sheetKitchen || !fixMatchesKitchen(fix, kitchen, state.country)) return false;
      const hfiFsK = (window.FORM_SCORES || {})[state.country];
      const hfiNormId = normalizeText(kitchen?.id || "");
      const hfiFormQ = hfiFsK?.byKitchenQuestion?.[hfiNormId] || null;
      const questions = detailDataForKitchen(kitchen).questions.map((question, index) => ({ ...question, index }));
      const hfiHasFsData = !!hfiFsK?.byKitchenQuestion;
      return questions.some(question => {
        const sv = sheetKitchen.values[question.index];
        const hfiFormVal = hfiFormQ ? (hfiFormQ[question.no] ?? null) : null;
        const value = hfiHasFsData ? hfiFormVal : (sv != null ? sv : hfiFormVal);
        return value != null && value < 100 && fixMatchesQuestion(fix, question, state.country);
      });
    };

    const countryWideFixTargetCount = (fix) => {
      if (!isCountryWideFix(fix)) return 1;
      return typeFiltered().filter(kitchen => kitchenHasFixImpact(kitchen, fix)).length || 1;
    };

    const fixBudgetForKitchen = (fix, kitchen) => {
      const amount = fixBudgetAmount(fix);
      if (!amount) return 0;
      return isCountryWideFix(fix) ? amount / countryWideFixTargetCount(fix) : amount;
    };

    const fixImpactForKitchen = (kitchen, weekKey) => {
      const sheetKitchen = sheetKitchenFor(kitchen);
      if (!sheetKitchen) return null;
      const fikFsK = (window.FORM_SCORES || {})[state.country];
      const fikNormId = normalizeText(kitchen?.id || "");
      const fikFormQ = fikFsK?.byKitchenQuestion?.[fikNormId] || null;
      const questions = detailDataForKitchen(kitchen).questions.map((question, index) => ({ ...question, index }));
      const countryFixes = fixesForKitchen(kitchen);
      const fixes = countryFixes.filter(fix => fixMatchesImpactResponsible(fix) && fixMatchesImpactStatus(fix) && fixAppliesByWeek(fix, weekKey) && fixMatchesKitchen(fix, kitchen, state.country));
      let fixedCount = 0;
      let approximatedCount = 0;
      const fikHasFsData = !!fikFsK?.byKitchenQuestion;
      const originalValues = [];
      const adjustedValues = questions.map(question => {
        const sv = sheetKitchen.values[question.index];
        const fikFormVal = fikFormQ ? (fikFormQ[question.no] ?? null) : null;
        const value = fikHasFsData ? fikFormVal : (sv != null ? sv : fikFormVal);
        if (value != null) originalValues.push(value);
        const matchingFix = fixes.find(fix => fixMatchesQuestion(fix, question, state.country));
        if (matchingFix && value != null && value < 100) {
          fixedCount += 1;
          if (!matchingFix.basic) approximatedCount += 1;
          return 100;
        }
        return value;
      }).filter(value => value != null);
      const original = originalValues.length ? originalValues.reduce((sum, value) => sum + value, 0) / originalValues.length : null;
      const adjusted = adjustedValues.length ? adjustedValues.reduce((sum, value) => sum + value, 0) / adjustedValues.length : null;
      return { kitchen, original, adjusted, delta: adjusted != null && original != null ? adjusted - original : 0, fixedCount, approximatedCount };
    };

    // Proyecta el score de una cocina aplicando fixes.
    // questionAreaFilter: si no es null/"Todas", evalúa SOLO los básicos de esa área (question.area).
    //                     Siempre aplica TODOS los fixes que coincidan, sin restricción de fix.area.
    // PEOPLE AREA SPECIAL CASE (solo MX): usa DOT% de "% Dot por cocina MX" col C como fuente de
    //   cumplimiento en lugar de los valores de básicos individuales.
    const fixImpactForKitchenUntil = (kitchen, cutoffDate, periodStartDate = null, questionAreaFilter = null, includeUndated = false, afterQuarterStartDate = null) => {
      const sheetKitchen = sheetKitchenFor(kitchen);
      if (!sheetKitchen) return null;
      let questions = detailDataForKitchen(kitchen).questions.map((question, index) => ({ ...question, index }));

      // Si hay filtro de área de pregunta, restringir a esos básicos
      if (questionAreaFilter && questionAreaFilter !== "Todas") {
        if (state.country === "CO") {
          const areaFixes = fixesForCurrentType().filter(fix => fixMatchesAreaChoice(fix, questionAreaFilter));
          questions = questions.filter(question => areaFixes.some(fix => fixMatchesQuestionContent(fix, question)));
        } else {
          questions = questions.filter(q => (q.area || "Sin área") === questionAreaFilter);
        }
      }
      if (!questions.length) return null;

      const countryFixes = fixesForKitchen(kitchen);
      const fixes = countryFixes.filter(fix => {
        const closeDate = fixCloseDate(fix);
        const dateApplies = afterQuarterStartDate
          ? !!closeDate
          : includeUndated
            ? (!closeDate || !cutoffDate || closeDate <= cutoffDate)
            : fixAppliesByCutoff(fix, cutoffDate);
        return fixMatchesImpactResponsible(fix) &&
          fixMatchesImpactStatus(fix) &&
          dateApplies &&
          fixMatchesKitchen(fix, kitchen, state.country) &&
          (state.country !== "CO" || !questionAreaFilter || questionAreaFilter === "Todas" || fixMatchesAreaChoice(fix, questionAreaFilter));
      });

      // ── Lógica estándar por básicos ──
      const fikuFsK = (window.FORM_SCORES || {})[state.country];
      const fikuNormId = normalizeText(kitchen?.id || "");
      const fikuFormQ = fikuFsK?.byKitchenQuestion?.[fikuNormId] || null;
      const fikuHasFsData = !!fikuFormQ;
      let fixedCount = 0;
      const appliedFixes = new Set();
      const originalValues = [];
      const adjustedValues = questions.map(question => {
        const sv = sheetKitchen.values[question.index];
        const fikuFormVal = fikuFormQ ? (fikuFormQ[question.no] ?? null) : null;
        const value = fikuHasFsData ? fikuFormVal : (sv != null ? sv : fikuFormVal);
        if (value != null) originalValues.push(value);
        const matchingFixes = fixes.filter(fix => fixMatchesQuestion(fix, question, state.country));
        if (matchingFixes.length && value != null && value < 100) {
          fixedCount += 1;
          matchingFixes.forEach(fix => appliedFixes.add(fix));
          return 100;
        }
        return value;
      }).filter(value => value != null);
      // % original usa el mismo cálculo que Dashboard (kitchenScore = byName de FORM_SCORES)
      const perQOriginal = originalValues.length ? originalValues.reduce((sum, value) => sum + value, 0) / originalValues.length : null;
      const perQAdjusted = adjustedValues.length ? adjustedValues.reduce((sum, value) => sum + value, 0) / adjustedValues.length : null;
      const isAreaProjection = !!(questionAreaFilter && questionAreaFilter !== "Todas");
      const original = isAreaProjection ? perQOriginal : (kitchenScore(kitchen) ?? perQOriginal);
      // % proyectado = en área usa el promedio real de sus básicos; en total usa el score base del Dashboard + delta.
      const delta = (perQAdjusted != null && perQOriginal != null) ? (perQAdjusted - perQOriginal) : 0;
      const adjusted = isAreaProjection
        ? perQAdjusted
        : (original != null ? Math.min(100, Math.max(original, original + delta)) : perQAdjusted);
      const periodFixes = [...appliedFixes].filter(fix => {
        const closeDate = fixCloseDate(fix);
        if (afterQuarterStartDate) return closeDate && closeDate >= afterQuarterStartDate;
        if (includeUndated && !closeDate) return true;
        return closeDate && periodStartDate && closeDate >= periodStartDate && closeDate <= cutoffDate;
      });
      const budget = periodFixes.reduce((sum, fix) => sum + fixBudgetForKitchen(fix, kitchen), 0);
      return { original, adjusted, fixedCount, periodFixedCount: periodFixes.length, budget };
    };

    const fixesForKitchenPeriod = (kitchen, period) => {
      if (!kitchen || !period) return [];
      const sheetKitchen = sheetKitchenFor(kitchen);
      if (!sheetKitchen) return [];
      let questions = detailDataForKitchen(kitchen).questions.map((question, index) => ({ ...question, index }));
      // Filtrar preguntas por área si hay una seleccionada
      if (state.impactArea && state.impactArea !== "Todas") {
        questions = questions.filter(q => (q.area || "Sin área") === state.impactArea);
      }
      const candidateFixes = fixesForKitchen(kitchen)
        .filter(fix => fixMatchesImpactResponsible(fix))
        .filter(fix => fixMatchesImpactStatus(fix))
        .filter(fix => fixMatchesKitchen(fix, kitchen, state.country))
        .filter(fix => {
          const closeDate = fixCloseDate(fix);
          if (period.undated) return !closeDate;
          if (period.afterQuarterStart) return closeDate && closeDate >= period.afterQuarterStart;
          return closeDate && closeDate >= period.start && closeDate <= period.cutoff;
        });
      const fkpFsK = (window.FORM_SCORES || {})[state.country];
      const fkpNormId = normalizeText(kitchen?.id || "");
      const fkpFormQ = fkpFsK?.byKitchenQuestion?.[fkpNormId] || null;
      const fkpHasFsData = !!fkpFormQ;
      const appliedFixes = new Set();
      questions.forEach(question => {
        const sv = sheetKitchen.values[question.index];
        const fkpFormVal = fkpFormQ ? (fkpFormQ[question.no] ?? null) : null;
        const value = fkpHasFsData ? fkpFormVal : (sv != null ? sv : fkpFormVal);
        const matchingFixes = candidateFixes.filter(fix => fixMatchesQuestion(fix, question, state.country));
        if (matchingFixes.length && value != null && value < 100) {
          matchingFixes.forEach(fix => appliedFixes.add(fix));
        }
      });
      return [...appliedFixes].map(fix => ({ ...fix, allocatedBudget: fixBudgetForKitchen(fix, kitchen) }));
    };

    // Devuelve los fixes que cubren al menos una pregunta del área (question.area) en el período dado.
    const fixesForAreaPeriod = (questionArea, period) => {
      if (!questionArea || !period) return [];
      if (state.country === "CO") {
        return fixesForCurrentType()
          .filter(fix => state.cityFilter === "Todas" || normalizeText(fix.ciudad) === normalizeText(state.cityFilter))
          .filter(fix => fixMatchesImpactResponsible(fix))
          .filter(fix => fixMatchesPlanStatus(fix))
          .filter(fix => fixMatchesAreaChoice(fix, questionArea))
          .filter(fix => {
            const closeDate = fixCloseDate(fix);
            if (period.undated) return !closeDate;
            if (period.afterQuarterStart) return closeDate && closeDate >= period.afterQuarterStart;
            return closeDate && closeDate >= period.start && closeDate <= period.cutoff;
          })
          .map(fix => ({ ...fix, kitchenId: fix.cocina, kitchenCity: fix.ciudad }));
      }
      // Preguntas que pertenecen a esta área de básico
      const areaQuestions = questionSourceForCurrentType().questions
        .map((q, i) => ({ ...q, index: i }))
        .filter(q => (q.area || "Sin área") === questionArea);
      const areaHasQuestions = areaQuestions.length > 0;

      const seenCountryWide = new Set();
      return filtered().flatMap(kitchen => {
        const sheetKitchen = sheetKitchenFor(kitchen);
        if (!sheetKitchen) return [];
        return fixesForKitchen(kitchen)
          .filter(fix => fixMatchesImpactResponsible(fix))
          .filter(fix => fixMatchesImpactStatus(fix))
          .filter(fix => fixMatchesKitchen(fix, kitchen, state.country))
          .filter(fix => state.country !== "CO" || fixMatchesAreaChoice(fix, questionArea))
          .filter(fix => {
            const closeDate = fixCloseDate(fix);
            if (period.undated) return !closeDate;
            if (period.afterQuarterStart) return closeDate && closeDate >= period.afterQuarterStart;
            return closeDate && closeDate >= period.start && closeDate <= period.cutoff;
          })
          // Solo fixes que cubren al menos un básico de esta área
          .filter(fix => state.country === "CO"
            ? fixMatchesAreaChoice(fix, questionArea)
            : areaHasQuestions && areaQuestions.some(q => fixMatchesQuestion(fix, q, state.country)))
          .map(fix => {
            if (!isCountryWideFix(fix)) return { ...fix, kitchenId: kitchen.id, kitchenCity: kitchen.city };
            const key = globalFixKey(fix);
            if (seenCountryWide.has(key)) return null;
            seenCountryWide.add(key);
            return { ...fix, kitchenId: fix.cocina || data().name, kitchenCity: fix.ciudad || data().name };
          })
          .filter(Boolean);
      });
    };

    const scopedUniqueFixes = () => {
      const seen = new Set();
      return filtered().flatMap(kitchen => fixesForKitchen(kitchen)
        .filter(fix => fixMatchesImpactResponsible(fix))
        .filter(fix => fixMatchesImpactStatus(fix))
        .filter(fix => fixMatchesKitchen(fix, kitchen, state.country))
        .map(fix => {
          const key = globalFixKey(fix);
          if (seen.has(key)) return null;
          seen.add(key);
          return fix;
        })
        .filter(Boolean));
    };

    const scopedBudgetTotalForArea = (area = "Todas") => scopedUniqueFixes()
      .filter(fix => fixMatchesAreaChoice(fix, area))
      .reduce((sum, fix) => {
      if (!isCountryWideFix(fix)) return sum + fixBudgetAmount(fix);
      const visibleTargets = filtered().filter(kitchen => kitchenHasFixImpact(kitchen, fix)).length;
      return sum + ((fixBudgetAmount(fix) / countryWideFixTargetCount(fix)) * visibleTargets);
    }, 0);

    const scopedBudgetTotal = () => scopedBudgetTotalForArea("Todas");

    const renderImpactFixDetail = (periods) => {
      if (!state.impactKitchenId || !state.impactPeriodKey) return "";
      const kitchen = filtered().find(item => item.id === state.impactKitchenId);
      const period = periods.find(item => item.key === state.impactPeriodKey);
      if (!kitchen || !period) return "";
      const fixes = fixesForKitchenPeriod(kitchen, period);
      const totalBudget = fixes.reduce((sum, fix) => sum + (fix.allocatedBudget ?? fixBudgetAmount(fix)), 0);
      return `
        <div class="modal-backdrop" data-impact-modal-backdrop>
        <article class="modal-panel" role="dialog" aria-modal="true" aria-label="Detalle de fixes">
          <div class="detail-head" style="margin-bottom:14px">
            <div>
              <div class="detail-title" style="font-size:18px">Fixes de ${kitchen.id}</div>
              <div class="detail-sub">${period.label} · ${fixes.length} fixes · Budget ${formatMoney(totalBudget)}</div>
            </div>
            <button class="view-tab" type="button" data-clear-impact-detail>Cerrar</button>
          </div>
          <div class="detail-table-wrap">
            <table class="basic-detail-table">
              <thead>
                <tr>
                  <th style="width:120px">Fecha cierre</th>
                  <th style="width:130px">Subcategoría</th>
                  <th style="width:260px">Básico</th>
                  <th style="width:280px">Plan de acción</th>
                  <th style="width:110px">Budget</th>
                  <th style="width:130px">Responsable</th>
                  <th style="width:90px">Prioridad</th>
                  <th style="width:110px">Status</th>
                </tr>
              </thead>
              <tbody>
                ${fixes.map(fix => `
                  <tr>
                    <td>${fix.cierre || fix.compromiso || "Sin fecha"}</td>
                    <td>${fix.subcategoria || "—"}</td>
                    <td>${fix.basic || "—"}</td>
                    <td>${fix.iniciativa || "—"}</td>
                    <td>${formatMoney(fix.allocatedBudget ?? fixBudgetAmount(fix))}</td>
                    <td>${fix.responsable || "—"}</td>
                    <td>${fix.prioridad || "—"}</td>
                    <td>${fix.status || "—"}</td>
                  </tr>
                `).join("") || `<tr><td colspan="8" class="empty">No hay fixes con fecha de cierre en este periodo para esta cocina.</td></tr>`}
              </tbody>
            </table>
          </div>
        </article>
        </div>
      `;
    };

    const renderAreaImpactDetail = (periods) => {
      if (!state.impactAreaDetail || !state.impactAreaPeriodKey) return "";
      const period = periods.find(item => item.key === state.impactAreaPeriodKey);
      if (!period) return "";
      const fixes = fixesForAreaPeriod(state.impactAreaDetail, period);
      const totalBudget = fixes.reduce((sum, fix) => sum + moneyValue(fix.totalQ || fix.cotizacion || fix.total || fix.presupuesto || ""), 0);
      return `
        <div class="modal-backdrop" data-impact-modal-backdrop>
        <article class="modal-panel" role="dialog" aria-modal="true" aria-label="Detalle de fixes por área">
          <div class="detail-head" style="margin-bottom:14px">
            <div>
              <div class="detail-title" style="font-size:18px">Fixes de ${state.impactAreaDetail}</div>
              <div class="detail-sub">${period.label} · ${fixes.length} fixes · Budget ${formatMoney(totalBudget)}</div>
            </div>
            <button class="view-tab" type="button" data-clear-impact-detail>Cerrar</button>
          </div>
          <div class="detail-table-wrap">
            <table class="basic-detail-table">
              <thead>
                <tr>
                  <th style="width:120px">Fecha cierre</th>
                  <th style="width:170px">Cocina</th>
                  <th style="width:100px">Ciudad</th>
                  <th style="width:130px">Subcategoría</th>
                  <th style="width:240px">Básico</th>
                  <th style="width:280px">Plan de acción</th>
                  <th style="width:110px">Budget</th>
                  <th style="width:130px">Responsable</th>
                  <th style="width:90px">Prioridad</th>
                  <th style="width:110px">Status</th>
                </tr>
              </thead>
              <tbody>
                ${fixes.map(fix => `
                  <tr>
                    <td>${fix.cierre || fix.compromiso || "Sin fecha"}</td>
                    <td>${fix.kitchenId || fix.cocina || "—"}</td>
                    <td>${fix.kitchenCity || fix.ciudad || "—"}</td>
                    <td>${fix.subcategoria || "—"}</td>
                    <td>${fix.basic || "—"}</td>
                    <td>${fix.iniciativa || "—"}</td>
                    <td>${fix.totalQ || fix.cotizacion || fix.total || "—"}</td>
                    <td>${fix.responsable || "—"}</td>
                    <td>${fix.prioridad || "—"}</td>
                    <td>${fix.status || "—"}</td>
                  </tr>
                `).join("") || `<tr><td colspan="10" class="empty">No hay fixes con fecha de cierre en este periodo para esta área.</td></tr>`}
              </tbody>
            </table>
          </div>
        </article>
        </div>
      `;
    };

    // Recálculo por área usando question.area:
    // - Cada fila es una categoría de básico (question.area).
    // - Proyectado: aplica TODOS los fixes que coincidan con esos básicos (sin restricción de fix.area).
    // - Conteo: fixes únicos que cubren al menos un básico de esa área en alguna cocina.
    const areaImpactRows = (periods, areas) => {
      const _avg = (arr) => arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : null;

      return areas.map(area => {
        if (area === "Todas") return null;

        // Preguntas que pertenecen a esta área de básico. En CO, cuando el fix no
        // tiene responsable/área, se muestra como "Sin área" aunque no recalcula score.
        const areaQuestions = questionSourceForCurrentType().questions
          .map((q, i) => ({ ...q, index: i }))
          .filter(q => (q.area || "Sin área") === area);
        const areaHasQuestions = areaQuestions.length > 0;

        // ── Score por cocina: básicos de esta área con TODOS los fixes aplicados ──
        const kitchenRows = filtered().map(kitchen => {
          const periodValues = periods
            .map(period => ({ period, impact: fixImpactForKitchenUntil(kitchen, period.cutoff, period.start, area, period.undated, period.afterQuarterStart) }))
            .filter(item => item.impact);
          if (!periodValues.length) return null;
          const original = periodValues[0].impact.original;
          const latest   = periodValues[periodValues.length - 1].impact.adjusted;
          return { original, latest, periodValues };
        }).filter(Boolean);

        // ── Conteo: fixes únicos que cubren al menos un básico de esta área ──
        // Un fix "cubre" el área si fixMatchesQuestion para alguna pregunta de esa área.
        const seenFixes = new Set();
        const periodSeenFixes = periods.map(() => new Set());
        const periodBudgets = periods.map(() => 0);

        if (state.country === "CO") {
          fixesForCurrentType()
            .filter(fix => state.cityFilter === "Todas" || normalizeText(fix.ciudad) === normalizeText(state.cityFilter))
            .filter(fix => fixMatchesImpactResponsible(fix))
            .filter(fix => fixMatchesPlanStatus(fix))
            .filter(fix => fixMatchesAreaChoice(fix, area))
            .forEach((fix) => {
              const k = fix._rowIdx ?? globalFixKey(fix);
              seenFixes.add(k);
              periods.forEach((period, pi) => {
                const cd = fixCloseDate(fix);
                const applies = period.afterQuarterStart
                  ? cd && cd >= period.afterQuarterStart
                  : period.undated
                    ? !cd
                    : cd && period.start && cd >= period.start && cd <= period.cutoff;
                if (applies) {
                  if (!periodSeenFixes[pi].has(k)) {
                    periodBudgets[pi] += fixBudgetAmount(fix);
                  }
                  periodSeenFixes[pi].add(k);
                }
              });
            });
        } else {
        filtered().forEach(kitchen => {
          const sheetKitchen = sheetKitchenFor(kitchen);
          if (!sheetKitchen) return;
          const kitchenFixes = fixesForKitchen(kitchen).filter(fix =>
            fixMatchesImpactResponsible(fix) &&
            fixMatchesImpactStatus(fix) &&
            fixMatchesKitchen(fix, kitchen, state.country) &&
            (state.country !== "CO" || fixMatchesAreaChoice(fix, area)) &&
            (state.country === "CO"
              ? fixMatchesAreaChoice(fix, area)
              : areaHasQuestions && areaQuestions.some(q => fixMatchesQuestion(fix, q, state.country)))
          );
          kitchenFixes.forEach((fix) => {
            const k = fix._rowIdx ?? globalFixKey(fix);
            seenFixes.add(k);
            periods.forEach((period, pi) => {
              const cd = fixCloseDate(fix);
              const applies = period.afterQuarterStart
                ? cd && cd >= period.afterQuarterStart
                : period.undated
                  ? !cd
                  : cd && period.start && cd >= period.start && cd <= period.cutoff;
              if (applies) {
                if (!periodSeenFixes[pi].has(k)) {
                  periodBudgets[pi] += fixBudgetAmount(fix);
                }
                periodSeenFixes[pi].add(k);
              }
            });
          });
        });
        }
        const periodFixedCounts = periodSeenFixes.map(s => s.size);
        if (!kitchenRows.length && !seenFixes.size) return null;

        const periodAverages = periods.map((_, pi) => {
          const vals = kitchenRows.map(r => r.periodValues[pi]?.impact.adjusted).filter(v => v != null);
          return _avg(vals);
        });

        return {
          area,
          kitchenRows,
          original:     _avg(kitchenRows.map(r => r.original).filter(v => v != null)),
          latest:       _avg(kitchenRows.map(r => r.latest).filter(v => v != null)),
          fixedCount:   seenFixes.size,
          budget:       [...seenFixes].length ? periodBudgets.reduce((s, v) => s + v, 0) : 0,
          periodBudget: periodBudgets.reduce((s, v) => s + v, 0),
          periodAverages,
          periodBudgets,
          periodFixedCounts,
        };
      }).filter(Boolean);
    };

    const renderAreaImpactTable = (periods, areas) => {
      // areaImpactRows ya filtra "Todas" y áreas sin cocinas; mostrar todas con al menos un básico evaluado
      const rows = areaImpactRows(periods, areas).filter(row => row.original != null || row.fixedCount > 0);
      const width = 170 + 120 + (periods.length * 135) + 120 + 140;
      const selectedArea = normalizeText(state.impactArea);

      // Total row: aplica TODOS los fixes simultáneamente (igual que la vista general).
      // Básico que no cumple/cumple parcial + plan de acción → 100%, sumando todas las áreas.
      const totalScoreRows = filtered().map(kitchen => {
        const periodValues = periods
          .map(period => ({ period, impact: fixImpactForKitchenUntil(kitchen, period.cutoff, period.start, null, period.undated, period.afterQuarterStart) }))
          .filter(item => item.impact);
        const original = periodValues[0]?.impact.original ?? null;
        const latest   = periodValues[periodValues.length - 1]?.impact.adjusted ?? null;
        return { original, latest, periodValues };
      }).filter(row => row.periodValues.length);

      const _avg = (arr) => arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : null;
      const originalAvg = _avg(totalScoreRows.map(r => r.original).filter(v => v != null));
      const latestAvg   = _avg(totalScoreRows.map(r => r.latest).filter(v => v != null));
      const periodAverages = periods.map((_, index) =>
        _avg(totalScoreRows.map(r => r.periodValues[index]?.impact.adjusted).filter(v => v != null))
      );
      const periodBudgets = periods.map((_, index) => rows.reduce((sum, row) => sum + (row.periodBudgets[index] || 0), 0));
      const periodFixedCounts = periods.map((_, index) => rows.reduce((sum, row) => sum + (row.periodFixedCounts[index] || 0), 0));
      const totalFixed = rows.reduce((sum, row) => sum + row.fixedCount, 0);
      const totalBudget = rows.reduce((sum, row) => sum + row.budget, 0);
      const totalBudgetQ = scopedBudgetTotal();
      return `
        <article class="panel" style="margin:18px 0">
          <div class="detail-head" style="margin-bottom:14px">
            <div>
              <div class="detail-title" style="font-size:18px">Impacto Fix por área de básico</div>
              <div class="detail-sub">Agrupado por área del básico · Responsable: ${state.impactResponsible} · Status: ${impactStatusLabel()}</div>
            </div>
          </div>
          <div class="table-scroll-top" id="impactAreaTopScroll"><div style="width:${width}px;height:1px"></div></div>
          <div class="detail-table-wrap" id="impactAreaTableScroll">
            <table class="basic-detail-table impact-table" style="--sticky-col-width:170px">
              <thead>
                <tr>
                  <th style="width:170px">Área</th>
                  <th style="width:120px">% original</th>
                  ${periods.map(period => `<th class="${period.isCurrentWeek ? "current-week-col" : ""}" style="width:135px">${period.shortLabel}</th>`).join("")}
                  <th style="width:120px">Sube Q</th>
                  <th style="width:140px">Fixes / Budget</th>
                </tr>
                <tr>
                  <th>Total</th>
                  <th>${originalAvg != null ? fmt(originalAvg) : "N/A"}</th>
                  ${periodAverages.map((value, index) => `<th class="${periods[index]?.isCurrentWeek ? "current-week-col" : ""}">${value != null ? fmt(value) : "N/A"}<div class="fix-muted">${periodFixedCounts[index]} fixes</div><div class="fix-muted">${formatMoney(periodBudgets[index] || 0)}</div></th>`).join("")}
                  <th>+${latestAvg != null && originalAvg != null ? (latestAvg - originalAvg).toFixed(1) : "0.0"} pts</th>
                  <th>${totalFixed}<div class="fix-muted">${formatMoney(totalBudget)}</div></th>
                </tr>
              </thead>
              <tbody>
                ${rows.map(row => {
                  const delta = row.latest != null && row.original != null ? row.latest - row.original : 0;
                  const highlighted = state.impactArea !== "Todas" && normalizeText(row.area) === selectedArea;
                  return `
                    <tr class="${highlighted ? "area-row-highlight" : ""}">
                      <td><strong>${row.area}</strong></td>
                      <td>${row.original != null ? fmt(row.original) : "N/A"}</td>
                      ${row.periodAverages.map((value, index) => {
                        const s = getStatus(value);
                        const active = state.impactAreaDetail === row.area && state.impactAreaPeriodKey === periods[index]?.key;
                        const cellContent = `<strong style="color:${s.color}">${value != null ? fmt(value) : "N/A"}</strong>`;
                        return `<td class="${periods[index]?.isCurrentWeek ? "current-week-col" : ""}" data-impact-area-cell data-impact-area="${encodeURIComponent(row.area)}" data-impact-period="${periods[index]?.key}" style="cursor:pointer;${active ? `outline:2px solid ${PALETTE.cyanDark};outline-offset:-2px` : ""}">${cellContent}<div class="fix-muted">${row.periodFixedCounts[index]} fixes</div><div class="fix-muted">${formatMoney(row.periodBudgets[index] || 0)}</div></td>`;
                      }).join("")}
                      <td>+${delta.toFixed(1)} pts</td>
                      <td>${row.fixedCount}<div class="fix-muted">${formatMoney(row.budget || 0)}</div></td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        </article>
      `;
    };

    const currentQuarterPeriods = () => {
      const refDate = reportReferenceDate();
      const now = new Date(refDate);
      const year = REPORT_YEAR;
      const currentMonth = refDate.getMonth();
      const quarterStart = (reportQuarter() - 1) * 3;
      const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
      const periods = [];
      for (let month = quarterStart; month < quarterStart + 3; month += 1) {
        if (month === currentMonth) {
          const first = new Date(year, month, 1);
          const last = new Date(year, month + 1, 0);
          const visibleLast = last;
          let monthWeek = 1;
          for (let d = new Date(first); d <= visibleLast; d.setDate(d.getDate() + 7)) {
            const weekEnd = new Date(d);
            weekEnd.setDate(weekEnd.getDate() + 6);
            const isCierre = weekEnd > last;
            const cutoff = isCierre ? last : weekEnd;
            const yearWeek = weekLabelFromKey(weekKeyFromDate(cutoff)).replace("Semana ", "S");
            const weekLabel = isCierre ? "Cierre" : `S${monthWeek}`;
            periods.push({
              key: `m${month}-w${weekKeyFromDate(new Date(d))}`,
              label: `${monthNames[month]} ${weekLabel} · ${weekLabelFromKey(weekKeyFromDate(cutoff))}`,
              shortLabel: `${monthNames[month]} ${weekLabel} (${yearWeek})`,
              start: new Date(d),
              cutoff,
              isCurrentWeek: d <= now && now <= cutoff,
            });
            monthWeek += 1;
          }
        } else {
          const cutoff = new Date(year, month + 1, 0);
          periods.push({
            key: `m${month}`,
            label: monthNames[month],
            shortLabel: monthNames[month],
            start: new Date(year, month, 1),
            cutoff,
          });
        }
      }
      return periods;
    };

    const renderFixImpact = () => {
      let periods = currentQuarterPeriods();
      // Áreas: para CO se usan SOLO los valores de fix.area del sheet "Fixes CO" (columna K).
      // Para otros países, se usan los valores de question.area.
      // Si CO no tiene fixes con área definida, se cae a question.area como respaldo.
      const _qAreaSource = questionSourceForCurrentType().questions;
      const _fixAreaVals = state.country === "CO"
        ? [...new Set((fixesData().CO || []).map(fixAreaValue).filter(Boolean))]
        : [];
      const _areaPool = (_fixAreaVals.length > 0 && state.country === "CO")
        ? _fixAreaVals
        : _qAreaSource.map(q => q.area || "Sin área").filter(Boolean);
      const impactAreaOptions = ["Todas", ...new Set(_areaPool)]
        .sort((a, b) => a === "Todas" ? -1 : b === "Todas" ? 1 : String(a).localeCompare(String(b), "es"));
      if (!impactAreaOptions.includes(state.impactArea)) state.impactArea = "Todas";
      const impactResponsibleOptions = ["Todos", ...new Set(filtered()
        .flatMap(kitchen => fixesForKitchen(kitchen)
          .filter(fix => fixMatchesKitchen(fix, kitchen, state.country))
          .filter(fix => fixMatchesImpactStatus(fix))
          .map(fixResponsibleValue))
        .filter(Boolean))]
        .sort((a, b) => a === "Todos" ? -1 : b === "Todos" ? 1 : String(a).localeCompare(String(b), "es"));
      if (!impactResponsibleOptions.includes(state.impactResponsible)) state.impactResponsible = "Todos";
      const impactStatusOptions = ["Todos", ...new Set(filtered()
        .flatMap(kitchen => fixesForKitchen(kitchen)
          .filter(fix => fixMatchesKitchen(fix, kitchen, state.country))
          .filter(fix => fixMatchesImpactResponsible(fix))
          .map(fixStatusValue))
        .filter(Boolean))]
        .sort((a, b) => a === "Todos" ? -1 : b === "Todos" ? 1 : String(a).localeCompare(String(b), "es"));
      const validImpactStatuses = selectedImpactStatuses().filter(status => impactStatusOptions.includes(status));
      state.impactStatus = validImpactStatuses.length ? validImpactStatuses : ["Todos"];
      const quarterEnd = periods[periods.length - 1]?.cutoff;
      const afterQuarterStart = quarterEnd ? new Date(quarterEnd.getFullYear(), quarterEnd.getMonth(), quarterEnd.getDate() + 1) : null;
      const scopedFixes = scopedUniqueFixes();
      if (afterQuarterStart && scopedFixes.some(fix => {
        const closeDate = fixCloseDate(fix);
        return closeDate && closeDate >= afterQuarterStart;
      })) {
        periods = [
          ...periods,
          {
            key: "after-quarter",
            label: "Posterior al Q",
            shortLabel: "Posterior Q",
            start: afterQuarterStart,
            cutoff: null,
            afterQuarterStart,
          },
        ];
      }
      if (scopedFixes.some(fix => !fixCloseDate(fix))) {
        periods = [
          ...periods,
          {
            key: "undated",
            label: "Sin fecha",
            shortLabel: "Sin fecha",
            start: null,
            cutoff: null,
            undated: true,
          },
        ];
      }
      // questionAreaFilter: si hay área de pregunta seleccionada, restringir a esos básicos
      const _qAreaFilter = state.impactArea !== "Todas" ? state.impactArea : null;
      const rows = filtered().map(kitchen => {
        const periodValues = periods.map(period => ({ period, impact: fixImpactForKitchenUntil(kitchen, period.cutoff, period.start, _qAreaFilter, period.undated, period.afterQuarterStart) })).filter(item => item.impact);
        const original = periodValues[0]?.impact.original ?? null;
        const latest = periodValues[periodValues.length - 1]?.impact.adjusted ?? null;
        const fixedCount = periodValues[periodValues.length - 1]?.impact.fixedCount ?? 0;
        const budget = periodValues.reduce((sum, item) => sum + (item.impact.budget || 0), 0);
        return { kitchen, original, latest, fixedCount, budget, periodValues };
      }).filter(row => row.periodValues.length)
        .sort((a, b) => ((b.latest ?? 0) - (b.original ?? 0)) - ((a.latest ?? 0) - (a.original ?? 0)));
      const originalAvg = rows.length ? rows.reduce((sum, row) => sum + (row.original ?? 0), 0) / rows.length : null;
      const latestAvg = rows.length ? rows.reduce((sum, row) => sum + (row.latest ?? 0), 0) / rows.length : null;
      const totalFixed = rows.reduce((sum, row) => sum + row.fixedCount, 0);
      const totalBudget = rows.reduce((sum, row) => sum + row.budget, 0);
      const totalBudgetQ = scopedBudgetTotal();
      const periodAverages = periods.map((period, index) => {
        const values = rows.map(row => row.periodValues[index]?.impact.adjusted).filter(value => value != null);
        return values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : null;
      });
      const periodBudgets = periods.map((period, index) => rows.reduce((sum, row) => sum + (row.periodValues[index]?.impact.budget || 0), 0));
      const periodFixedCounts = periods.map((period, index) => rows.reduce((sum, row) => sum + (row.periodValues[index]?.impact.periodFixedCount || 0), 0));
      const impactTableWidth = 180 + 110 + 120 + (periods.length * 125) + 120 + 140;

      byId("fix-impact").innerHTML = `
        <article class="panel">
          <div class="detail-head">
            <div>
              <div class="detail-title">Impacto Fix · Evolución ${reportQuarterLabel()}</div>
              <div class="detail-sub">${data().name} · ${state.cityFilter === "Todas" ? "Todas las ciudades" : state.cityFilter} · ${typeLabel()} · Área básico: ${state.impactArea} · Responsable: ${state.impactResponsible} · Status: ${impactStatusLabel()}</div>
            </div>
            <div class="city-control" style="margin-left:auto">
              <label for="impactAreaSelect">Área básico</label>
              <select id="impactAreaSelect" style="min-width:220px">
                ${impactAreaOptions.map(area => `<option value="${area}" ${area === state.impactArea ? "selected" : ""}>${area}</option>`).join("")}
              </select>
              <label for="impactResponsibleSelect">Responsable</label>
              <select id="impactResponsibleSelect" style="min-width:220px">
                ${impactResponsibleOptions.map(responsible => `<option value="${responsible}" ${responsible === state.impactResponsible ? "selected" : ""}>${responsible}</option>`).join("")}
              </select>
              <label>Status</label>
              <details class="check-dropdown" id="impactStatusDropdown">
                <summary>${impactStatusLabel()}</summary>
                <div class="check-menu">
                  ${impactStatusOptions.map(status => `
                    <label class="check-option">
                      <input type="checkbox" data-impact-status-option value="${status}" ${selectedImpactStatuses().includes(status) ? "checked" : ""}>
                      <span>${status}</span>
                    </label>
                  `).join("")}
                  <div class="check-actions">
                    <button type="button" data-impact-status-clear>Limpiar</button>
                    <button type="button" data-impact-status-apply>Aplicar</button>
                  </div>
                </div>
              </details>
            </div>
          </div>

          <div class="detail-summary">
            <div class="detail-stat">
              <div class="detail-stat-label">% original</div>
              <div class="detail-stat-value" style="color:${getStatus(originalAvg).color}">${originalAvg != null ? fmt(originalAvg) : "N/A"}</div>
              <div class="detail-stat-sub">Antes de aplicar fixes</div>
            </div>
            <div class="detail-stat">
              <div class="detail-stat-label">% proyectado fin Q</div>
              <div class="detail-stat-value" style="color:${getStatus(latestAvg).color}">${latestAvg != null ? fmt(latestAvg) : "N/A"}</div>
              <div class="detail-stat-sub">Con fixes acumulados hasta ${periods[periods.length - 1]?.label}</div>
            </div>
            <div class="detail-stat">
              <div class="detail-stat-label">Impacto estimado</div>
              <div class="detail-stat-value" style="color:${getStatus((latestAvg ?? 0) - (originalAvg ?? 0) + 50).color}">+${latestAvg != null && originalAvg != null ? (latestAvg - originalAvg).toFixed(1) : "0.0"} pts</div>
              <div class="detail-stat-sub">${totalFixed} básico-cocina recalculados a 100% · Budget aplicado ${formatMoney(totalBudget)} · Budget Q ${formatMoney(totalBudgetQ)}</div>
            </div>
          </div>

          ${renderAreaImpactTable(periods, impactAreaOptions)}

          <div class="table-scroll-top" id="impactTopScroll"><div style="width:${impactTableWidth}px;height:1px"></div></div>
          <div class="detail-table-wrap" id="impactTableScroll">
            <table class="basic-detail-table impact-table" style="--sticky-col-width:180px">
              <thead>
                <tr>
                  <th style="width:180px">Cocina</th>
                  <th style="width:110px">Ciudad</th>
                  <th style="width:120px">% original</th>
                  ${periods.map(period => `<th class="${period.isCurrentWeek ? "current-week-col" : ""}" style="width:125px">${period.shortLabel}</th>`).join("")}
                  <th style="width:120px">Sube Q</th>
                  <th style="width:140px">Fixes / Budget</th>
                </tr>
                <tr>
                  <th></th>
                  <th></th>
                  <th>${originalAvg != null ? fmt(originalAvg) : "N/A"}</th>
                  ${periodAverages.map((value, index) => `<th class="${periods[index]?.isCurrentWeek ? "current-week-col" : ""}">${value != null ? fmt(value) : "N/A"}<div class="fix-muted">${periodFixedCounts[index]} fixes</div><div class="fix-muted">${formatMoney(periodBudgets[index] || 0)}</div></th>`).join("")}
                  <th>+${latestAvg != null && originalAvg != null ? (latestAvg - originalAvg).toFixed(1) : "0.0"} pts</th>
                  <th>${totalFixed}<div class="fix-muted">${formatMoney(totalBudgetQ)}</div></th>
                </tr>
              </thead>
              <tbody>
                ${rows.map(row => {
                  const s = getStatus(row.latest);
                  return `
                    <tr>
                      <td><strong>${row.kitchen.id}</strong></td>
                      <td>${row.kitchen.city}</td>
                      <td>${row.original != null ? fmt(row.original) : "N/A"}</td>
                      ${row.periodValues.map(item => {
                        const ps = getStatus(item.impact.adjusted);
                        const active = state.impactKitchenId === row.kitchen.id && state.impactPeriodKey === item.period.key;
                        return `<td class="${item.period.isCurrentWeek ? "current-week-col" : ""}" data-impact-cell data-impact-kitchen="${row.kitchen.id}" data-impact-period="${item.period.key}" style="cursor:pointer;${active ? `outline:2px solid ${PALETTE.cyanDark};outline-offset:-2px` : ""}"><strong style="color:${ps.color}">${item.impact.adjusted != null ? fmt(item.impact.adjusted) : "N/A"}</strong><div class="fix-muted">${item.impact.periodFixedCount || 0} fixes</div><div class="fix-muted">${formatMoney(item.impact.budget || 0)}</div></td>`;
                      }).join("")}
                      <td>+${row.latest != null && row.original != null ? (row.latest - row.original).toFixed(1) : "0.0"} pts</td>
                      <td>${row.fixedCount}<div class="fix-muted">${formatMoney(row.budget || 0)}</div></td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
          ${renderImpactFixDetail(periods)}
          ${renderAreaImpactDetail(periods)}
          <div class="info">Regla aplicada: si un básico estaba en 0% o 50% y tiene Fix con fecha de cierre/compromiso hasta el corte de cada columna, se recalcula como 100%. Para CP se usan únicamente los planes de la hoja Fixes CPs; para cocinas se usan las hojas Fixes por país.</div>
        </article>
      `;
      syncFixScroll();
    };

    const syncFixScroll = () => {
      [
        ["fixTopScroll", "fixTableScroll"],
        ["impactTopScroll", "impactTableScroll"],
        ["impactAreaTopScroll", "impactAreaTableScroll"],
      ].forEach(([topId, bottomId]) => {
        const top = byId(topId);
        const bottom = byId(bottomId);
        if (!top || !bottom) return;
        top.onscroll = () => { bottom.scrollLeft = top.scrollLeft; };
        bottom.onscroll = () => { top.scrollLeft = bottom.scrollLeft; };
      });
    };

    // ── Gantt helpers ─────────────────────────────────────
    const ganttStartDate = (fix) => dateFromText(fix.compromiso) || monthFromText(fix.compromiso);
    const ganttEndDate   = (fix) => fixCloseDate(fix);
    const ganttFixStatus = (fix) => {
      const n = normalizeText(fix.status);
      if (["EJECUTADO", "CERRADO", "CERRADA", "REALIZADO"].includes(n)) return "done";
      if (n === "DESPRIORIZADO") return "depriorizado";
      const d = ganttEndDate(fix);
      if (d) {
        const t = new Date(); t.setHours(0,0,0,0);
        if (d < t) return "overdue";
      }
      return "open";
    };

    // Builds Q periods: whole months for Apr/May, weekly for Jun (current month)
    const ganttQuarterPeriods = () => {
      const refDate = reportReferenceDate();
      const now   = new Date(refDate);
      const year  = REPORT_YEAR;
      const curM  = refDate.getMonth();
      const qStart = (reportQuarter() - 1) * 3;
      const MN = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
      // Meses expandidos en semanas (por defecto, el mes actual). Se puede
      // abrir/cerrar cualquier mes haciendo clic en su encabezado.
      if (!state.ganttExpandedMonths) state.ganttExpandedMonths = new Set([curM]);
      const expanded = state.ganttExpandedMonths;
      const periods = [];
      for (let m = qStart; m < qStart + 3; m++) {
        if (expanded.has(m)) {
          // Desglosar el mes en semanas
          const last = new Date(year, m + 1, 0);
          let d = new Date(year, m, 1);
          let wk = 1;
          while (d <= last) {
            const wStart = new Date(d);
            const wEnd   = new Date(d); wEnd.setDate(wEnd.getDate() + 6);
            const cutoff = wEnd > last ? new Date(last) : new Date(wEnd);
            periods.push({
              key: `m${m}-w${wk}`, label: `${MN[m]} S${wk}`, shortLabel: `S${wk}`,
              start: wStart, end: cutoff,
              isWeek: true, month: m, monthName: MN[m],
              isCurrentWeek: wStart <= now && now <= cutoff,
            });
            wk++;
            d = new Date(cutoff); d.setDate(d.getDate() + 1);
          }
        } else {
          periods.push({
            key: `m${m}`, label: MN[m], shortLabel: MN[m],
            start: new Date(year, m, 1), end: new Date(year, m + 1, 0),
            isWeek: false, month: m, monthName: MN[m], isCurrentWeek: false,
          });
        }
      }
      return periods;
    };

    const ganttPlanKey = (fix) =>
      encodeURIComponent(normalizeText((fix.subcategoria || "") + "|" + (fix.iniciativa || fix.basic || "")));

    const showGanttBasicDetail = (basicKey) => {
      const existing = document.getElementById("ganttDetailModal");
      if (existing) existing.remove();

      const allFixes = fixesForCurrentType().filter(fix =>
        !!(fix.iniciativa || fix.subcategoria || fix.basic) &&
        encodeURIComponent(normalizeText(fix.basic || fix.subcategoria || "")) === basicKey
      );
      if (!allFixes.length) return;

      const rep0 = allFixes[0];
      const basicText = rep0.basic || rep0.subcategoria || "—";
      const area  = rep0.area || "Sin área";
      const sub   = rep0.subcategoria || "";

      // Group by plan
      const planMap = new Map();
      allFixes.forEach(fix => {
        const pk = ganttPlanKey(fix);
        if (!planMap.has(pk)) planMap.set(pk, []);
        planMap.get(pk).push(fix);
      });

      const SC = {
        open:         { color:"#0b769f", bg:"#e7f6fc", label:"A tiempo"       },
        overdue:      { color:"#96607d", bg:"#f4eaf0", label:"Atrasado"       },
        done:         { color:"#4a9070", bg:"#eef3f0", label:"Completado"     },
        depriorizado: { color:"#94a3b8", bg:"#f1f5f9", label:"Despriorizado"  },
      };

      const planRows = [...planMap.entries()].map(([pk, pFixes]) => {
        const pr = pFixes[0];
        const statuses    = pFixes.map(f => ganttFixStatus(f));
        const activeStats = statuses.filter(s => s !== "depriorizado");
        const doneN       = activeStats.filter(s => s === "done").length;
        const overdueN    = activeStats.filter(s => s === "overdue").length;
        const tot         = activeStats.length;
        const allDone     = tot > 0 && doneN === tot;
        const isPartial   = doneN > 0 && !allDone;
        const pct         = tot > 0 ? Math.round(doneN / tot * 100) : 0;
        let s = tot === 0 ? "depriorizado" : allDone ? "done" : isPartial ? "open" : overdueN > 0 ? "overdue" : "open";
        const sc = SC[s];
        const statusLabel = tot === 0 ? sc.label : allDone ? sc.label : isPartial ? `En proceso · ${pct}%` : sc.label;
        const eds = pFixes.map(f => ganttEndDate(f)).filter(Boolean);
        const latestEd = eds.length ? new Date(Math.max(...eds)) : null;
        const dateStr = latestEd
          ? latestEd.toLocaleDateString("es-CO",{day:"2-digit",month:"short",year:"numeric"})
          : (pr.cierre || pr.compromiso || "—");
        return `
          <div class="gantt-row-clickable" data-gantt-detail="${pk}"
            style="padding:12px 16px;border-bottom:1px solid var(--light-gray);cursor:pointer">
            <div style="font-size:12px;color:var(--navy);font-weight:500;margin-bottom:5px;line-height:1.4">${pr.iniciativa || pr.subcategoria || "—"}</div>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              <span style="font-size:11px;font-weight:650;color:${sc.color};background:${sc.bg};padding:2px 8px;border-radius:999px">${statusLabel}</span>
              <span style="font-size:11px;color:var(--text-muted)">${tot} cocina${tot!==1?"s":""}</span>
              <span style="font-size:11px;color:var(--text-muted)">${dateStr}</span>
              ${pr.responsable ? `<span style="font-size:11px;color:var(--text-muted)">${pr.responsable}</span>` : ""}
            </div>
          </div>`;
      }).join("");

      const modal = document.createElement("div");
      modal.id = "ganttDetailModal";

      });

    const showGanttFixDetail = (planKey) => {
      const existing = document.getElementById("ganttDetailModal");
      if (existing) existing.remove();

      // All fixes for current country/type, no status filter
      const allFixes = fixesForCurrentType().filter(fix =>

      const SC = {

        overdue:      { color:"#96607d", bg:"#f4eaf0", label:"Atrasado"       },
        done:         { color:"#4a9070", bg:"#eef3f0", label:"Completado"     },
        depriorizado: { color:"#94a3b8", bg:"#f1f5f9", label:"Despriorizado"  },
      };

      const matches = allFixes
        .filter(fix => ganttPlanKey(fix) === planKey)
        .sort((a, b) => {
          const ord = { overdue:0, open:1, done:2 };
          return (ord[ganttFixStatus(a)] ?? 1) - (ord[ganttFixStatus(b)] ?? 1);
        });

      if (!matches.length) return;

      const rep   = matches[0];
      const pName = rep.iniciativa || rep.subcategoria || rep.basic || "Plan";

      const overdueN= matches.filter(f => ganttFixStatus(f) === "overdue").length;
      const openN   = matches.filter(f => ganttFixStatus(f) === "open").length;

      const tbody = matches.map(fix => {
        const s  = ganttFixStatus(fix);
        const sc = SC[s];
        const ed = ganttEndDate(fix);
        const dateStr = ed
          ? ed.toLocaleDateString("es-CO",{day:"2-digit",month:"short",year:"numeric"})

        return `
          <tr style="border-bottom:1px solid var(--light-gray)">

            </td>

            <td style="padding:9px 12px;font-size:12px;color:var(--text-muted);white-space:nowrap">${dateStr}</td>
            <td style="padding:9px 12px;font-size:11px;color:var(--text-muted);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${(fix.responsable||"").replace(/"/g,"'")}">${fix.responsable || "—"}</td>
          </tr>`;
      }).join("");

      const modal = document.createElement("div");
      modal.id = "ganttDetailModal";
      modal.style.cssText = "position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.38);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px";
      modal.innerHTML = `
        <div style="background:var(--panel);border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,0.18);max-width:680px;width:100%;max-height:82vh;overflow:hidden;display:flex;flex-direction:column">
          <div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px;flex-shrink:0">
            <div style="flex:1;min-width:0">
              <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.04em">${sub ? sub + " · " : ""}${area}</div>
              <div style="font-size:14px;font-weight:650;color:var(--navy);line-height:1.35">${pName}</div>
              <div style="display:flex;gap:14px;margin-top:8px;flex-wrap:wrap">
                <span style="font-size:12px;color:var(--text-muted)">${total} cocina${total!==1?"s":""}</span>
                ${openN    ? `<span style="font-size:12px;font-weight:600;color:#0b769f">▸ ${openN} a tiempo</span>` : ""}
                ${overdueN ? `<span style="font-size:12px;font-weight:600;color:#96607d">▸ ${overdueN} atrasado${overdueN!==1?"s":""}</span>` : ""}
                ${doneN    ? `<span style="font-size:12px;font-weight:600;color:#4a9070">▸ ${doneN} completado${doneN!==1?"s":""}</span>` : ""}
              </div>
            </div>
            <button data-close-gantt-modal type="button"
              style="flex-shrink:0;width:28px;height:28px;border:1px solid var(--border);border-radius:6px;
                     background:transparent;cursor:pointer;font-size:14px;color:var(--text-muted);
                     display:flex;align-items:center;justify-content:center">✕</button>
          </div>
          <div style="overflow-y:auto;flex:1">
            <table style="width:100%;border-collapse:collapse">
              <thead style="position:sticky;top:0;z-index:1">
                <tr style="background:var(--soft);border-bottom:1px solid var(--border)">
                  <th style="padding:8px 12px;text-align:left;font-size:11px;font-weight:650;color:var(--slate);text-transform:uppercase;letter-spacing:0.04em">Cocina</th>
                  <th style="padding:8px 12px;text-align:left;font-size:11px;font-weight:650;color:var(--slate);text-transform:uppercase;letter-spacing:0.04em">Status</th>
                  <th style="padding:8px 12px;text-align:left;font-size:11px;font-weight:650;color:var(--slate);text-transform:uppercase;letter-spacing:0.04em">Cierre</th>
                  <th style="padding:8px 12px;text-align:left;font-size:11px;font-weight:650;color:var(--slate);text-transform:uppercase;letter-spacing:0.04em">Responsable</th>
                </tr>

              <tbody>${tbody}</tbody>
            </table>
