    };

    const renderDashboardDrilldown = () => {
      const source = state.typeFilter === "cp" ? cpData() : sheetData();
      const questions = source.questions.map((question, index) => ({ ...question, index }));
      const matches = sheetKitchensForDashboardDrill();
      const fsCountry = (window.FORM_SCORES || {})[state.country];
      const hasFormBloque = !!(fsCountry?.byKitchenBloque && Object.keys(fsCountry.byKitchenBloque).length);
      if (!questions.length || (!matches.length && !hasFormBloque)) {
        return `<div class="drilldown"><div class="hint">No hay detalle disponible para el filtro actual.</div></div>`;
      }
      // Helper: compute block avg from FORM_SCORES filtered to current selection
      const formBloqueAvg = (block) => {
        if (!hasFormBloque) return null;
        const kitchens = filtered().filter(k => state.typeFilter === "cp" ? isCPKitchen(k) : !isCPKitchen(k));
        const vals = kitchens.map(k => fsCountry.byKitchenBloque[normalizeText(k.id)]?.[block] ?? null).filter(v => v !== null);
        return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
      };
      // Promedio de bloque en el Q anterior (cocinas MX = Q2; CP = baseline CP).
      const mxDeltaD = state.typeFilter === "cp" ? !!window.CP_PREV : (state.country === "MX" && !!window.Q2_FORM_MX);
      const formBloqueAvgQ2 = (block) => {
        const kitchens = filtered().filter(k => state.typeFilter === "cp" ? isCPKitchen(k) : !isCPKitchen(k));
        const vals = kitchens.map(k => prevKitchenBloque(k, block)).filter(v => v != null);
        return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
      };
      const hasTema = !!(fsCountry?.byKitchenTema && Object.keys(fsCountry.byKitchenTema).length);
      const hasFormQuestion = !!(fsCountry?.byKitchenQuestion && Object.keys(fsCountry.byKitchenQuestion).length);
      // Returns summarizeQuestionValues-compatible object using Preguntas sheet data
      const summarizeQuestionFromForm = (qNo) => {
        if (!hasFormQuestion || !qNo) return null;
        const kitchens = filtered().filter(k => state.typeFilter === "cp" ? isCPKitchen(k) : !isCPKitchen(k));
        const vals = kitchens.map(k => fsCountry.byKitchenQuestion[normalizeText(k.id)]?.[qNo] ?? null);
        const valid = vals.filter(v => v !== null);
        if (!valid.length) return null;
        return {
          avg: valid.reduce((a, b) => a + b, 0) / valid.length,
          full: vals.filter(v => v === 100).length,
          partial: vals.filter(v => v === 50).length,
          fail: vals.filter(v => v === 0).length,
          na: vals.filter(v => v === null).length,
          total: vals.length,
        };
      };
      const formTemaAvg = (tema) => {
        if (!hasTema) return null;
        const kitchens = filtered().filter(k => state.typeFilter === "cp" ? isCPKitchen(k) : !isCPKitchen(k));
        const vals = kitchens.map(k => fsCountry.byKitchenTema[normalizeText(k.id)]?.[tema] ?? null).filter(v => v !== null);
        return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
      };

      const blockNames = [...new Set(questions.map(question => question.bloque || "Sin bloque"))];
      if (state.dashboardBlock && !blockNames.includes(state.dashboardBlock)) {
        state.dashboardBlock = null;
        state.dashboardTheme = null;
      }

      const prevDashData = state.country === "CO" ? (window.PREV_CO_SCORES || null) : null;
      const blockCards = blockNames.map(block => {
        const blockQuestions = questions.filter(question => (question.bloque || "Sin bloque") === block);
        const sheetBlockAvg = matches.length ? summarizeQuestionGroup(blockQuestions, matches).avg : null;
        // Prefer FORM_SCORES; if direct bloque-name doesn't match, fall back to averaging tema scores
        const blockAvg = (() => {
          const direct = formBloqueAvg(block);
          if (direct != null) return direct;
          if (hasTema) {
            const blockTemas = [...new Set(blockQuestions.map(q => q.tema || ""))].filter(Boolean);
            const tv = blockTemas.map(t => formTemaAvg(t)).filter(v => v !== null);
            if (tv.length) return tv.reduce((a, b) => a + b, 0) / tv.length;
          }
          return sheetBlockAvg;
        })();
        const summary = { avg: blockAvg, total: blockQuestions.length };
        const s = getStatus(summary.avg);
        let prevBlockAvg = null;
        if (prevDashData) {
          const blockTemas = [...new Set(blockQuestions.map(q => q.tema || "Sin tema"))];
          const tv = blockTemas.map(t => prevDashData.byTema?.[t]).filter(v => v != null);
          if (tv.length) prevBlockAvg = tv.reduce((a, b) => a + b, 0) / tv.length;
        }
        return `
          <button class="drill-card ${state.dashboardBlock === block ? "active" : ""}" data-dashboard-block="${block}" type="button">
            <div class="drill-title">${block}</div>
            <div class="drill-meta">
              <span>${summary.total} básicos</span>
              <span style="display:flex;align-items:center;gap:6px">
                ${mxDeltaD ? cq3DeltaBadge(summary.avg, formBloqueAvgQ2(block)) : ""}
                ${trendBadgeHtml(summary.avg, prevBlockAvg)}
                <strong style="color:${s.color}">${summary.avg != null ? fmt(summary.avg) : "N/A"}</strong>
              </span>
            </div>
            <div class="bar" style="height:4px;margin:8px 0 0"><div class="bar-fill" style="width:${summary.avg ?? 0}%;background:${s.bar || s.color}"></div></div>
          </button>
        `;
      }).join("");

      const selectedBlockQuestions = state.dashboardBlock
        ? questions.filter(question => (question.bloque || "Sin bloque") === state.dashboardBlock)
        : [];
      const themeNames = [...new Set(selectedBlockQuestions.map(question => question.tema || "Sin tema"))];
      if (state.dashboardTheme && !themeNames.includes(state.dashboardTheme)) {
        state.dashboardTheme = null;
      }

      const themeCards = state.dashboardBlock ? themeNames.map(theme => {
        const themeQuestions = selectedBlockQuestions.filter(question => (question.tema || "Sin tema") === theme);
        const sheetThemeAvg = matches.length ? summarizeQuestionGroup(themeQuestions, matches).avg : null;
        const themeAvg = formTemaAvg(theme) ?? sheetThemeAvg;
        const s = getStatus(themeAvg);
        return `
          <button class="drill-card ${state.dashboardTheme === theme ? "active" : ""}" data-dashboard-theme="${theme}" type="button">
            <div class="drill-title">${theme}</div>
            <div class="drill-meta"><span>${themeQuestions.length} preguntas</span><strong style="color:${s.color}">${themeAvg != null ? fmt(themeAvg) : "N/A"}</strong></div>
          </button>
        `;
      }).join("") : "";

      const questionRows = state.dashboardTheme ? selectedBlockQuestions
        .filter(question => (question.tema || "Sin tema") === state.dashboardTheme)
        .map(question => {
          const summary = summarizeQuestionFromForm(question.no) || summarizeQuestionValues(question.index, matches);
          const s = getStatus(summary.avg);
          return `
            <div class="question-row">
              <div class="question-text">B${question.no}. ${basicName(question.index)}</div>
              <div class="drill-meta" style="margin-bottom:8px"><span>${question.area || "Sin área"}</span><strong style="color:${s.color}">${summary.avg != null ? fmt(summary.avg) : "N/A"}</strong></div>
              <div class="question-stats">
                <div class="question-stat"><span>100%</span><strong>${summary.full}</strong></div>
                <div class="question-stat"><span>50%</span><strong>${summary.partial}</strong></div>
                <div class="question-stat"><span>0%</span><strong>${summary.fail}</strong></div>
                <div class="question-stat"><span>N/A</span><strong>${summary.na}</strong></div>
              </div>
            </div>
          `;
        }).join("") : "";

      return `
        <div class="drilldown">
          <div class="drill-head">
            <div class="hint" style="margin-bottom:0">Detalle calculado con el filtro superior: ${state.cityFilter === "Todas" ? "todas las ciudades" : state.cityFilter}.</div>
            <button type="button" class="view-tab" data-clear-dashboard-drill>Limpiar filtros</button>
          </div>
          <div class="small-title">Detalle por bloque</div>
          <div class="drill-grid">${blockCards}</div>
          ${state.dashboardBlock ? `
            <div class="small-title">Temas de ${state.dashboardBlock}</div>
            <div class="drill-grid">${themeCards}</div>
          ` : `<div class="hint">Selecciona un bloque para ver sus temas y recalcular el ranking por ese bloque.</div>`}
          ${state.dashboardTheme ? `
            <div class="small-title">Preguntas de ${state.dashboardTheme}</div>
            <div class="question-list">${questionRows}</div>
          ` : state.dashboardBlock ? `<div class="hint">Selecciona un tema para ver sus preguntas y recalcular el ranking por ese tema.</div>` : ""}
        </div>
      `;
    };

    const dashboardRankingQuestions = () => {
      const questions = questionSourceForCurrentType().questions.map((question, index) => ({ ...question, index }));
      if (!state.dashboardBlock) return [];
      return questions.filter(question => {
        const sameBlock = (question.bloque || "Sin bloque") === state.dashboardBlock;
        const sameTheme = !state.dashboardTheme || (question.tema || "Sin tema") === state.dashboardTheme;
        return sameBlock && sameTheme;
      });
    };

    const kitchenAverageForQuestions = (kitchen, questions) => {
      const sheetKitchen = sheetKitchenFor(kitchen);
      if (!sheetKitchen || !questions.length) return null;
      const kafqFsK = (window.FORM_SCORES || {})[state.country];
      const kafqNormId = normalizeText(kitchen?.id || "");
      const kafqFormQ = kafqFsK?.byKitchenQuestion?.[kafqNormId] || null;
      const hasFsData = !!kafqFsK?.byKitchenQuestion;
      const values = questions
        .map(question => {
          const sv = sheetKitchen.values[question.index];
          const formVal = kafqFormQ ? (kafqFormQ[question.no] ?? null) : null;
          // Si hay FORM_SCORES para este país, úsalos primero (datos más recientes)
          return hasFsData ? formVal : (sv != null ? sv : formVal);
        })
        .filter(value => value != null);
      return values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : null;
    };

    // Compute block score (seg/hig/limp/infra/ppl) dynamically from sheet values
    // People (Uniformes) usa area="People", no bloque (B35/B36 están en "Higiene personal y sanitaria")
    const kitchenBlockScore = (kitchen, blockLabel) => {
      const isPeople = blockLabel === "People (Uniformes)";
      // Preferir el % de bloque ya calculado (FORM_SCORES.byKitchenBloque), que en
      // MX-Q3 cubre TODAS las cocinas con dato (aunque no tengan respuesta cruda).
      if (!isPeople) {
        const kbBk = ((window.FORM_SCORES || {})[state.country])?.byKitchenBloque?.[normalizeText(kitchen.id)];
        if (kbBk) {
          const hit = Object.keys(kbBk).find(k => normalizeText(k) === normalizeText(blockLabel));
          if (hit && kbBk[hit] != null) return kbBk[hit];
        }
      }
      const questions = detailDataForKitchen(kitchen).questions
        .map((q, i) => ({ ...q, index: i }))
        .filter(q => isPeople ? q.area === PEOPLE_AREA : normalizeText(q.bloque || "") === normalizeText(blockLabel));
      if (!questions.length) return null;
      return kitchenAverageForQuestions(kitchen, questions);
    };

    // Compute city averages dynamically from live kitchenScore values
    const computedCityScores = () => {
      const acc = {};
      filtered().forEach(kitchen => {
        const score = kitchenScore(kitchen);
        if (score == null || !kitchen.city) return;
        if (!acc[kitchen.city]) acc[kitchen.city] = { sum: 0, n: 0 };
        acc[kitchen.city].sum += score;
        acc[kitchen.city].n  += 1;
      });
      return Object.fromEntries(Object.entries(acc).map(([city, { sum, n }]) => [city, sum / n]));
    };

    const trendBadgeHtml = (curr, prev) => {
      if (curr == null || prev == null) return "";
      const diff = curr - prev;
      if (diff > 1.5)  return `<span class="trend-badge trend-up"  title="Q1 2026: ${prev.toFixed(1)}%">↑</span>`;
      if (diff < -1.5) return `<span class="trend-badge trend-down" title="Q1 2026: ${prev.toFixed(1)}%">↓</span>`;
      return              `<span class="trend-badge trend-eq"  title="Q1 2026: ${prev.toFixed(1)}%">=</span>`;
    };
    const prevKitchenScore = (kitchen) => {
      if (state.country !== "CO" || !window.PREV_CO_SCORES) return null;
      return window.PREV_CO_SCORES.byKitchen?.[normalizeText(kitchen.id)]?.score ?? null;
    };

    // Proyección del cierre de una cocina aplicando sus planes de acción (compartida
    // por Dashboard y Gantt). mode "all" = todos los planes salvo despriorizados;
    // mode "done" = solo los completados/ejecutados.
    const projStatusIsDone  = (fix) => ["EJECUTADO", "CERRADO", "CERRADA", "REALIZADO"].includes(normalizeText(fixStatusValue(fix)));
    const projStatusIsDepri = (fix) => normalizeText(fixStatusValue(fix)) === "DESPRIORIZADO";
    const projectedScore = (kitchen, mode) => {
      if (!kitchen) return null;
      const fsK = (window.FORM_SCORES || {})[state.country];
      const norm = normalizeText(kitchen.id);
      const formQ = fsK?.byKitchenQuestion?.[norm] || null;
      const sheetKitchen = sheetKitchenFor(kitchen);
      const hasPerQ = !!formQ || !!(sheetKitchen && (sheetKitchen.values || []).some(v => v != null));
      const questions = detailDataForKitchen(kitchen).questions.map((q, i) => ({ ...q, index: i }));
      if (!questions.length) return null;
      const isResolved = mode === "done" ? projStatusIsDone : (fix) => !projStatusIsDepri(fix);
      const allFixes = fixesForKitchen(kitchen).filter(fix => fixMatchesKitchen(fix, kitchen, state.country));
      const resolvingFixes = allFixes.filter(isResolved);
      if (hasPerQ) {
        const vals = [];
        questions.forEach(q => {
          const sv = sheetKitchen ? sheetKitchen.values[q.index] : null;
          const fv = formQ ? (formQ[q.no] ?? null) : null;
          const value = formQ ? fv : (sv != null ? sv : null);
          if (value == null) return;
          const covered = resolvingFixes.some(fix => fixMatchesQuestion(fix, q, state.country));
          vals.push((covered && value < 100) ? 100 : value);
        });
        return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
      }
      const temaMap = fsK?.byKitchenTema?.[norm];
      const SS = (fsK && fsK._questions) ? null : window.Q3_SCHEMA;
      // Sub-áreas: del esquema del país si existe, o de las preguntas del diagnóstico.
      const subareas = SS ? SS.subareas : (() => {
        const temas = []; questions.forEach(q => { if (q.tema && !temas.includes(q.tema)) temas.push(q.tema); });
        return temas.map(t => ({ name: t, questionNos: questions.filter(q => q.tema === t).map(q => q.no) }));
      })();
      if (!temaMap) return kitchenScore(kitchen);
      let totalPts = 0, totalQ = 0;
      subareas.forEach(sa => {
        const P = temaMap[sa.name];
        if (P == null) return;
        const n = sa.questionNos.length;
        const saQs = questions.filter(q => q.tema === sa.name);
        const failing = saQs.filter(q => allFixes.some(fix => fixMatchesQuestion(fix, q, state.country)));
        const resolved = saQs.filter(q => resolvingFixes.some(fix => fixMatchesQuestion(fix, q, state.country)));
        let avg;
        if (!failing.length || P >= 100) { avg = P; }
        else {
          const deficitPerQ = Math.min(100, (100 - P) * n / failing.length);
          const unresolved = failing.length - resolved.length;
          avg = Math.max(0, Math.min(100, 100 - (unresolved * deficitPerQ) / n));
        }
        totalPts += avg * n; totalQ += n;
      });
      return totalQ ? totalPts / totalQ : kitchenScore(kitchen);
    };

    const renderDashboard = () => {
      const rows = withData();
      const avg = rows.length ? rows.reduce((sum, kitchen) => sum + kitchenScore(kitchen), 0) / rows.length : 0;
      const scoreTarget = state.country === "CO" ? 80 : state.country === "MX" ? 90 : 75;
      const green = rows.filter(k => kitchenScore(k) >= scoreTarget).length;
      const midMin = Math.min(midThreshold(), scoreTarget);
      const yellow = rows.filter(k => kitchenScore(k) >= midMin && kitchenScore(k) < scoreTarget).length;
      const red = rows.filter(k => kitchenScore(k) != null && kitchenScore(k) < midMin).length;
      const total = rows.length || 1;
      const greenPct  = Math.round(green  / total * 100);
      const yellowPct = Math.round(yellow / total * 100);
      const redPct    = Math.round(red    / total * 100);
      // Variación en pp vs Q anterior. Funciona para cocinas MX (Q2) y para CP
      // (baseline de "Cp preguntas"). Se activa si alguna fila tiene dato previo.
      const q2avgList = rows.map(k => prevKitchenBasic(k)).filter(v => v != null);
      const q2avg = q2avgList.length ? q2avgList.reduce((a, b) => a + b, 0) / q2avgList.length : null;
      const mxDelta = q2avgList.length > 0;
      const q2CityScores = mxDelta ? (() => {
        const acc = {};
        filtered().forEach(k => { const v = prevKitchenBasic(k); if (v == null || !k.city) return; (acc[k.city] = acc[k.city] || { s: 0, n: 0 }); acc[k.city].s += v; acc[k.city].n += 1; });
        return Object.fromEntries(Object.entries(acc).map(([c, { s, n }]) => [c, s / n]));
      })() : {};
      const q2ForRank = (k) => {
        if (state.dashboardTheme) return prevKitchenTema(k, state.dashboardTheme);
        if (state.dashboardBlock) return prevKitchenBloque(k, state.dashboardBlock);
        return prevKitchenBasic(k);
      };
      // Proyección (cierre si se completan los planes no despriorizados).
      const projScores = rows.map(k => projectedScore(k, "all"));
      const projValid = projScores.filter(v => v != null);
      const projAvg = projValid.length ? projValid.reduce((a, b) => a + b, 0) / projValid.length : null;
      const hasProj = projValid.length > 0;
      const projGreen  = projScores.filter(p => p != null && p >= scoreTarget).length;
      const projYellow = projScores.filter(p => p != null && p >= midMin && p < scoreTarget).length;
      const projRed    = projScores.filter(p => p != null && p < midMin).length;
      const projTag = (v) => `&#8594; <strong>${v}</strong> proy.`;
      const kpis = [
        { label: "% Básicos", value: fmt(avg), status: avg, sub: [(mxDelta && q2avg != null) ? `${cq3DeltaBadge(avg, q2avg)} vs Q2` : "", hasProj ? `Proyectado ${fmt(projAvg)}` : ""].filter(Boolean).join(" · ") },
        { label: `Cocinas ≥${scoreTarget}%`, value: green,  sub: `${greenPct}% del total${hasProj ? ` · ${projTag(projGreen)}` : ""}`,  status: 100 },
        { label: `Cocinas ${midMin}-${scoreTarget}%`, value: yellow, sub: `${yellowPct}% del total${hasProj ? ` · ${projTag(projYellow)}` : ""}`, status: midMin },
        { label: `Cocinas <${midMin}%`,         value: red,    sub: `${redPct}% del total${hasProj ? ` · ${projTag(projRed)}` : ""}`,    status: 30 },
      ];

      const prevCityScores = (() => {
        if (state.country !== "CO" || !window.PREV_CO_SCORES) return {};
        const acc = {};
        filtered().forEach(kitchen => {
          const ps = prevKitchenScore(kitchen);
          if (ps == null || !kitchen.city) return;
          if (!acc[kitchen.city]) acc[kitchen.city] = { sum: 0, n: 0 };
          acc[kitchen.city].sum += ps;
          acc[kitchen.city].n  += 1;
        });
        return Object.fromEntries(Object.entries(acc).map(([c, { sum, n }]) => [c, sum / n]));
      })();
      const cityBars = Object.entries(computedCityScores()).map(([city, score]) => {
        const prevCity = prevCityScores[city] ?? null;
        const trendStr = trendBadgeHtml(score, prevCity);
        const mxCityDelta = (mxDelta && q2CityScores[city] != null)
          ? `<div style="text-align:right;margin-top:-8px;margin-bottom:6px;font-size:11px">${cq3DeltaBadge(score, q2CityScores[city])} <span style="color:#718096">vs Q2</span></div>`
          : "";
        return scoreBar(score, city) + (trendStr ? `<div style="text-align:right;margin-top:-8px;margin-bottom:4px;font-size:11px;color:#718096">${trendStr} Q1: ${prevCity.toFixed(1)}%</div>` : "") + mxCityDelta;
      }).join("");
      const rankQuestions = dashboardRankingQuestions();
      const rankingModeLabel = state.dashboardTheme
        ? `Ranking por tema · ${state.dashboardTheme}`
        : state.dashboardBlock
          ? `Ranking por bloque · ${state.dashboardBlock}`
          : `${state.typeFilter === "cp" ? "CP" : state.typeFilter === "kitchen" ? "Cocinas" : "Cocinas y CP"} · ${state.cityFilter === "Todas" ? "Todas las ciudades" : state.cityFilter}`;
      const rankingRows = [...rows]
        .map(kitchen => ({
          ...kitchen,
          rankValue: (() => {
            if (!rankQuestions.length) return kitchenScore(kitchen);
            const fsRank = (window.FORM_SCORES || {})[state.country];
            const normId = normalizeText(kitchen.id);
            // Prefer FORM_SCORES: tema → bloque → per-question average → SHEET_DETAIL fallback
            if (state.dashboardTheme && fsRank?.byKitchenTema?.[normId]?.[state.dashboardTheme] != null)
              return fsRank.byKitchenTema[normId][state.dashboardTheme];
            if (state.dashboardBlock && fsRank?.byKitchenBloque?.[normId]?.[state.dashboardBlock] != null)
              return fsRank.byKitchenBloque[normId][state.dashboardBlock];
            if (fsRank?.byKitchenQuestion?.[normId]) {
              const vals = rankQuestions.map(q => fsRank.byKitchenQuestion[normId][q.no] ?? null).filter(v => v !== null);
              if (vals.length) return vals.reduce((a, b) => a + b, 0) / vals.length;
            }
            return kitchenAverageForQuestions(kitchen, rankQuestions);
          })(),
        }))
        .sort((a, b) => {
          if (a.rankValue == null && b.rankValue == null) return 0;
          if (a.rankValue == null) return 1;
          if (b.rankValue == null) return -1;
          return state.dashboardRankOrder === "asc" ? a.rankValue - b.rankValue : b.rankValue - a.rankValue;
        });
      const ranking = rankingRows.map((k, index) => {
        const ps = prevKitchenScore(k);
        return `
          <div class="rank-row">
            <div class="rank-left">
              <span class="rank-number">#${index + 1}</span>
              <span class="rank-id">${k.id}</span>
            </div>
            <span style="display:flex;align-items:center;gap:6px">
              ${mxDelta ? cq3DeltaBadge(k.rankValue, q2ForRank(k)) : ""}
              ${trendBadgeHtml(k.rankValue, ps)}
              ${badge(k.rankValue)}
            </span>
          </div>
        `;
      }).join("");

      byId("dashboard").innerHTML = `
        <div class="kpis">
          ${kpis.map(k => {
            const s = getStatus(k.status);
            return `<article class="kpi" style="background:${s.bg};border-color:${s.color}40"><div class="kpi-label">${k.label}</div><div class="kpi-value" style="color:${s.color}">${k.value}</div>${k.sub ? `<div class="kpi-sub">${k.sub}</div>` : ""}</article>`;
          }).join("")}
        </div>
        <div class="grid-2 dashboard-grid">
          <article class="panel">
            <div class="panel-title">&#x2316; Por ciudad</div>
            ${cityBars}
            ${renderDashboardDrilldown()}
          </article>
          <article class="panel dashboard-ranking-panel">
            <div class="panel-title" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
              <span>&#x2605; Ranking de cocinas</span>
              <select id="dashboardRankOrder" style="min-width:150px;font-size:12px;padding:4px 8px">
                <option value="desc" ${state.dashboardRankOrder === "desc" ? "selected" : ""}>Mayor a menor</option>
                <option value="asc" ${state.dashboardRankOrder === "asc" ? "selected" : ""}>Menor a mayor</option>
              </select>
            </div>
            <div class="small-title">${rankingModeLabel}</div>
            <div class="ranking">${ranking}</div>
          </article>
        </div>
      `;
    };

    const sortedKitchens = () => [...filtered()].sort((a, b) => {
      const av = kitchenScore(a);
      const bv = kitchenScore(b);
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      return av - bv;
    });

    const renderKitchenList = () => {
      const cards = sortedKitchens().map((k, index) => {
        const kScore = kitchenScore(k);
        const s = getStatus(kScore);
        const metrics = kScore == null ? `<div class="empty" style="padding:8px 0">Datos pendientes</div>` : isCPKitchen(k) ? `
          <div class="mini-grid">
            <div class="mini-metric"><span class="mini-label">Cuestionario</span><span class="mini-value" style="color:${s.color}">CP</span></div>
            <div class="mini-metric"><span class="mini-label">Preguntas</span><span class="mini-value" style="color:${s.color}">${cpData().questions.length}</span></div>
          </div>
          <div class="bar" style="height:4px;margin-bottom:0"><div class="bar-fill" style="width:${kScore}%;background:${s.bar || s.color}"></div></div>
        ` : `
          <div class="mini-grid">
            ${BLOCK_LABELS.slice(0, 4).map(b => {
              const bv = kitchenBlockScore(k, b.label) ?? k[b.key];
              const bs = getStatus(bv);
              return `<div class="mini-metric"><span class="mini-label">${b.label.split(" ")[0]}</span><span class="mini-value" style="color:${bs.color}">${bv != null ? `${Math.round(bv)}%` : ""}</span></div>`;
            }).join("")}
          </div>
          <div class="bar" style="height:4px;margin-bottom:0"><div class="bar-fill" style="width:${kScore}%;background:${s.bar || s.color}"></div></div>
        `;
        return `
          <article class="kitchen-card" data-kitchen-index="${index}" style="--hover:${s.color}">
            <div class="card-head">
              <div>
                <div class="kitchen-id">${k.id}</div>
                <div class="city">${k.city}</div>
                ${!isCPKitchen(k) && kitchenSource(k) ? `<div style="margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">${diagBadge(kitchenSource(k))}${diagDeltaBadge(k)}</div>` : ""}
              </div>
              ${badge(kScore)}
            </div>
            ${metrics}
          </article>
        `;
      }).join("");

      byId("kitchens").innerHTML = `
        <div class="hint">${filtered().length} ${typeLabel().toLowerCase()} · ordenadas de menor a mayor cumplimiento · selecciona una para ver detalle</div>
        <div class="kitchen-grid">${cards}</div>
      `;
    };

    const renderKitchenDetail = () => {
      const k = state.selectedKitchen;
      const kScore = kitchenScore(k);
      byId("kitchens").innerHTML = `
        <button class="back" type="button" id="backToKitchens">&#x2190; Volver al listado</button>
        <article class="panel">
          <div class="detail-head">
            <div>
              <div class="detail-title">${k.id}</div>
              <div class="detail-sub">${k.city} · ${data().name}</div>
              ${!isCPKitchen(k) && kitchenSource(k) ? `<div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">${diagBadge(kitchenSource(k), 11)}${diagDeltaBadge(k)}${kitchenSource(k) === "projected" && kitchenPrevProjected(k) != null ? `<span style="font-size:11px;color:var(--text-muted)">Base: cierre ${diagSummary()?.prevLabel || "Q ant."}</span>` : ""}</div>` : ""}
            </div>
            ${badge(kScore)}
          </div>
          ${kScore != null ? `
            <div class="section-label">${isCPKitchen(k) ? "Cuestionario CP" : "Bloques de cumplimiento"}</div>
            ${isCPKitchen(k) ? scoreBar(kScore, "Cumplimiento CP", 8) : BLOCK_LABELS.filter(b => b.key !== "ppl").map(b => scoreBar(kitchenBlockScore(k, b.label) ?? k[b.key], b.label, 8)).join("")}
            ${renderKitchenQuestionDrilldown(k)}
          ` : `
            <div class="empty">&#x25f7;<br><br>Datos pendientes de carga para este Centro de Producción.</div>
          `}
        </article>
      `;
    };

    const renderKitchens = () => state.selectedKitchen ? renderKitchenDetail() : renderKitchenList();

    const renderBasics = () => {
      const matches = detailMatchesForCurrentType();
      const sourceKitchen = state.typeFilter === "cp" ? { id: "42 CP CDMX" } : null;
      const questions = questionSourceForCurrentType().questions.map((question, index) => ({ ...question, index }));
      const temas = [...new Set(questions.map(question => question.tema || "Sin tema"))];
      // FORM_SCORES-first summary for a question number (covers all kitchens, not just SHEET_DETAIL_DATA)
      const basicsFsCountry = (window.FORM_SCORES || {})[state.country];
      const basicsFormSummarize = (qNo) => {
        if (!basicsFsCountry?.byKitchenQuestion || !qNo) return null;
        const kitchens = filtered().filter(k => state.typeFilter === "cp" ? isCPKitchen(k) : !isCPKitchen(k));
        const vals = kitchens.map(k => basicsFsCountry.byKitchenQuestion[normalizeText(k.id)]?.[qNo] ?? null);
        const valid = vals.filter(v => v !== null);
        // Si FORM_SCORES existe para este país, siempre usarlo (aunque todas sean null = N/A)
        // Esto evita que datos estáticos viejos sobreescriban respuestas actuales del form
        return {
          avg: valid.length ? valid.reduce((a, b) => a + b, 0) / valid.length : null,
          full: vals.filter(v => v === 100).length,
          partial: vals.filter(v => v === 50).length,
          fail: vals.filter(v => v === 0).length,
          na: vals.filter(v => v === null).length,
          total: vals.length,
        };
      };
      const prevData = state.country === "CO" ? (window.PREV_CO_SCORES || null) : null;

      byId("basics").innerHTML = `
        <div class="hint">Cumplimiento promedio por básico en ${data().name}${state.cityFilter === "Todas" ? "" : ` · ${state.cityFilter}`} · ${typeLabel()}. Las barras usan las respuestas reales del cuestionario.${prevData ? " · ↑↓= vs Q1 2026. <span style=\'color:#e53e3e;font-weight:600\'>Rojo</span> = reincidencia." : ""}</div>
        ${temas.map(tema => {
          const topicQuestions = questions.filter(question =>
            (question.tema || "Sin tema") === tema
          );
          if (!topicQuestions.length) return "";
          return `
            <article class="panel basic-group">
              <div class="panel-title">${tema}</div>
              ${topicQuestions.map(question => {
                const summary = basicsFormSummarize(question.no) || summarizeQuestionValues(question.index, matches);
                const value = summary.avg;
                const s = getStatus(value);
                const prevScore = prevData
                  ? (prevData.byQuestion?.[question.no] ?? null)
                  : null;
                const isRecurrence = prevScore !== null && value !== null && value < 70 && prevScore < 70;
                const trend = prevScore !== null && value !== null
                  ? (value > prevScore + 1.5 ? "↑" : value < prevScore - 1.5 ? "↓" : "=")
                  : null;
                const trendClass = trend === "↑" ? "up" : trend === "↓" ? "down" : "eq";
                return `
                  <div class="basic-row${isRecurrence ? " recurrence" : ""}">
                    <div class="score-head">
                      <span class="basic-question"><span class="basic-num">B${question.no}.</span>${basicName(question.index, sourceKitchen)}</span>
                      <span style="display:flex;align-items:center;gap:6px">
                        ${trend ? `<span class="trend-badge trend-${trendClass}" title="Q1 2026: ${prevScore != null ? prevScore.toFixed(1) : ""}%">${trend}</span>` : ""}
                        <span class="score-value" style="color:${s.color};min-width:42px;text-align:right">${value != null ? fmt(value) : ""}</span>
                      </span>
                    </div>
                    <div class="bar"><div class="bar-fill" style="width:${value ?? 0}%;background:${s.bar || s.color}"></div></div>
                    <div class="drill-meta" style="margin-top:-6px;margin-bottom:8px">
                      <span>${question.area || "Sin área"}</span>
                      <span>100%: ${summary.full} · 50%: ${summary.partial} · 0%: ${summary.fail} · N/A: ${summary.na}${prevScore !== null ? ` · Q1: ${prevScore.toFixed(1)}%` : ""}</span>
                    </div>
                  </div>
                `;
              }).join("")}
            </article>
          `;
        }).join("")}
      `;
    };

    const detailColumns = [
      { key: "full", title: "Básico | Cumple (100%)", statusValue: 100 },
      { key: "partial", title: "Básico | Cumple Parcialmente (50%)", statusValue: 60 },
      { key: "fail", title: "Básico | NO Cumple (0%)", statusValue: 0 },
      { key: "na", title: "Básico | No Aplica", statusValue: null },
    ];

    const selectedDetailKitchen = () => {
      const rows = filtered();
      return rows.find(k => k.id === state.detailKitchenId) || rows.find(k => k.basic != null) || rows[0];
    };

    const normalizeText = (text) => String(text || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toUpperCase()
      .replace(/[^A-Z0-9]+/g, " ")
      .trim();

    const kitchenNumber = (name) => String(name || "").match(/^\d+/)?.[0] || "";

    const sheetKitchenFor = (kitchen) => {
      if (!kitchen) return null;
      if (isCPKitchen(kitchen)) {
        return cpData().kitchens.find(item => normalizeText(item.name) === normalizeText(kitchen.id || kitchen.name)) || null;
      }
      const countryName = normalizeText(data().name);
      const candidates = sheetData().kitchens.filter(item => normalizeText(item.country) === countryName);
      const kitchenName = normalizeText(kitchen.id);
      const exact = candidates.find(item => normalizeText(item.name) === kitchenName);
      if (exact) return exact;

      const number = kitchenNumber(kitchen.id);
      const city = normalizeText(kitchen.city);
      return candidates.find(item => {
        const itemCity = normalizeText(item.city);
        return kitchenNumber(item.name) === number && (itemCity === city || itemCity.includes(city) || city.includes(itemCity));
      }) || candidates.find(item => kitchenNumber(item.name) === number) || null;
    };

    const sheetKitchensForCurrentFilter = () => filtered()
      .map(kitchen => ({ appKitchen: kitchen, sheetKitchen: sheetKitchenFor(kitchen) }))
      .filter(item => item.sheetKitchen);

    const scoreFromValues = (values) => {
      const valid = (values || []).filter(value => value != null);
      return valid.length ? valid.reduce((sum, value) => sum + value, 0) / valid.length : null;
    };

    // Dynamic country-level average: uses FORM_SCORES exclusively when available
    const countryTabScore = (countryKey) => {
      const fs = (window.FORM_SCORES || {})[countryKey];
      if (fs && Object.keys(fs.byName).length > 0) {
        // Apply the same type filter as the dashboard so tab % = % Básicos
        const kitchens = (COUNTRIES[countryKey]?.kitchens || []).filter(matchesTypeFilter);
        if (kitchens.length > 0) {
          const scores = kitchens.map(k => {
            const norm = normalizeText(k.id);
            const num  = kitchenNumber(k.id);
            return (norm && fs.byName[norm] != null) ? fs.byName[norm]
                 : (num  && fs.byNum[num]  != null) ? fs.byNum[num]
                 : null;
          }).filter(s => s != null);
          if (scores.length > 0) return scores.reduce((a, b) => a + b, 0) / scores.length;
        }
        // Fallback: average all byName scores (no type filter)
        const all = Object.values(fs.byName).filter(s => s != null);
        if (all.length > 0) return all.reduce((a, b) => a + b, 0) / all.length;
      }
      return COUNTRIES[countryKey]?.basic ?? null;
    };

    const kitchenScore = (kitchen) => {
      // 1. Try FORM_SCORES (populated on sync, keyed by country key + kitchen num/name)
      const fs = (window.FORM_SCORES || {})[state.country];
      if (fs) {
        const num  = kitchenNumber(kitchen.id);
        const norm = normalizeText(kitchen.id);
        const score = (norm && fs.byName?.[norm] != null) ? fs.byName[norm]
                    : (num  && fs.byNum?.[num]   != null) ? fs.byNum[num]
                    : undefined;
        if (score != null) return score;
      }
      // MX en Q3: una cocina que no está en el diagnóstico Q3 es "pendiente" (sin dato),
      // no mostramos el valor semilla antiguo.
      if (state.country === "MX" && window.SHEET_DETAIL_DATA_MX_Q3 && !isCPKitchen(kitchen)) return null;
      // 2. Fall back to SHEET_DETAIL_DATA values lookup
      const sheetKitchen = sheetKitchenFor(kitchen);
      if (sheetKitchen?.values?.some(v => v != null)) return scoreFromValues(sheetKitchen.values);
      // 3. Fall back to hardcoded basic
      return kitchen?.basic ?? null;
    };

    // ─────────────────────────────────────────────────────────────────────────
    // TRANSICIÓN ENTRE TRIMESTRES (Q anterior → Q actual)
    // Fusiona el cierre proyectado congelado (PREV_Q_DATA) dentro de FORM_SCORES
    // para las cocinas que aún NO tienen diagnóstico real del Q actual, de modo
    // que toda la lógica existente (score, bloques, temas, básicos, ranking)
    // muestre el punto de partida correcto sin cambios. Regla: real Q actual >
    // proyectado Q anterior; nunca reemplazar un real por una proyección.
    // Guarda el origen por cocina para badges e indicadores en window.DIAG_STATUS.
    // ─────────────────────────────────────────────────────────────────────────
    const avgOf = (arr) => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
    const currentQuarterFromToday = () => {
      const now = new Date();
      return `Q${Math.floor(now.getMonth() / 3) + 1} ${now.getFullYear()}`;
    };
    const diagCurrentLabel = () => window.CURRENT_DIAG_LABEL || currentQuarterFromToday();
    // Marca qué cocinas traían diagnóstico real del Q actual ANTES de fusionar.
    const markRealNorms = (fs) => { if (fs && !fs.__realNorms) fs.__realNorms = Object.keys(fs.byName || {}); return fs; };
    // Mapa nº de pregunta → { bloque, tema } para derivar bloques/temas del proyectado.
    const questionMetaByNo = () => {
      const map = {};
      (sheetData().questions || []).forEach(q => { if (q.no != null) map[q.no] = { bloque: q.bloque || "", tema: q.tema || "" }; });
      return map;
    };
    // Fusiona PREV_Q_DATA en FORM_SCORES para cocinas sin diagnóstico real del Q actual.
    const applyPrevQTransition = () => {
      window.DIAG_STATUS = {};
      const prevAll = window.PREV_Q_DATA || {};
      const meta = questionMetaByNo();
      for (const ck of ["MX", "CO", "PE"]) {
        const fs = (window.FORM_SCORES || {})[ck];
        if (!fs) continue;
        markRealNorms(fs);
        const prev = prevAll[ck];
        const realSet = new Set(fs.__realNorms || Object.keys(fs.byName || {}));
        const status = { currentLabel: diagCurrentLabel(), prevLabel: prev?.quarterLabel || "Q anterior", byKitchen: {} };
        (COUNTRIES[ck]?.kitchens || []).forEach(k => {
          const norm = normalizeText(k.id);
          if (!norm) return;
          const num = kitchenNumber(k.id);
          const hasReal = realSet.has(norm) && fs.byName?.[norm] != null;
          const prevScore = prev?.byKitchen?.[norm]?.score ?? null;
          status.byKitchen[norm] = { source: hasReal ? "real" : "projected", prevScore };
          if (!hasReal && prev?.byKitchen?.[norm]) {
            const byQ = prev.byKitchen[norm].byQuestion || {};
            const score = prev.byKitchen[norm].score ?? avgOf(Object.values(byQ).filter(v => v != null));
            if (score != null) { fs.byName[norm] = score; if (num) fs.byNum[num] = score; }
            fs.byKitchenQuestion = fs.byKitchenQuestion || {};
            fs.byKitchenQuestion[norm] = { ...byQ };
            const bloqueAcc = {}, temaAcc = {};
            Object.entries(byQ).forEach(([no, v]) => {
              if (v == null) return;
              const m = meta[no]; if (!m) return;
              if (m.bloque) (bloqueAcc[m.bloque] = bloqueAcc[m.bloque] || []).push(v);
              if (m.tema)   (temaAcc[m.tema]   = temaAcc[m.tema]   || []).push(v);
            });
            fs.byKitchenBloque = fs.byKitchenBloque || {};
            fs.byKitchenTema   = fs.byKitchenTema   || {};
            fs.byKitchenBloque[norm] = Object.fromEntries(Object.entries(bloqueAcc).map(([b, a]) => [b, avgOf(a)]));
            fs.byKitchenTema[norm]   = Object.fromEntries(Object.entries(temaAcc).map(([t, a]) => [t, avgOf(a)]));
          }
        });
        window.DIAG_STATUS[ck] = status;
      }
    };
    const diagActive = () => !!(window.PREV_Q_DATA && window.PREV_Q_DATA[state.country] && window.DIAG_STATUS && window.DIAG_STATUS[state.country]);
    const kitchenSource = (kitchen) => {
      if (!diagActive()) return null;
      return window.DIAG_STATUS[state.country].byKitchen[normalizeText(kitchen?.id || "")]?.source || null;
    };
    const kitchenPrevProjected = (kitchen) => {
      if (!diagActive()) return null;
      return window.DIAG_STATUS[state.country].byKitchen[normalizeText(kitchen?.id || "")]?.prevScore ?? null;
    };
    const kitchenDiagDelta = (kitchen) => {
      if (kitchenSource(kitchen) !== "real") return null;
      const prev = kitchenPrevProjected(kitchen), real = kitchenScore(kitchen);
      return (prev != null && real != null) ? real - prev : null;
    };
    const diagSummary = () => {
      if (!diagActive()) return null;
      const st = window.DIAG_STATUS[state.country];
      const kitchens = (COUNTRIES[state.country]?.kitchens || []).filter(k => !isCPKitchen(k));
      let real = 0, proj = 0;
      kitchens.forEach(k => { const s = st.byKitchen[normalizeText(k.id)]?.source; if (s === "real") real++; else if (s === "projected") proj++; });
      const total = real + proj;
      return { total, real, projected: proj, pct: total ? Math.round((real / total) * 100) : 0, currentLabel: st.currentLabel, prevLabel: st.prevLabel };
    };
    // Badge REAL / PROYECTADO (colores coherentes con la paleta existente).
    const diagBadge = (source, size = 10) => {
      if (!source) return "";
      const real = source === "real";
      const s = diagSummary();
      const bg = real ? "#E7F6FC" : "#F8F0E2";
      const color = real ? PALETTE.cyanDark : PALETTE.neutralText;
      const border = real ? "#9fd6ea" : "#e0c58a";
      const tip = real
        ? `Resultado del diagnóstico del Q actual${s ? ` (${s.currentLabel})` : ""}.`
        : `Cierre proyectado del ${s ? s.prevLabel : "Q anterior"} considerando planes de acción. Aún sin diagnóstico del Q actual.`;
      return `<span title="${tip}" style="display:inline-flex;align-items:center;gap:4px;font-size:${size}px;font-weight:700;letter-spacing:.3px;padding:2px 6px;border-radius:4px;background:${bg};color:${color};border:1px solid ${border};white-space:nowrap">${real ? "&#9679;" : "&#9680;"} ${real ? "REAL" : "PROYECTADO"}</span>`;
    };
    const diagDeltaBadge = (kitchen) => {
      const d = kitchenDiagDelta(kitchen);
      if (d == null) return "";
      const sign = d > 0 ? "+" : "";
      const color = d > 0.5 ? "#276749" : d < -0.5 ? "#9b2c2c" : PALETTE.textMuted || "#60707c";
      return `<span title="Real Q actual vs. cierre proyectado del Q anterior" style="font-size:11px;font-weight:600;color:${color}">${sign}${d.toFixed(1)} pp</span>`;
    };

    // ─────────────────────────────────────────────────────────────────────────
    // EXPORTADOR: congela el "cierre proyectado" del Q que está por cerrar.
    // Reutiliza la misma proyección por básico del dashboard (planes ejecutados o
    // en proceso suben a 100 los básicos que cubren). Produce, por país:
    //   { quarterLabel, byKitchen: { <norm>: { score, byQuestion: {no:val} } } }
    // Se ejecuta UNA vez por trimestre (window.buildPrevQSnapshot) y su salida se
    // vuelca a prev-q-data.js (ver export-prev-q.js). No muta ningún estado.
    // ─────────────────────────────────────────────────────────────────────────
    const projFixCounts = (fix) => {
      const n = normalizeText(fixStatusValue(fix));
      if (["EJECUTADO", "CERRADO", "CERRADA", "REALIZADO"].includes(n)) return true;   // ejecutado
      if (["EN PROCESO", "EN PROGRESO", "PROCESO", "EN CURSO"].includes(n)) return true; // en proceso
      return false; // pendiente / despriorizado / otros → no proyecta
    };
    window.buildPrevQSnapshot = ({ countries = ["MX"], quarterLabel = null } = {}) => {
      const savedCountry = state.country;
      const snap = {};
      try {
        countries.forEach(ck => {
          state.country = ck;
          const label = quarterLabel || `Q${reportQuarter()} ${REPORT_YEAR}`;
          const fsK = (window.FORM_SCORES || {})[ck];
          const hasFsData = !!fsK?.byKitchenQuestion;
          const byKitchen = {};
          (COUNTRIES[ck]?.kitchens || []).forEach(k => {
            if (isCPKitchen(k)) return;
            const norm = normalizeText(k.id);
            const sheetKitchen = sheetKitchenFor(k);
            const formQ = fsK?.byKitchenQuestion?.[norm] || null;
            const questions = detailDataForKitchen(k).questions.map((q, index) => ({ ...q, index }));
            if (!questions.length) return;
            const fixes = fixesForKitchen(k).filter(fix => projFixCounts(fix) && fixMatchesKitchen(fix, k, ck));
            const byQuestion = {};
            const vals = [];
            questions.forEach(q => {
              const sv = sheetKitchen ? sheetKitchen.values[q.index] : null;
              const formVal = formQ ? (formQ[q.no] ?? null) : null;
              const value = hasFsData ? formVal : (sv != null ? sv : formVal);
              if (value == null) return;
              const covered = fixes.some(fix => fixMatchesQuestion(fix, q, ck));
              const projected = (covered && value < 100) ? 100 : value;
              if (q.no != null) byQuestion[q.no] = projected;
              vals.push(projected);
            });
            if (!vals.length) return;
            const score = Math.round((vals.reduce((a, b) => a + b, 0) / vals.length) * 10) / 10;
            byKitchen[norm] = { score, byQuestion };
          });
          snap[ck] = { quarterLabel: label, byKitchen };
        });
      } finally {
        state.country = savedCountry;
      }
      return snap;
    };

    const sheetKitchensForDashboardDrill = () => {
      return filtered()
        .filter(kitchen => state.typeFilter === "cp" ? isCPKitchen(kitchen) : !isCPKitchen(kitchen))
        .map(kitchen => ({ appKitchen: kitchen, sheetKitchen: sheetKitchenFor(kitchen) }))
        .filter(item => item.sheetKitchen);
    };

    const detailCategory = (value) => {
      const t = state.country === "CO" ? 80 : state.country === "MX" ? 90 : 75;
      if (value == null) return "na";
      if (value >= t) return "full";
      if (value >= 50) return "partial";
      return "fail";
    };

    const detailRowsForKitchen = (kitchen) => {
      const sheetKitchen = sheetKitchenFor(kitchen);
      const sourceData = detailDataForKitchen(kitchen);
      if (sheetKitchen && sourceData.questions.length) {
        const drFsK = (window.FORM_SCORES || {})[state.country];
        const drNormId = normalizeText(kitchen?.id || "");
        const drFormQ = drFsK?.byKitchenQuestion?.[drNormId] || null;
        // Para CO, FORM_SCORES tiene prioridad sobre datos estáticos (son más recientes)
        const hasFsData = !!drFsK?.byKitchenQuestion;
        return sourceData.questions
          .map((question, _i, arr) => {
            const index = sourceData.questions.indexOf(question);
            const sv = sheetKitchen.values[index];
            const formVal = drFormQ ? (drFormQ[question.no] ?? null) : null;
            // Si hay FORM_SCORES para este país, úsalos primero; sino usa estático
            const value = hasFsData ? formVal : (sv != null ? sv : formVal);
            return {
              name: `B${question.no}. ${basicName(index, kitchen)}`,
              value,
              qNo: question.no,
              questions: 1,
              category: detailCategory(value),
            };
          });
      }

      if (!kitchen || kitchen.basic == null) {
        return Array.from({ length: TOTAL_BASICS }, (_, index) => ({
          name: `B${index + 1}. ${basicName(index, kitchen)}`,
          value: null,
          qNo: index + 1,
          questions: 1,
          category: "na",
        }));
      }

      const countryBasic = data().basic || kitchen.basic;
      const kitchenFactor = kitchen.basic / countryBasic;
      return Array.from({ length: TOTAL_BASICS }, (_, index) => {
        const countryBasicValue = data().basics[index];
        const adjustedValue = countryBasicValue == null ? null : Math.max(0, Math.min(100, Math.round(countryBasicValue * kitchenFactor)));
        return {
          name: `B${index + 1}. ${basicName(index, kitchen)}`,
          value: adjustedValue,
          questions: 1,
          category: detailCategory(adjustedValue),
        };
      });
    };

    const renderColumnItems = (items, prevScores) => {
      if (!items.length) return `<div class="empty" style="padding:12px 0">Sin básicos en esta categoría</div>`;
      return `
        <div class="detail-cell-list">
          ${items.map(item => {
            const s = getStatus(item.value);
            const prevQ = prevScores && item.qNo != null ? (prevScores[item.qNo] ?? null) : null;
            const worsened = prevQ !== null && item.value !== null && item.value < prevQ - 1.5;
            return `
              <div class="detail-item${worsened ? ' detail-item-worsened' : ''}">
                <div class="detail-item-name">${item.name}</div>
                <div class="detail-item-meta">
                  Porcentaje: <strong style="color:${s.color}">${item.value != null ? fmt(item.value) : "No aplica"}</strong>
                  · Cantidad de preguntas: ${item.questions}
                  ${prevQ !== null ? `· ${trendBadgeHtml(item.value, prevQ)} Q1: ${prevQ.toFixed(1)}%` : ""}
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    };

    const renderKitchenDetailSheet = () => {
      const kitchen = selectedDetailKitchen();
      const detailOptions = filtered();
      const rows = detailRowsForKitchen(kitchen);
      const grouped = detailColumns.reduce((acc, col) => ({ ...acc, [col.key]: [] }), {});
      rows.forEach(row => grouped[row.category].push(row));
      const totalQuestions = rows.reduce((sum, row) => sum + row.questions, 0);

      const detailPrevScores = (() => {
        if (state.country !== "CO" || !window.PREV_CO_SCORES) return null;
        return window.PREV_CO_SCORES.byKitchen?.[normalizeText(kitchen?.id || "")]?.byQuestion || null;
      })();
      byId("kitchen-detail-sheet").innerHTML = `
        <article class="panel">
          <div class="detail-picker">
            <div>
              <label for="detailKitchenSelect">Selecciona cocina</label>
              <div class="detail-sub">${data().name} · ${kitchen?.city ?? "Sin ciudad"}</div>
            </div>
            <select id="detailKitchenSelect">
              ${detailOptions.map(k => `<option value="${k.id}" ${k.id === kitchen?.id ? "selected" : ""}>${k.id} · ${k.city}</option>`).join("")}
            </select>
          </div>

          <div class="detail-summary">
            <div class="detail-stat">
              <div class="detail-stat-label">Porcentaje total de la cocina</div>
              <div class="detail-stat-value" style="color:${getStatus(kitchenScore(kitchen)).color}">${kitchenScore(kitchen) != null ? fmt(kitchenScore(kitchen)) : "Pendiente"}</div>
              <div class="detail-stat-sub">${kitchen?.id ?? "Sin cocina seleccionada"}</div>
            </div>
            ${detailColumns.map(col => {
              const items = grouped[col.key];
              const count = items.reduce((sum, item) => sum + item.questions, 0);
              const avg = items.length ? items.reduce((sum, item) => sum + (item.value ?? 0), 0) / items.length : null;
              const s = getStatus(col.statusValue);
              return `
                <div class="detail-stat">
                  <div class="detail-stat-label">${col.title}</div>
                  <div class="detail-stat-value" style="color:${s.color}">${count}</div>
                  <div class="detail-stat-sub">${totalQuestions ? ((count / totalQuestions) * 100).toFixed(0) : 0}% de preguntas · Promedio ${avg != null ? fmt(avg) : "N/A"}</div>
                </div>
              `;
            }).join("")}
          </div>

          <div class="detail-table-wrap">
            <table class="detail-table">
              <thead>
                <tr>
                  ${detailColumns.map(col => `<th>${col.title}</th>`).join("")}
                </tr>
              </thead>
              <tbody>
                <tr>
                  ${detailColumns.map(col => {
                    const items = grouped[col.key];
                    const count = items.reduce((sum, item) => sum + item.questions, 0);
                    const avg = items.length ? items.reduce((sum, item) => sum + (item.value ?? 0), 0) / items.length : null;
                    return `
                      <td>
                        <div class="detail-col-total">
                          <span>${count} pregunta(s)</span>
                          <span>${avg != null ? fmt(avg) : "N/A"}</span>
                        </div>
                        ${renderColumnItems(items, detailPrevScores)}
                      </td>
                    `;
                  }).join("")}
                </tr>
              </tbody>
            </table>
          </div>

          <div class="info">La vista usa el cuestionario correspondiente a la cocina seleccionada: cocinas regulares desde Detalle x Cocina y Centros de Producción desde CP Preguntas/Form CP.</div>
        </article>
      `;
    };

    const renderKitchenQuestionDrilldown = (kitchen) => {
      const sheetKitchen = sheetKitchenFor(kitchen);
      const questions = detailDataForKitchen(kitchen).questions.map((question, index) => ({ ...question, index }));
      // FORM_SCORES fallback: use byKitchenQuestion[normId][question.no] when sheetKitchen is absent or value is null
      const fsK = (window.FORM_SCORES || {})[state.country];
      const normKitchenId = normalizeText(kitchen?.id || "");
      const formQScores = fsK?.byKitchenQuestion?.[normKitchenId] || null;
      if (!sheetKitchen && !formQScores || !questions.length) {
        return `<div class="drilldown"><div class="hint">No hay detalle de preguntas para esta cocina.</div></div>`;
      }
      const hasFsData = !!fsK?.byKitchenQuestion;
      const getQValue = (question) => {
        const sv = sheetKitchen ? sheetKitchen.values[question.index] : undefined;
        const formVal = formQScores ? (formQScores[question.no] ?? null) : null;
        return hasFsData ? formVal : (sv != null ? sv : formVal);
      };

      const blockNames = [...new Set(questions.map(question => question.bloque || "Sin bloque"))];
      if (!state.kitchenBlock || !blockNames.includes(state.kitchenBlock)) {
        state.kitchenBlock = blockNames[0];
        state.kitchenTheme = null;
      }

      const blockCards = blockNames.map(block => {
        const blockQuestions = questions.filter(question => (question.bloque || "Sin bloque") === block);
        const values = blockQuestions.map(getQValue).filter(value => value != null);
        const avg = values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : null;
        const s = getStatus(avg);
        return `
          <button class="drill-card ${state.kitchenBlock === block ? "active" : ""}" data-kitchen-block="${block}" type="button">
            <div class="drill-title">${block}</div>
            <div class="drill-meta"><span>${blockQuestions.length} básicos</span><strong style="color:${s.color}">${avg != null ? fmt(avg) : "N/A"}</strong></div>
            <div class="bar" style="height:4px;margin:8px 0 0"><div class="bar-fill" style="width:${avg ?? 0}%;background:${s.bar || s.color}"></div></div>
          </button>
        `;
      }).join("");

      const selectedBlockQuestions = questions.filter(question => (question.bloque || "Sin bloque") === state.kitchenBlock);
      const themeNames = [...new Set(selectedBlockQuestions.map(question => question.tema || "Sin tema"))];
      if (!state.kitchenTheme || !themeNames.includes(state.kitchenTheme)) {
        state.kitchenTheme = themeNames[0];
      }

      const themeCards = themeNames.map(theme => {
        const themeQuestions = selectedBlockQuestions.filter(question => (question.tema || "Sin tema") === theme);
        const values = themeQuestions.map(getQValue).filter(value => value != null);

        return window.PREV_CO_SCORES.byKitchen?.[normalizeText(kitchen?.id || "")]?.byQuestion || null;

          const scoreStr = value != null ? value + "%" : "N/A";

          return `
            <div class="question-row${worsened ? ' detail-item-worsened' : ''}">
              <div class="question-text" style="display:flex;align-items:center;gap:6px">
                B${question.no}. ${basicName(question.index, kitchen)}

              </div>

                <span>${question.area || "Sin área"}</span>

              <div class="bar" style="height:6px;margin-bottom:0"><div class="bar-fill" style="width:${value ?? 0}%;background:${s.bar || s.color}"></div></div>
            </div>
          `;
        }).join("");

      return `
        <div class="drilldown">
          <div class="small-title">Detalle por bloque</div>
          <div class="drill-grid">${blockCards}</div>
          <div class="small-title">Temas de ${state.kitchenBlock}</div>

    const moneyValue = (value) => {
      const text = String(value || "").trim();
      if (!text) return 0;
      const cleaned = text
        .replace(/[^\d,.-]/g, "")
        .replace(/^[.,]+/, "")            // quita separadores colgantes al inicio (ej. "S/." deja un ".")
        .replace(/[.,]+$/, "")            // quita separadores colgantes al final
        .replace(/\.(?=\d{3}(\D|$))/g, "")
        .replace(/,(?=\d{3}(\D|$))/g, "")
        .replace(",", ".");
      const number = Number(cleaned);
      return Number.isFinite(number) ? number : 0;
    };

    const formatMoney = (value) => {
      if (!value) return "$0";
      return `$${new Intl.NumberFormat("es-CO", { maximumFractionDigits: 0 }).format(value)}`;
    };

    const renderFixes = () => {
      const fixColumns = [
        { key: "subcategoria", label: "Subcategoría", width: 132 },
        { key: "area", label: "Área", width: 82, value: row => row.area || row.responsable || "" },

      const fixValue = (row, column) => {

      const filterRows = (rows) => rows.filter(row => fixColumns.every(col => {

      const rawRows = fixesForCurrentType().filter(row => {

      const filterOptionsFor = (columnKey) => {
        const scopedRows = rawRows.filter(row => fixColumns.every(col => {
          if (col.key === columnKey) return true;
          const filter = state.fixFilters[col.key];
          if (!filter) return true;
          return normalizeText(fixValue(row, col.key)) === normalizeText(filter);
        }));
        return [...new Set(scopedRows.map(row => fixValue(row, columnKey)).filter(Boolean))]
          .sort((a, b) => String(a).localeCompare(String(b), "es"));

      const rows = filterRows(rawRows);
      const totalBudget = rows.reduce((sum, row) => sum + moneyValue(row.totalQ || row.cotizacion || row.total || ""), 0);
      const _total = rows.length || 1;
      const statusPct = (n) => `${Math.round(n / _total * 100)}% del total`;
      const ejecutadoRows   = rows.filter(row => { const s = normalizeText(row.status || ""); return ["EJECUTADO","CERRADO","CERRADA","REALIZADO"].some(k => s.includes(k)); });
      const enProcesoRows   = rows.filter(row => { const s = normalizeText(row.status || ""); return s.includes("EN PROCESO") || s === "PROCESO"; });
      const pendienteRows   = rows.filter(row => normalizeText(row.status || "").includes("PENDIENTE"));
      const desPriorizRows  = rows.filter(row => { const s = normalizeText(row.status || ""); return s.includes("DESPRIORIZADO") || s.includes("DESCARTADO"); });
      const tableWidth = fixColumns.reduce((sum, col) => sum + col.width, 0);

      byId("fixes").innerHTML = `

          </div>

          <div class="detail-summary">
            <div class="detail-stat">
              <div class="detail-stat-label">Total fixes</div>
              <div class="detail-stat-value">${rows.length}</div>

            </div>
            <div class="detail-stat">
              <div class="detail-stat-label">Ejecutado</div>

            <div class="detail-stat">
              <div class="detail-stat-label">En proceso</div>

              <div class="detail-stat-sub">${statusPct(enProcesoRows.length)}</div>
            </div>
            <div class="detail-stat">
              <div class="detail-stat-label">Pendiente</div>
              <div class="detail-stat-value" style="color:${PALETTE.neutralText}">${pendienteRows.length}</div>
              <div class="detail-stat-sub">${statusPct(pendienteRows.length)}</div>
            </div>
            <div class="detail-stat">
              <div class="detail-stat-label">Despriorizado</div>
              <div class="detail-stat-value" style="color:${PALETTE.mauve}">${desPriorizRows.length}</div>
              <div class="detail-stat-sub">${statusPct(desPriorizRows.length)}</div>
            </div>
            <div class="detail-stat">
              <div class="detail-stat-label">Presupuesto total Q</div>
              <div class="detail-stat-value" style="color:${PALETTE.cyanDark}">${formatMoney(totalBudget)}</div>
              <div class="detail-stat-sub">Suma del filtro actual</div>
            </div>
          </div>

          <div class="table-scroll-top" id="fixTopScroll"><div style="width:${tableWidth}px;height:1px"></div></div>
          <div class="detail-table-wrap" id="fixTableScroll">
            <table class="fix-table">
              <thead>
                <tr>
                  ${fixColumns.map(col => `<th style="width:${col.width}px">${col.label}</th>`).join("")}
                </tr>
                <tr>
                  ${fixColumns.map(col => `
                    <th style="width:${col.width}px">
                      <select class="fix-filter" data-fix-filter="${col.key}">
                        <option value="">Todos</option>
                        ${filterOptionsFor(col.key).map(value => `<option value="${value}" ${state.fixFilters[col.key] === value ? "selected" : ""}>${value}</option>`).join("")}
                      </select>
                    </th>
                  `).join("")}
                </tr>
              </thead>
              <tbody>
                ${rows.map(row => `
                  <tr>
                    <td>${row.subcategoria || ""}</td>
                    <td>${row.area || row.responsable || ""}</td>
                    <td>${row.cocina || ""}</td>
                    <td>${row.ciudad || ""}</td>
                    <td>${row.semana || ""}</td>
                    <td>
                      <div class="fix-action">${row.iniciativa || ""}</div>
                      ${row.cotizacion ? `<div class="fix-muted">Cotización: ${row.cotizacion}</div>` : ""}
                      ${row.presupuesto ? `<div class="fix-muted">Presupuesto: ${row.presupuesto}</div>` : ""}
                      ${row.evidencia ? `<div class="fix-muted">Evidencia: ${row.evidencia}</div>` : ""}
                    </td>
                    <td>${row.basic || ""}</td>
                    <td>${row.compromiso || ""}</td>
                    <td>${row.cierre || ""}</td>

                    <td>${row.prioridad || ""}</td>
                    <td>${row.status || ""}</td>

                `).join("") || `<tr><td colspan="${fixColumns.length}" class="empty">Sin fixes para el filtro seleccionado</td></tr>`}
              </tbody>
            </table>
          </div>
        </article>
      `;
      syncFixScroll();
